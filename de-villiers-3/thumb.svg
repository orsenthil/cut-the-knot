<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Four dots on a circle, their tangents, and the pair of quadrilaterals
       linked by the half-size homothety. -->
  <circle cx="160" cy="100" r="64" fill="none" stroke="#7d86c9" stroke-width="2"/>
  <polygon points="224,100 188,151 121,132 122,58" fill="none" stroke="#8f86ff" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="227,140 137,175 87,92 197,45" fill="none" stroke="#5d9c8f" stroke-width="2.5" stroke-linejoin="round"/>
  <g stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4" fill="none">
    <line x1="224" y1="100" x2="227" y2="140"/>
    <line x1="188" y1="151" x2="137" y2="175"/>
    <line x1="121" y1="132" x2="87" y2="92"/>
    <line x1="122" y1="58" x2="197" y2="45"/>
  </g>
  <polygon points="212,121 147,149 108,94 190,68" fill="none" stroke="#c08a5a" stroke-width="2.5" stroke-dasharray="6 4" stroke-linejoin="round"/>
  <g fill="#c084fc" stroke="#20242c" stroke-width="2">
    <circle cx="224" cy="100" r="5"/>
    <circle cx="188" cy="151" r="5"/>
    <circle cx="121" cy="132" r="5"/>
    <circle cx="122" cy="58" r="5"/>
  </g>
  <g fill="#4bbfa0" stroke="#20242c" stroke-width="2">
    <circle cx="227" cy="140" r="4"/>
    <circle cx="137" cy="175" r="4"/>
    <circle cx="87" cy="92" r="4"/>
    <circle cx="197" cy="45" r="4"/>
  </g>
  <circle cx="160" cy="100" r="4" fill="#e5c07b" stroke="#20242c" stroke-width="2"/>
</svg>
