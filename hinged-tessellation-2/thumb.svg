<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A fragment of the hinged pattern: two rigid squares on the sides of the
       hinge rhombus, with the freed triangles between them. Flat mid-tones. -->
  <g stroke="#8891a1" stroke-width="1.6" stroke-linejoin="round">
    <polygon points="132,63 212,100 235,60 195,38" fill="#6d74cf" fill-opacity="0.85"/>
    <polygon points="93,100 132,63 150,38 110,75" fill="#c4874a" fill-opacity="0.85"/>
    <polygon points="132,63 212,100 132,123" fill="#3f9a8d" fill-opacity="0.85"/>
    <polygon points="132,63 132,123 93,100" fill="#b0618c" fill-opacity="0.85"/>
    <polygon points="132,63 150,38 195,38" fill="#6d74cf" fill-opacity="0.5"/>
    <polygon points="132,123 150,163 195,163" fill="#3f9a8d" fill-opacity="0.5"/>
    <polygon points="93,100 58,100 110,140" fill="#b0618c" fill-opacity="0.5"/>
  </g>
  <polygon points="132,63 212,100 132,123 93,100" fill="none" stroke="#d6dae2" stroke-width="2" stroke-dasharray="6 5"/>
  <g fill="#e6e8ee" stroke="#596173" stroke-width="1.5">
    <circle cx="132" cy="63" r="4"/>
    <circle cx="212" cy="100" r="4"/>
    <circle cx="132" cy="123" r="4"/>
  </g>
</svg>
