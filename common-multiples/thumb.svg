<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The key moment: P = 2 above, Q = 3 below, and the first common multiple
       (6) lit up as a blue dot on the number line. Flat mid-tone colours read
       on both white and near-black cards. -->
  <g stroke="#9aa3b2" stroke-width="2">
    <line x1="24" y1="100" x2="296" y2="100"/>
  </g>
  <g stroke="#8b93a3" stroke-width="2" stroke-linecap="round">
    <line x1="45" y1="95" x2="45" y2="105"/>
    <line x1="87" y1="95" x2="87" y2="105"/>
    <line x1="129" y1="95" x2="129" y2="105"/>
    <line x1="171" y1="95" x2="171" y2="105"/>
    <line x1="213" y1="95" x2="213" y2="105"/>
    <line x1="255" y1="95" x2="255" y2="105"/>
    <line x1="297" y1="95" x2="297" y2="105"/>
  </g>

  <!-- P's row: hollow handle at 2, red dots at 4, 6, 8, 10, 12. -->
  <g fill="#d4565a">
    <circle cx="108" cy="58" r="7"/>
    <circle cx="150" cy="58" r="7"/>
    <circle cx="192" cy="58" r="7"/>
    <circle cx="234" cy="58" r="7"/>
    <circle cx="276" cy="58" r="7"/>
  </g>
  <circle cx="66" cy="58" r="10" fill="none" stroke="#8f86ff" stroke-width="4"/>

  <!-- Q's row: hollow handle at 3, red dots at 6, 9, 12. -->
  <g fill="#d4565a">
    <circle cx="150" cy="142" r="7"/>
    <circle cx="213" cy="142" r="7"/>
    <circle cx="276" cy="142" r="7"/>
  </g>
  <circle cx="87" cy="142" r="10" fill="none" stroke="#8f86ff" stroke-width="4"/>

  <!-- Blue dots on the line: the common multiples, starting at 6. -->
  <circle cx="150" cy="100" r="11" fill="#4c9be0" opacity="0.35"/>
  <circle cx="150" cy="100" r="7" fill="#4c9be0"/>
  <circle cx="276" cy="100" r="7" fill="#4c9be0"/>
</svg>
