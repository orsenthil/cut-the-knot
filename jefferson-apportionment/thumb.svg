<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="An apportionment table whose quotas are all rounded down to fill the house exactly">
  <rect x="20" y="24" width="280" height="152" rx="10" fill="#3b4353" stroke="#aab4c4" stroke-width="2"/>
  <g font-size="12" fill="#dbe3ef" font-weight="700">
    <text x="36" y="50">State</text><text x="100" y="50">Pop.</text><text x="170" y="50">Quota</text><text x="240" y="50">Final</text>
  </g>
  <path d="M30 58 H290" stroke="#aab4c4" stroke-width="1.5"/>
  <g font-size="13" fill="#e9eef6">
    <text x="36" y="84">A</text><text x="100" y="84">100</text><text x="170" y="84">4.35</text><text x="240" y="84">4</text>
    <text x="36" y="112">B</text><text x="100" y="112">200</text><text x="170" y="112">8.70</text><text x="240" y="112">9</text>
    <text x="36" y="140">C</text><text x="100" y="140">300</text><text x="170" y="140">13.04</text><text x="240" y="140">13</text>
  </g>
  <rect x="160" y="124" width="64" height="24" rx="5" fill="none" stroke="#d9a441" stroke-width="2.5" stroke-dasharray="4 3"/>
</svg>
