<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Two rows of counters: three in the top heap and five in the bottom heap, with the last counter of each row highlighted as a safe pair">
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#e9eef6">
    <text x="16" y="62">3</text>
    <text x="16" y="142">5</text>

    <g fill="#58637a" stroke="#aab4c4" stroke-width="1.5">
      <rect x="40" y="42" width="34" height="34" rx="6"/>
      <rect x="82" y="42" width="34" height="34" rx="6"/>
      <rect x="124" y="42" width="34" height="34" rx="6"/>

      <rect x="40" y="122" width="34" height="34" rx="6"/>
      <rect x="82" y="122" width="34" height="34" rx="6"/>
      <rect x="124" y="122" width="34" height="34" rx="6"/>
      <rect x="166" y="122" width="34" height="34" rx="6"/>
      <rect x="208" y="122" width="34" height="34" rx="6"/>
    </g>

    <!-- the safe pair: the last counter in each heap -->
    <rect x="124" y="42" width="34" height="34" rx="6" fill="#6a5df0" stroke="#c4bcff" stroke-width="2"/>
    <rect x="208" y="122" width="34" height="34" rx="6" fill="#6a5df0" stroke="#c4bcff" stroke-width="2"/>

    <!-- a dashed arrow from the pair to a small caption -->
    <path d="M225 96 C225 106 225 106 225 118" fill="none" stroke="#6a5df0" stroke-width="2.5" stroke-dasharray="4 4"/>
    <polygon points="225,120 220,110 230,110" fill="#6a5df0"/>
    <text x="250" y="105" fill="#c4bcff" font-size="12">safe pair</text>
  </g>
</svg>
