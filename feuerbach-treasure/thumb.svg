  </g>
  <polygon points="92,153 60,46 254,92" fill="#8f86ff" fill-opacity="0.10" stroke="#8f86ff" stroke-width="2.6" stroke-linejoin="round"/>
  <g stroke="#8f86ff" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="92" y1="153" x2="163" y2="73"/>
    <line x1="60" y1="46" x2="130" y2="140"/>
  </g>
  <circle cx="130" cy="110" r="23" fill="#e05263" fill-opacity="0.12" stroke="#e05263" stroke-width="2.2"/>
  <circle cx="239" cy="29" r="42" fill="none" stroke="#e05263" stroke-width="1.8" stroke-opacity="0.75" stroke-dasharray="6 5"/>
  <circle cx="61" cy="170" r="27" fill="none" stroke="#e05263" stroke-width="1.8" stroke-opacity="0.75" stroke-dasharray="6 5"/>
  <circle cx="157" cy="133" r="4.5" fill="#4ade80"/>
  <circle cx="199" cy="63" r="4.5" fill="#ffd166"/>
  <circle cx="105" cy="110" r="4.5" fill="#ffd166"/>
  <circle cx="155" cy="101" r="3.5" fill="#8f86ff"/>
  <g fill="#8f86ff" stroke="#0b0c0f" stroke-opacity="0.25" stroke-width="1.5">
    <circle cx="92" cy="153" r="6"/>
    <circle cx="60" cy="46" r="6"/>
    <circle cx="254" cy="92" r="6"/>
