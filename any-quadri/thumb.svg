<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The key moment: the three bimedians of a skewed quadrilateral meet and
       are bisected at the same dot G. Mid-tones read on white and near-black. -->
  <g fill="none" stroke-linecap="round">
    <polygon points="40,50 250,30 280,170 50,100" stroke="#7b83c7" stroke-width="4"/>

    <!-- the two bimedians through midpoints of opposite sides -->
    <line x1="145" y1="40" x2="165" y2="135" stroke="#8f86ff" stroke-width="4"/>
    <line x1="265" y1="100" x2="45" y2="75" stroke="#8f86ff" stroke-width="4"/>

    <!-- Newton's line, through the midpoints of the diagonals -->
    <line x1="150" y1="65" x2="160" y2="110" stroke="#4f9d78" stroke-width="4"/>
  </g>

  <g fill="#8f86ff">
    <circle cx="145" cy="40" r="5"/>
    <circle cx="265" cy="100" r="5"/>
    <circle cx="165" cy="135" r="5"/>
    <circle cx="45" cy="75" r="5"/>
  </g>
  <g fill="#4f9d78">
    <circle cx="150" cy="65" r="5"/>
    <circle cx="160" cy="110" r="5"/>
  </g>
  <circle cx="155" cy="87.5" r="9" fill="#d0a24a" stroke="#ffffff" stroke-width="2"/>
</svg>
