<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <title>A circle crossing a triangle, with three perpendiculars meeting at one point</title>
  <!-- Transparent background; mid-tones that read on white and near-black. -->
  <path d="M 76 151 L 186 44 L 258 151 Z" fill="none" stroke="#9aa7b8" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="170" cy="104" r="64" fill="none" stroke="#7f8cff" stroke-width="3"/>
  <g stroke="#ff9a8a" stroke-width="2" stroke-dasharray="5 5" opacity="0.85">
    <path d="M 108 128 L 130 133"/>
    <path d="M 108 128 L 220 89"/>
    <path d="M 108 128 L 205 151"/>
  </g>
  <circle cx="130" cy="133" r="4" fill="#ff9a8a"/>
  <circle cx="220" cy="89" r="4" fill="#ff9a8a"/>
  <circle cx="205" cy="151" r="4" fill="#ff9a8a"/>
  <g stroke="#4fbf9f" stroke-width="3" stroke-linecap="round">
    <path d="M 194 58 L 228 106"/>
    <path d="M 194 58 L 169 153"/>
    <path d="M 194 58 L 108 137"/>
  </g>
  <g fill="#4fbf9f">
    <circle cx="228" cy="106" r="4.5"/>
    <circle cx="169" cy="153" r="4.5"/>
    <circle cx="108" cy="137" r="4.5"/>
  </g>
  <circle cx="108" cy="128" r="6" fill="#ff8a80"/>
  <circle cx="194" cy="58" r="6" fill="#4fbf9f"/>
  <circle cx="170" cy="104" r="4" fill="#d4b36b"/>
</svg>
