<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The key moment: four tangent lines wrapped round a circle, touching it
       at four dots. Flat mid-tone shapes, transparent background. -->
  <circle cx="160" cy="100" r="34" fill="#8f86ff" fill-opacity="0.18" stroke="#8f86ff" stroke-width="3"/>
  <polygon points="214,60 118,71 136,146 186,126" fill="#8f86ff" fill-opacity="0.12" stroke="#b9b2ff" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#66c2a5">
    <circle cx="191" cy="113" r="5"/>
    <circle cx="173" cy="132" r="5"/>
    <circle cx="127" cy="108" r="5"/>
    <circle cx="148" cy="66" r="5"/>
  </g>
  <g stroke="#66c2a5" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="214" y1="60" x2="191" y2="113"/>
    <line x1="214" y1="60" x2="148" y2="66"/>
    <line x1="118" y1="71" x2="148" y2="66"/>
    <line x1="118" y1="71" x2="127" y2="108"/>
  </g>
</svg>
