<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Nine numbered boxes in a row; the sixth is empty and a loose number 4 below it is being dragged up into place">
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <g fill="#58637a" stroke="#aab4c4" stroke-width="1.5">
      <rect x="18" y="46" width="28" height="34" rx="5"/>
      <rect x="52" y="46" width="28" height="34" rx="5"/>
      <rect x="86" y="46" width="28" height="34" rx="5"/>
      <rect x="120" y="46" width="28" height="34" rx="5"/>
      <rect x="154" y="46" width="28" height="34" rx="5"/>
      <rect x="222" y="46" width="28" height="34" rx="5"/>
      <rect x="256" y="46" width="28" height="34" rx="5"/>
      <rect x="290" y="46" width="28" height="34" rx="5"/>
    </g>
    <g fill="#f2f5fa">
      <text x="32" y="69">3</text>
      <text x="66" y="69">2</text>
      <text x="100" y="69">1</text>
      <text x="134" y="69">6</text>
      <text x="168" y="69">5</text>
      <text x="236" y="69">9</text>
      <text x="270" y="69">8</text>
      <text x="304" y="69">7</text>
    </g>

    <!-- the empty box that the number is heading for -->
    <rect x="188" y="46" width="28" height="34" rx="5" fill="#2f3542" stroke="#d9a441" stroke-width="2.5" stroke-dasharray="4 3"/>

    <!-- the loose number and the path into the box -->
    <g fill="#d9a441" stroke="#8a6a12" stroke-width="1.5">
      <rect x="186" y="146" width="32" height="36" rx="6"/>
    </g>
    <text x="202" y="172" fill="#232830">4</text>
    <path d="M202 144 C202 116 202 100 202 84" fill="none" stroke="#d9a441" stroke-width="2.5" stroke-dasharray="5 5"/>
    <polygon points="202,78 197,88 207,88" fill="#d9a441"/>

    <!-- two loose tiles left at the bottom -->
    <g fill="#58637a" stroke="#aab4c4" stroke-width="1.5">
      <rect x="120" y="146" width="32" height="36" rx="6"/>
      <rect x="264" y="146" width="32" height="36" rx="6"/>
    </g>
    <g fill="#f2f5fa">
      <text x="136" y="172">7</text>
      <text x="280" y="172">1</text>
    </g>
  </g>
</svg>
