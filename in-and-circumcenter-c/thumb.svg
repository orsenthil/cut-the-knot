  <path d="M160 139 L160 90" fill="none" stroke="#e3b341" stroke-width="3" stroke-dasharray="5 4" stroke-linecap="round"/>
  <path d="M160 111 L160 118 L153 118" fill="none" stroke="#5b6474" stroke-width="1.8" opacity="0.8"/>
