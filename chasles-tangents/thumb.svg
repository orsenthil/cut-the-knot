<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A circle, its fixed top tangent, and four tangents cutting it. -->
  <circle cx="110" cy="120" r="54" fill="#6f78a8" fill-opacity="0.16" stroke="#6f78a8" stroke-width="3"/>
  <line x1="20" y1="66" x2="300" y2="66" stroke="#8f86ff" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#9aa1ad" stroke-width="2" stroke-linecap="round">
    <line x1="149" y1="158" x2="240" y2="66"/>
    <line x1="162" y1="134" x2="180" y2="66"/>
    <line x1="162" y1="106" x2="151" y2="66"/>
    <line x1="149" y1="82" x2="132" y2="66"/>
  </g>
  <g fill="#e0b43c" stroke="#6f78a8" stroke-width="1.5">
    <circle cx="240" cy="66" r="5"/>
    <circle cx="180" cy="66" r="5"/>
    <circle cx="151" cy="66" r="5"/>
    <circle cx="132" cy="66" r="5"/>
  </g>
  <g fill="#5b8def" stroke="#f3f5f8" stroke-width="2">
    <circle cx="110" cy="66" r="6"/>
    <circle cx="149" cy="158" r="6"/>
    <circle cx="162" cy="134" r="6"/>
    <circle cx="162" cy="106" r="6"/>
    <circle cx="149" cy="82" r="6"/>
    <circle cx="64" cy="150" r="6"/>
  </g>
</svg>
