<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Three mutually tangent circles at the corners of a triangle, the small
       inner Soddy circle, and the three joins through opposite touch points. -->
  <g fill="none" stroke="#7ba7d4" stroke-width="3" opacity="0.9">
    <circle cx="159" cy="52" r="30"/>
    <circle cx="129" cy="136" r="59"/>
    <circle cx="207" cy="90" r="32"/>
  </g>
  <g stroke="#93b7a2" stroke-width="2" opacity="0.95">
    <line x1="88" y1="-97" x2="253" y2="268"/>
    <line x1="45" y1="241" x2="296" y2="-70"/>
    <line x1="365" y1="131" x2="-24" y2="40"/>
  </g>
  <circle cx="170" cy="86" r="6" fill="#e09374" stroke="#f4d8c8" stroke-width="2"/>
  <circle cx="170" cy="86" r="4" fill="#f0c05a"/>
  <g fill="#7ba7d4">
    <circle cx="159" cy="52" r="4"/>
    <circle cx="129" cy="136" r="4"/>
    <circle cx="207" cy="90" r="4"/>
  </g>
</svg>
