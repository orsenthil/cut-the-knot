<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <title>Two rivers, two towns and the shortest road with two bridges</title>
  <!-- The two river strips, each between a pair of parallel banks. -->
  <rect x="0" y="55" width="320" height="25" fill="#6f7785" fill-opacity="0.35"/>
  <rect x="0" y="120" width="320" height="25" fill="#6f7785" fill-opacity="0.35"/>
  <g stroke="#5d6672" stroke-width="2">
    <path d="M0 55 H320 M0 80 H320 M0 120 H320 M0 145 H320"/>
  </g>
  <!-- The translated towns A' and B', joined by a dashed straight line. -->
  <path d="M40 50 L280 155" fill="none" stroke="#b07d2e" stroke-width="2" stroke-dasharray="7 5"/>
  <!-- The shortest road: land, bridge, land, bridge, land. -->
  <g fill="none" stroke="#2f9e70" stroke-width="4" stroke-linejoin="round">
    <path d="M40 25 L109 55 M109 80 L200 120 M257 145 L280 180"/>
  </g>
  <g fill="none" stroke="#3f74b8" stroke-width="6">
    <path d="M109 55 V80 M200 120 L257 145"/>
  </g>
  <g fill="#3f74b8" stroke="#f2f4f7" stroke-width="1.5">
    <circle cx="40" cy="25" r="5"/>
    <circle cx="280" cy="180" r="5"/>
    <circle cx="109" cy="55" r="3.5"/>
    <circle cx="109" cy="80" r="3.5"/>
    <circle cx="200" cy="120" r="3.5"/>
    <circle cx="257" cy="145" r="3.5"/>
  </g>
</svg>
