<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="A Sierpinski gasket fractal made of three self-similar triangles">
  <g fill="#6a5df0">
    <polygon points="160,25 95,135 225,135"/>
    <polygon points="160,25 127,80 193,80" fill="#3b4353"/>
    <polygon points="127,135 95,135 111,108" fill="#3b4353"/>
    <polygon points="193,135 225,135 209,108" fill="#3b4353"/>
    <g fill="#8f86ff">
      <polygon points="160,25 143,52 177,52"/>
      <polygon points="111,108 95,135 127,135"/>
      <polygon points="209,108 193,135 225,135"/>
