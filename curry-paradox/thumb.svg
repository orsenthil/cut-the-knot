<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The big triangle with a small triangle, a larger one, and the leftover rectangle between them. -->
  <rect x="30" y="30" width="260" height="100" fill="none" stroke="#8b93a3" stroke-width="3"/>
  <polygon points="290,30 290,70 190,70" fill="#e08a2e" stroke="#8b93a3" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="30,130 190,130 190,70" fill="#3aa675" stroke="#8b93a3" stroke-width="3" stroke-linejoin="round"/>
  <rect x="190" y="70" width="100" height="60" fill="#e0b84a" fill-opacity="0.55" stroke="#8b93a3" stroke-width="3"/>
  <line x1="30" y1="130" x2="290" y2="30" stroke="#d4565a" stroke-width="3" stroke-dasharray="8 6"/>
  <g fill="#8b93a3"><rect x="40" y="150" width="60" height="30" opacity="0.6"/><rect x="110" y="150" width="70" height="30"/></g>
</svg>
