<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="A multiplication lattice with digits above and beside it and diagonal sums below">
  <g font-family="ui-monospace, monospace" font-size="12" fill="#dbe3ef" text-anchor="middle">
    <text x="90" y="30">7</text><text x="150" y="30">1</text><text x="210" y="30">2</text>
    <text x="265" y="62">2</text><text x="265" y="122">3</text>
  </g>
  <g fill="#2f3542" stroke="#aab4c4" stroke-width="1.5">
    <rect x="60" y="40" width="60" height="60"/><rect x="120" y="40" width="60" height="60"/><rect x="180" y="40" width="60" height="60"/>
    <rect x="60" y="100" width="60" height="60"/><rect x="120" y="100" width="60" height="60"/><rect x="180" y="100" width="60" height="60"/>
  </g>
  <g stroke="#aab4c4" stroke-width="1.5">
    <path d="M60 40 L120 100 M120 40 L180 100 M180 40 L240 100 M60 100 L120 160 M120 100 L180 160 M180 100 L240 160"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="13" fill="#e9eef6" text-anchor="middle">
    <text x="90" y="180">1</text><text x="150" y="180">6</text><text x="210" y="180">3</text>
  </g>
  <text x="160" y="198" fill="#c4bcff" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">712 × 23 = 16376</text>
</svg>
