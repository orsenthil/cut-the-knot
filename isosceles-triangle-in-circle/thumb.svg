<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- An isosceles triangle: the line EO meets CD at a right angle. -->
  <circle cx="160" cy="146" r="106" fill="none" stroke="#7584aa" stroke-width="1.6" stroke-dasharray="5 5"/>
  <g fill="none" stroke="#adb9d6" stroke-width="2.4" stroke-linejoin="round">
    <path d="M160 40 L55 160 L265 160 Z"/>
  </g>
  <path d="M265 160 L107.5 100" fill="none" stroke="#e5a13c" stroke-width="2.6"/>
  <path d="M177.5 100 L160 146" fill="none" stroke="#5ec2a0" stroke-width="3"/>
  <path d="M160 40 L160 160" fill="none" stroke="#8f86ff" stroke-width="1.6" stroke-dasharray="5 5"/>
  <!-- Right-angle square at the crossing of EO and CD. -->
  <path d="M164.8 130.6 L172.3 133.6 L175.4 126.1" fill="none" stroke="#5ec2a0" stroke-width="2"/>
  <g fill="#8f86ff" stroke="#f4f6ff" stroke-width="1.5">
    <circle cx="160" cy="40" r="5"/>
    <circle cx="55" cy="160" r="5"/>
    <circle cx="265" cy="160" r="5"/>
  </g>
  <g fill="#e5a13c" stroke="#f4f6ff" stroke-width="1.5">
    <circle cx="107.5" cy="100" r="4.5"/>
  </g>
  <g fill="#8f86ff" stroke="#f4f6ff" stroke-width="1.5">
    <circle cx="177.5" cy="100" r="4.5"/>
  </g>
  <g fill="#5ec2a0" stroke="#f4f6ff" stroke-width="1.5">
    <circle cx="160" cy="146" r="5"/>
  </g>
  <g fill="#c3cce3" font-family="system-ui, sans-serif" font-size="16" font-weight="600">
    <text x="150" y="31">A</text>
    <text x="34" y="170">B</text>
    <text x="270" y="170">C</text>
    <text x="88" y="95">D</text>
    <text x="182" y="95">E</text>
    <text x="135" y="163">O</text>
  </g>
</svg>
