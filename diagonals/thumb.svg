<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="A convex octagon cut into six triangles by five non-crossing diagonals">
  <polygon points="160,15 220.1,39.9 245,100 220.1,160.1 160,185 99.9,160.1 75,100 99.9,39.9"
           fill="#99a3b2" stroke="#4e5867" stroke-width="3" stroke-linejoin="round"/>

  <g stroke="#6a5df0" stroke-width="3" stroke-linecap="round">
    <line x1="160" y1="15"    x2="245"   y2="100"/>
    <line x1="245" y1="100"   x2="160"   y2="185"/>
    <line x1="160" y1="185"   x2="75"    y2="100"/>
    <line x1="75"  y1="100"   x2="160"   y2="15"/>
    <line x1="160" y1="15"    x2="160"   y2="185"/>
  </g>

  <g fill="#f0f2f6" stroke="#4e5867" stroke-width="2.5">
    <circle cx="160"   cy="15"    r="7"/>
    <circle cx="220.1" cy="39.9"  r="7"/>
    <circle cx="245"   cy="100"   r="7"/>
    <circle cx="220.1" cy="160.1" r="7"/>
    <circle cx="160"   cy="185"   r="7"/>
    <circle cx="99.9"  cy="160.1" r="7"/>
    <circle cx="75"    cy="100"   r="7"/>
    <circle cx="99.9"  cy="39.9"  r="7"/>
  </g>
</svg>
