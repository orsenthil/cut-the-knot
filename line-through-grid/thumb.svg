<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <title>A diagonal crossing squares of a grid</title>
  <rect x="60" y="20" width="200" height="150" fill="none" stroke="#6b7280" stroke-width="2"/>
  <g stroke="#6b7280" stroke-width="1" opacity="0.7">
    <path d="M110 20 V170 M160 20 V170 M210 20 V170 M260 20 V170"/>
    <path d="M60 50 H260 M60 80 H260 M60 110 H260 M60 140 H260"/>
  </g>
  <g fill="#7c6ee6" opacity="0.55">
    <rect x="60" y="20" width="50" height="30"/>
    <rect x="110" y="20" width="50" height="30"/>
    <rect x="110" y="50" width="50" height="30"/>
    <rect x="160" y="50" width="50" height="30"/>
    <rect x="160" y="80" width="50" height="30"/>
    <rect x="210" y="80" width="50" height="30"/>
    <rect x="210" y="110" width="50" height="30"/>
    <rect x="210" y="140" width="50" height="30"/>
  </g>
  <path d="M60 20 L260 170" fill="none" stroke="#d1495b" stroke-width="4"/>
  <circle cx="60" cy="20" r="4" fill="#d1495b"/>
  <circle cx="260" cy="170" r="4" fill="#d1495b"/>
  <g font-family="system-ui, sans-serif" font-size="17" fill="#374151">
    <text x="160" y="192" text-anchor="middle">4 x 5 grid</text>
  </g>
</svg>
