<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="A four by four board with one missing corner, covered by five L-shaped trominoes in blue, orange and purple">
  <!-- Transparent background. A 4x4 board, 40 px a square. -->
  <rect x="80" y="20" width="160" height="160" rx="5" fill="#3a4252"/>
  <g transform="translate(80 20) scale(40)" stroke="#5c6678" stroke-width="0.025" opacity="0.8">
    <line x1="0" y1="1" x2="4" y2="1"/>
    <line x1="0" y1="2" x2="4" y2="2"/>
    <line x1="0" y1="3" x2="4" y2="3"/>
    <line x1="1" y1="0" x2="1" y2="4"/>
    <line x1="2" y1="0" x2="2" y2="4"/>
    <line x1="3" y1="0" x2="3" y2="4"/>
  </g>

  <!-- The missing square. -->
  <rect x="80" y="20" width="40" height="40" fill="#11151d"/>
  <rect x="84" y="24" width="32" height="32" rx="4" fill="none" stroke="#9aa1ad" stroke-width="2" stroke-dasharray="5 5" opacity="0.9"/>

  <!-- The unique tiling of the 4x4 board, one L per corner orientation. -->
  <g transform="translate(80 20) scale(40)" stroke="#22283a" stroke-width="0.06" stroke-linejoin="round">
    <polygon points="1,0 2,0 2,2 0,2 0,1 1,1" transform="translate(1 1)" fill="#4e79a7"/>
    <polygon points="1,0 2,0 2,2 0,2 0,1 1,1" transform="translate(0 0)" fill="#f28e2b"/>
    <polygon points="0,0 2,0 2,2 1,2 1,1 0,1" transform="translate(2 0)" fill="#b07aa1"/>
    <polygon points="1,0 2,0 2,2 0,2 0,1 1,1" transform="translate(2 2)" fill="#59a14f"/>
    <polygon points="0,0 1,0 1,1 2,1 2,2 0,2" transform="translate(0 2)" fill="#4e79a7"/>
  </g>
</svg>
