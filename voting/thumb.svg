<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <title>Four ways of counting the same ballots</title>
  <g fill="none" stroke="#5c6b7a" stroke-width="3">
    <rect x="18" y="36" width="84" height="128" rx="10" fill="#dfe7ef"/>
    <rect x="118" y="36" width="84" height="128" rx="10" fill="#e6e1ef"/>
    <rect x="218" y="36" width="84" height="128" rx="10" fill="#e3ecdf"/>
  </g>
  <g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#2f3a45">
    <text x="60" y="29">Plurality</text>
    <text x="160" y="29">Borda</text>
    <text x="260" y="29">Head to head</text>
  </g>
  <g font-family="sans-serif" font-size="20" text-anchor="middle" fill="#354b60">
    <text x="60" y="78">A</text>
    <text x="60" y="108">B</text>
    <text x="60" y="138">C</text>
  </g>
  <g font-family="sans-serif" font-size="20" text-anchor="middle" fill="#4c3f63">
    <text x="160" y="78">B</text>
    <text x="160" y="108">A</text>
    <text x="160" y="138">C</text>
  </g>
  <g font-family="sans-serif" font-size="20" text-anchor="middle" fill="#3d5733">
    <text x="260" y="78">A</text>
    <text x="260" y="108">B</text>
    <text x="260" y="138">C</text>
  </g>
  <g font-family="sans-serif" font-size="15" text-anchor="middle" fill="#526070">
    <text x="60" y="162">5 voters</text>
    <text x="160" y="162">5 voters</text>
    <text x="260" y="162">5 voters</text>
  </g>
  <g font-family="sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#a3542c">
    <text x="60" y="187">A wins</text>
    <text x="160" y="187">B wins</text>
    <text x="260" y="187">A wins</text>
  </g>
</svg>
