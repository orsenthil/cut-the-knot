<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A triangle, three collinear points Pa, Pb, Pc on its side lines, and
       their isotomic partners Qa, Qb, Qc on another line. Flat mid-tones so
       the card reads on both white and near-black backgrounds. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 165 L250 165 L155 35 Z" stroke="#6c7bd6" stroke-width="3"/>
    <path d="M88.5 126 L292.75 165" stroke="#c2362b" stroke-width="2.6"/>
    <path d="M17.25 165 L183.5 74" stroke="#5b4ee8" stroke-width="2.6" stroke-dasharray="7 5"/>
  </g>
  <g fill="#6c7bd6">
    <circle cx="60" cy="165" r="4.5"/>
    <circle cx="250" cy="165" r="4.5"/>
    <circle cx="155" cy="35" r="4.5"/>
  </g>
  <g fill="#c2362b">
    <circle cx="221.5" cy="126" r="5"/>
    <circle cx="126.5" cy="74" r="5"/>
    <circle cx="292.75" cy="165" r="5"/>
  </g>
  <g fill="#5b4ee8">
    <circle cx="183.5" cy="74" r="5"/>
    <circle cx="88.5" cy="126" r="5"/>
    <circle cx="17.25" cy="165" r="5"/>
  </g>
  <g fill="#d98b4a">
    <circle cx="202.5" cy="100" r="2.6"/>
    <circle cx="107.5" cy="100" r="2.6"/>
    <circle cx="155" cy="165" r="2.6"/>
  </g>
</svg>
