<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Two small number triangles, one building by addition and one by subtraction">
  <g font-family="ui-monospace, monospace" font-size="13" text-anchor="middle" fill="#e9eef6">
    <text x="80" y="40">1</text>
    <text x="60" y="70">1</text><text x="100" y="70">1</text>
    <text x="40" y="100">1</text><text x="80" y="100">2</text><text x="120" y="100">1</text>
    <text x="20" y="130">1</text><text x="60" y="130">3</text><text x="100" y="130">3</text><text x="140" y="130">1</text>
    <text x="240" y="40">1/1</text>
    <text x="220" y="70">1/2</text><text x="260" y="70">1/2</text>
    <text x="200" y="100">1/3</text><text x="240" y="100">1/6</text><text x="280" y="100">1/3</text>
  </g>
  <text x="160" y="180" fill="#c4bcff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Pascal ↑   ·   Leibniz ↓</text>
</svg>
