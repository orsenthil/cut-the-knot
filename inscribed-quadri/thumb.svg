<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Four corners on one circle, the three centre quadrilaterals and the
       shared line through H, N, G and O. Flat mid-tone colours read on
       either theme; the background stays transparent. -->
  <circle cx="160" cy="100" r="72" fill="none" stroke="#7c86a8" stroke-width="2" stroke-dasharray="5 6"/>
  <polygon points="222,100 104,100 76,137 196,164" fill="none" stroke="#e0e4f2" stroke-width="2.5"/>
  <polygon points="98,62 216,62 244,99 124,126" fill="none" stroke="#d9776a" stroke-width="2" opacity="0.9"/>
  <polygon points="139,81 181,81 196,112 154,112" fill="none" stroke="#66b6a0" stroke-width="2" opacity="0.9"/>
  <polygon points="153,91 174,91 181,106 160,106" fill="none" stroke="#8f86ff" stroke-width="2" opacity="0.95"/>
  <line x1="95" y1="64" x2="225" y2="132" stroke="#f0c35a" stroke-width="2.5" stroke-linecap="round"/>
  <g fill="#ecf0fa" stroke="#59627e" stroke-width="2">
    <circle cx="222" cy="100" r="6"/>
    <circle cx="104" cy="100" r="6"/>
    <circle cx="76" cy="137" r="6"/>
    <circle cx="196" cy="164" r="6"/>
  </g>
  <g stroke="#1d2030" stroke-width="1.5">
    <circle cx="114" cy="73" r="6" fill="#f0c35a"/>
    <circle cx="146" cy="88" r="5" fill="#d9776a"/>
    <circle cx="166" cy="97" r="5" fill="#8f86ff"/>
    <circle cx="196" cy="113" r="5" fill="#66b6a0"/>
  </g>
</svg>
