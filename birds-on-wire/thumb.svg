<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Birds sitting on a wire with some gaps highlighted">
  <!-- The wire and the gaps a bird claims -->
  <g stroke="#8a97aa" stroke-width="3" stroke-linecap="round">
    <line x1="22" y1="66" x2="298" y2="66"/>
  </g>
  <g fill="#c99a3c" opacity="0.8">
    <rect x="42" y="52" width="46" height="28" rx="7"/>
    <rect x="152" y="52" width="34" height="28" rx="7"/>
    <rect x="232" y="52" width="48" height="28" rx="7"/>
  </g>
  <g fill="#72839b">
    <circle cx="42" cy="66" r="7"/>
    <circle cx="88" cy="66" r="7"/>
    <circle cx="152" cy="66" r="7"/>
    <circle cx="186" cy="66" r="7"/>
    <circle cx="232" cy="66" r="7"/>
    <circle cx="280" cy="66" r="7"/>
  </g>

  <!-- A small plot: the average settles as the flock grows -->
  <g stroke="#8a97aa" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 48 108 L 48 172 L 292 172"/>
  </g>
  <g fill="#6f61d0">
    <circle cx="70" cy="118" r="5"/>
    <circle cx="110" cy="132" r="5"/>
    <circle cx="152" cy="139" r="5"/>
    <circle cx="200" cy="144" r="5"/>
    <circle cx="250" cy="146" r="5"/>
    <circle cx="286" cy="147" r="5"/>
  </g>
</svg>
