<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Four corners on one circle, their extended sides and the four circles
       that all pass through the Miquel point K. -->
  <g fill="none" stroke-width="2">
    <circle cx="160" cy="100" r="58" stroke="#9aa3ad" stroke-dasharray="6 5"/>
    <circle cx="170" cy="158" r="40" stroke="#3fb8a8"/>
    <circle cx="240" cy="110" r="50" stroke="#8f86ff"/>
    <circle cx="150" cy="105" r="78" stroke="#e8a24a" stroke-dasharray="10 6"/>
    <circle cx="205" cy="80" r="84" stroke="#d97a8f" stroke-dasharray="10 6"/>
  </g>
  <g stroke="#aab3c0" stroke-width="2.5" fill="none">
    <path d="M160 158 L200 140 L288 96"/>
    <path d="M200 140 L213 81 L288 96"/>
    <path d="M213 81 L120 60 L140 184"/>
    <path d="M120 60 L160 158 L140 184"/>
  </g>
  <path d="M288 96 L190 132 L140 184" fill="none" stroke="#3fb8a8" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="160,158 200,140 213,81 120,60" fill="#8f86ff" fill-opacity="0.18" stroke="#aab3c0" stroke-width="2.5"/>
  <g fill="#8f86ff" stroke="#ffffff" stroke-width="1.5">
    <circle cx="160" cy="158" r="5"/><circle cx="200" cy="140" r="5"/>
    <circle cx="213" cy="81" r="5"/><circle cx="120" cy="60" r="5"/>
  </g>
  <g fill="#e8a24a"><circle cx="288" cy="96" r="5"/><circle cx="140" cy="184" r="5"/></g>
  <circle cx="190" cy="132" r="6" fill="#3fb8a8" stroke="#ffffff" stroke-width="1.5"/>
</svg>
