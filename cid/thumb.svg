    <path d="M160 20 L70 170 M160 20 L250 170"/>
  </g>
  <path d="M70 170 L250 170 L81 152 L219 118 L129 72 L160 20"
        fill="none" stroke="#7568e6" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#2f9c8f">
    <circle cx="70" cy="170" r="4"/>
    <circle cx="250" cy="170" r="4"/>
    <circle cx="81" cy="152" r="3.5"/>
    <circle cx="219" cy="118" r="3.5"/>
    <circle cx="129" cy="72" r="3.5"/>
  </g>
  <g fill="none" stroke="#2f9c8f" stroke-width="2.4" stroke-linecap="round">
    <path d="M155 170 L165 170 M160 159 L171 145 M168 132 L178 138 M143 95 L153 92"/>
  </g>
  <circle cx="160" cy="20" r="4.5" fill="#7568e6"/>
