<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A parallelogram, the first four equilateral tips and the second set
       landing back on the original corners. Mid-tones read on light and dark. -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="70,130 120,60 250,75 200,145"
             fill="#8f86ff" fill-opacity="0.16" stroke="#8f86ff" stroke-width="3"
             stroke-dasharray="6 5"/>
    <g stroke="#c4b9ff" stroke-width="2">
      <path d="M70 130 L156 138 L120 60 M120 60 L172 180 L250 75
               M250 75 L164 67 L200 145 M200 145 L148 25 L70 130"/>
    </g>
    <polygon points="156,138 172,180 164,67 148,25"
             stroke="#f87171" stroke-width="2.5"/>
    <polygon points="200,145 70,130 120,60 250,75"
             stroke="#4ade80" stroke-width="4" stroke-opacity="0.85"/>
  </g>
  <g fill="#d8deea">
    <circle cx="70" cy="130" r="4"/>
    <circle cx="120" cy="60" r="4"/>
    <circle cx="250" cy="75" r="4"/>
    <circle cx="200" cy="145" r="4"/>
  </g>
</svg>
