    <line x1="53.8" y1="119.3" x2="181.6" y2="37.7"/>
    <line x1="53.8" y1="119.3" x2="202.2" y2="150.7"/>
    <line x1="276" y1="78.9" x2="129.2" y2="156"/>
    <line x1="276" y1="78.9" x2="111.4" y2="58.4"/>
  </g>
  <g fill="#e08766" fill-opacity="0.3" stroke="#d27655" stroke-width="2.5">
    <circle cx="105" cy="110" r="52"/>
    <circle cx="215" cy="90" r="62"/>
  </g>
  <g fill="#2f9e63" fill-opacity="0.55" stroke="#2f9e63" stroke-width="2">
    <circle cx="128.1" cy="105.8" r="28.6"/>
    <circle cx="182.1" cy="96" r="28.6"/>
  </g>
  <g fill="#1f2430">
