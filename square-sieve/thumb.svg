<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Numbers one to twelve; the squares 1, 4 and 9 are red and circled">
  <g font-family="ui-monospace, monospace" font-size="22" text-anchor="middle" fill="#7a86ff">
    <g transform="translate(0,0)">
      <text x="60" y="70" fill="#ff6b6b">1</text><text x="120" y="70">2</text><text x="180" y="70">3</text><text x="240" y="70" fill="#ff6b6b">4</text>
      <text x="60" y="115">5</text><text x="120" y="115">6</text><text x="180" y="115">7</text><text x="240" y="115">8</text>
      <text x="60" y="160" fill="#ff6b6b">9</text><text x="120" y="160">10</text><text x="180" y="160">11</text><text x="240" y="160">12</text>
    </g>
  </g>
  <g fill="none" stroke="#ff6b6b" stroke-width="3"><circle cx="60" cy="63" r="20"/><circle cx="240" cy="63" r="20"/><circle cx="60" cy="153" r="20"/></g>
</svg>
