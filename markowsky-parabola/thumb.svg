<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Two dots on a parabola, the line from the vertex O to B, and the level
       segment CD whose ends give the two matching angles at D. -->
  <g fill="none" stroke-linecap="round">
    <path d="M 20 158 Q 100 -32 180 158" stroke="#8f86ff" stroke-width="5"/>
    <path d="M 100 18 V 178" stroke="#7f8794" stroke-width="3" stroke-dasharray="7 6"/>
    <path d="M 100 160 L 170 137" stroke="#d3a24a" stroke-width="4"/>
    <path d="M 140 30 V 147" stroke="#7f8794" stroke-width="3" stroke-dasharray="6 5"/>
    <path d="M 100 147 H 140" stroke="#52bfa5" stroke-width="6"/>
    <path d="M 100 147 L 140 85 M 100 147 L 170 137" stroke="#d3a24a" stroke-width="4"/>
  </g>
  <g fill="#8f86ff">
    <circle cx="140" cy="85" r="8"/>
    <circle cx="170" cy="137" r="8"/>
  </g>
  <g fill="#52bfa5">
    <circle cx="140" cy="147" r="6"/>
    <circle cx="100" cy="147" r="6"/>
  </g>
  <circle cx="100" cy="160" r="6" fill="#d3a24a"/>
  <g fill="#5c6472" font-family="system-ui, sans-serif" font-size="20" font-weight="600">
    <text x="147" y="82">A</text>
    <text x="178" y="139">B</text>
    <text x="147" y="160">C</text>
    <text x="72" y="154">D</text>
    <text x="84" y="185">O</text>
  </g>
</svg>
