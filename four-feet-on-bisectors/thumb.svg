<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The theorem's key moment: four feet of A on the bisectors at B and C,
       all sitting on one line. Flat mid-tone colours, transparent background. -->
  <g fill="none" stroke-linecap="round">
    <path d="M 62 158 L 258 158 L 150 42 Z" stroke="#6f8dd0" stroke-width="3"/>
    <path d="M 62 158 L 276 60" stroke="#c88b62" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M 62 158 L 150 42 M 62 158 L 20 96" stroke="#c88b62" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M 258 158 L 92 64 M 258 158 L 302 96" stroke="#c88b62" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M 28 112 L 292 112" stroke="#62a582" stroke-width="3"/>
  </g>
  <g fill="#62a582">
    <circle cx="58" cy="112" r="6"/>
    <circle cx="112" cy="112" r="6"/>
    <circle cx="194" cy="112" r="6"/>
    <circle cx="258" cy="112" r="6"/>
  </g>
  <circle cx="150" cy="42" r="6" fill="#6f8dd0"/>
  <circle cx="62" cy="158" r="6" fill="#6f8dd0"/>
  <circle cx="258" cy="158" r="6" fill="#6f8dd0"/>
</svg>
