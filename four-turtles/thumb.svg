<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Four turtles on a turning stack of squares, spiralling into the centre. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M160 24 262 100 160 176 58 100 Z" stroke="#8f86ff" stroke-width="5"/>
    <path d="M160 45 235 100 160 155 85 100 Z" stroke="#b4aeff" stroke-width="4" transform="rotate(11 160 100)"/>
    <path d="M160 66 208 100 160 134 112 100 Z" stroke="#6f66d4" stroke-width="3" transform="rotate(24 160 100)"/>
    <path d="M160 85 183 100 160 115 137 100 Z" stroke="#9a92ef" stroke-width="2" transform="rotate(40 160 100)"/>
  </g>
  <g fill="#5b4ee8">
    <circle cx="160" cy="24" r="7"/>
    <circle cx="262" cy="100" r="7"/>
    <circle cx="160" cy="176" r="7"/>
    <circle cx="58" cy="100" r="7"/>
  </g>
  <circle cx="160" cy="100" r="5" fill="#15803d"/>
</svg>
