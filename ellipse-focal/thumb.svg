<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="t d">
  <title id="t">Focal definition of an ellipse</title>
  <desc id="d">An ellipse inside a dashed box, two yellow foci, a point P on the curve, and a two-piece bar copying the two focal distances.</desc>
  <rect x="55" y="50" width="210" height="100" fill="none" stroke="#8d95a5" stroke-width="2" stroke-dasharray="5 5"/>
  <ellipse cx="160" cy="100" rx="105" ry="50" fill="none" stroke="#c3cad6" stroke-width="3"/>
  <path d="M 98 60 L 68 100" fill="none" stroke="#d76a5c" stroke-width="5" stroke-linecap="round"/>
  <path d="M 98 60 L 252 100" fill="none" stroke="#6a8cff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="68" cy="100" r="6" fill="#f2c94c" stroke="#c3cad6" stroke-width="1.5"/>
  <circle cx="252" cy="100" r="6" fill="#f2c94c" stroke="#c3cad6" stroke-width="1.5"/>
  <circle cx="98" cy="60" r="7" fill="#d76a5c" stroke="#f3f5f8" stroke-width="2"/>
  <path d="M 55 180 L 106 180" fill="none" stroke="#d76a5c" stroke-width="7" stroke-linecap="round"/>
  <path d="M 106 180 L 265 180" fill="none" stroke="#6a8cff" stroke-width="7" stroke-linecap="round"/>
  <circle cx="55" cy="180" r="4" fill="#f2c94c"/>
  <circle cx="106" cy="180" r="4" fill="#f2c94c"/>
  <circle cx="265" cy="180" r="4" fill="#f2c94c"/>
</svg>
