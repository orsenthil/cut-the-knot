  <line x1="142" y1="136" x2="160" y2="100" stroke="#6b7280" stroke-width="2"/>
  <line x1="50" y1="155" x2="160" y2="100" stroke="#6b7280" stroke-width="2"/>
  <polygon points="80,70 130,160 60,150" fill="#8f86ff" fill-opacity="0.16" stroke="#8f86ff" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="40,55 142,136 50,155" fill="#4ade80" fill-opacity="0.12" stroke="#6b7280" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="112" y1="81" x2="38" y2="191" stroke="#8f86ff" stroke-width="2.5" stroke-dasharray="6 5"/>
  <circle cx="96.7" cy="100" r="4" fill="#4ade80"/>
  <circle cx="68.4" cy="151.2" r="4" fill="#4ade80"/>
  <circle cx="52.5" cy="180" r="4" fill="#4ade80"/>
  <circle cx="160" cy="100" r="7" fill="#f5c518" stroke="#6b7280" stroke-width="2"/>
</svg>
