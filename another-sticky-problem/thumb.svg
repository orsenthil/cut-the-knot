<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Two chocolate-brick sticks: a whole one above, and one broken into two pieces below">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3a06a"/>
      <stop offset="1" stop-color="#9a6231"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9945c"/>
      <stop offset="1" stop-color="#8d5527"/>
    </linearGradient>
  </defs>

  <!-- N: one whole stick of four unit squares -->
  <g>
    <rect x="72" y="38" width="176" height="46" rx="9" fill="url(#bar)" stroke="#6b3e1d" stroke-width="3"/>
    <line x1="116" y1="41" x2="116" y2="81" stroke="#6b3e1d" stroke-width="2" opacity="0.55"/>
    <line x1="160" y1="41" x2="160" y2="81" stroke="#6b3e1d" stroke-width="2" opacity="0.55"/>
    <line x1="204" y1="41" x2="204" y2="81" stroke="#6b3e1d" stroke-width="2" opacity="0.55"/>
    <rect x="78" y="43" width="164" height="8" rx="4" fill="#f2d3a8" opacity="0.6"/>
  </g>

  <!-- N+1: a longer stick, broken after two unit squares -->
  <g>
    <rect x="50" y="120" width="88" height="46" rx="9" fill="url(#bar2)" stroke="#6b3e1d" stroke-width="3"/>
    <line x1="94" y1="123" x2="94" y2="163" stroke="#6b3e1d" stroke-width="2" opacity="0.55"/>
    <rect x="56" y="125" width="76" height="8" rx="4" fill="#f2d3a8" opacity="0.55"/>
  </g>
  <g>
    <rect x="156" y="120" width="132" height="46" rx="9" fill="url(#bar2)" stroke="#6b3e1d" stroke-width="3"/>
    <line x1="200" y1="123" x2="200" y2="163" stroke="#6b3e1d" stroke-width="2" opacity="0.55"/>
    <line x1="244" y1="123" x2="244" y2="163" stroke="#6b3e1d" stroke-width="2" opacity="0.55"/>
    <rect x="162" y="125" width="120" height="8" rx="4" fill="#f2d3a8" opacity="0.55"/>
  </g>

  <!-- the break: a dashed cut, with the two pieces moving apart -->
  <line x1="147" y1="112" x2="147" y2="174" stroke="#f0a04b" stroke-width="3" stroke-dasharray="5 6" stroke-linecap="round"/>
  <path d="M136 143 h-11 m7 -6 l-7 6 l7 6" fill="none" stroke="#f0a04b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M158 143 h11 m-7 -6 l7 6 l-7 6" fill="none" stroke="#f0a04b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- a small spark for the move that wins -->
  <path d="M147 96 v-11 M138 100 l-6 -7 M156 100 l6 -7" fill="none" stroke="#f0a04b" stroke-width="3" stroke-linecap="round"/>
</svg>
