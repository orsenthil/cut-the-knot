  <g fill="none" stroke="#9aa4b2" stroke-width="2">
    <line x1="55" y1="158" x2="265" y2="104" stroke-dasharray="6 5"/>
    <path d="M 221 150 L 213 150 L 213 158"/>
  </g>
  <g fill="none" stroke="#e6e9ef" stroke-width="2.5">
    <line x1="265" y1="158" x2="265" y2="90"/>
    <line x1="221" y1="73" x2="265" y2="104"/>
  </g>
  <line x1="221" y1="73" x2="221" y2="158" stroke="#e6e9ef" stroke-width="2"/>
  <line x1="221" y1="73" x2="221" y2="115" stroke="#4ade80" stroke-width="6" stroke-linecap="round"/>
  <line x1="221" y1="115" x2="221" y2="158" stroke="#ffc857" stroke-width="6" stroke-linecap="round"/>
  <g fill="#8f86ff">
