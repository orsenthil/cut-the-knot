<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Four numbers on a circle, 3 8 2 5, and the gaps between them, 5 6 3 2">
  <circle cx="160" cy="100" r="70" fill="none" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="3 6"/>
  <g font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <g fill="#9aa3b2"><circle cx="160" cy="30" r="19"/><circle cx="230" cy="100" r="19"/><circle cx="160" cy="170" r="19"/><circle cx="90" cy="100" r="19"/></g>
    <g fill="#ffffff" font-size="20"><text x="160" y="30">3</text><text x="230" y="100">8</text><text x="160" y="170">2</text><text x="90" y="100">5</text></g>
    <g fill="none" stroke="#5b4ee8" stroke-width="3"><circle cx="209.5" cy="50.5" r="16"/><circle cx="209.5" cy="149.5" r="16"/><circle cx="110.5" cy="149.5" r="16"/><circle cx="110.5" cy="50.5" r="16"/></g>
    <g fill="#5b4ee8" font-size="17"><text x="209.5" y="50.5">5</text><text x="209.5" y="149.5">6</text><text x="110.5" y="149.5">3</text><text x="110.5" y="50.5">2</text></g>
  </g>
</svg>
