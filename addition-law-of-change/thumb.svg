<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="The equation one plus one equals two above rows of dots showing the two groups and their union, with one addend being increased">
  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle" font-weight="700">
    <text x="64" y="46" font-size="26" fill="#e9eef6">1</text>
    <text x="118" y="46" font-size="22" fill="#aab4c4">+</text>
    <text x="172" y="46" font-size="26" fill="#e9eef6">2</text>
    <text x="226" y="46" font-size="22" fill="#aab4c4">=</text>
    <text x="280" y="46" font-size="26" fill="#8f86ff">3</text>
    <path d="M48 58 h44" stroke="#d9a441" stroke-width="3" stroke-dasharray="4 3"/>
    <polygon points="92,58 82,53 82,63" fill="#d9a441"/>

    <g font-size="12" font-weight="400" fill="#aab4c4" text-anchor="start">
      <text x="24" y="88">First group</text><text x="24" y="126">Second group</text><text x="24" y="164">Together</text>
    </g>
    <g>
      <circle cx="150" cy="83" r="6" fill="#6a5df0"/>
      <circle cx="150" cy="121" r="6" fill="#c2653a"/><circle cx="172" cy="121" r="6" fill="#c2653a"/>
      <circle cx="150" cy="159" r="6" fill="#aab4c4"/><circle cx="172" cy="159" r="6" fill="#6a5df0"/><circle cx="194" cy="159" r="6" fill="#c2653a"/>
    </g>
  </g>
</svg>
