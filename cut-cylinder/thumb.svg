<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <title>A cylinder cut by a sloping sheet</title>
  <!-- The cylinder's round side, seen from the side. -->
  <path d="M 62 58 H 246 V 142 H 62 Z" fill="#8f86ff" opacity="0.22"/>
  <path d="M 62 58 H 246 M 62 142 H 246" fill="none" stroke="#8f86ff" stroke-width="4"/>
  <ellipse cx="62" cy="100" rx="12" ry="42" fill="none" stroke="#8f86ff" stroke-width="4"/>
  <ellipse cx="246" cy="100" rx="12" ry="42" fill="none" stroke="#8f86ff" stroke-width="4"/>
  <!-- The cutting sheet, sloping up across the cylinder. -->
  <path d="M 96 176 L 224 24 L 250 42 L 122 194 Z" fill="#56c5b0" opacity="0.32"/>
  <path d="M 96 176 L 224 24 M 122 194 L 250 42" fill="none" stroke="#56c5b0" stroke-width="4" stroke-linecap="round"/>
  <!-- The cut seen face-on: an ellipse on the sheet. -->
  <ellipse cx="160" cy="100" rx="26" ry="43" transform="rotate(-49 160 100)"
           fill="none" stroke="#f0a35e" stroke-width="5"/>
</svg>
