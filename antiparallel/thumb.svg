<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The key moment: a circle through A and B cuts the other two sides at
       D and E, and the chord DE runs across the triangle, antiparallel to AB. -->
  <circle cx="160" cy="130" r="70" fill="none" stroke="#8f86ff" stroke-width="3"/>
  <path d="M 90 130 L 160 35 L 230 130 Z" fill="none" stroke="#b8c4d4" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 111 63 L 181 63" fill="none" stroke="#4bb3a7" stroke-width="6" stroke-linecap="round"/>
  <circle cx="90" cy="130" r="6" fill="#8f86ff"/>
  <circle cx="230" cy="130" r="6" fill="#8f86ff"/>
  <circle cx="160" cy="35" r="6" fill="#8f86ff"/>
  <circle cx="111" cy="63" r="6" fill="#4bb3a7"/>
  <circle cx="181" cy="63" r="6" fill="#4bb3a7"/>
  <circle cx="160" cy="130" r="5" fill="#d99a3f"/>
</svg>
