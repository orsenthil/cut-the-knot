<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Two fractions drawn as rows of boxes: 3/4 (red) against 2/3 (violet). -->
  <g stroke="#8b93a3" stroke-width="2" stroke-linejoin="round">
    <rect x="30" y="60" width="30" height="30" fill="#d4565a"/><rect x="60" y="60" width="30" height="30" fill="#d4565a"/>
    <rect x="90" y="60" width="30" height="30" fill="#d4565a"/><rect x="120" y="60" width="30" height="30" fill="none"/>
    <rect x="180" y="60" width="30" height="30" fill="#7a6ff0"/><rect x="210" y="60" width="30" height="30" fill="#7a6ff0"/>
    <rect x="240" y="60" width="30" height="30" fill="none"/>
  </g>
  <g fill="#8b93a3" font-family="sans-serif" font-size="26" font-weight="700" text-anchor="middle">
    <text x="90" y="128">3/4</text><text x="225" y="128">2/3</text>
    <text x="160" y="170" font-size="30">&gt;</text>
  </g>
</svg>
