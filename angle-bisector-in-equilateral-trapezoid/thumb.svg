<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A trapezoid in its circle, G off to one side, and the circle through
       the four constructed points when BG halves angle CBD. Flat mid-tones
       so the card reads on both the white and the near-black background. -->
  <circle cx="160" cy="100" r="70" fill="none" stroke="#7e88b5" stroke-width="2"/>
  <polygon points="106,145 214,145 207,48 113,48" fill="#6d78c8" fill-opacity="0.22" stroke="#98a2d4" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="106" y1="145" x2="223" y2="69" stroke="#8e98d2" stroke-width="1.8"/>
  <line x1="214" y1="145" x2="160" y2="30" stroke="#8e98d2" stroke-width="1.8"/>
  <line x1="60" y1="92" x2="260" y2="92" stroke="#d9a95d" stroke-width="2.5" stroke-dasharray="7 5"/>
  <polygon points="223,69 160,30 158,92 210,92" fill="#5fbb8a" fill-opacity="0.16" stroke="#67c795" stroke-width="2"/>
  <circle cx="184" cy="61" r="40" fill="none" stroke="#67c795" stroke-width="3"/>
  <g fill="#aab2cc">
    <circle cx="106" cy="145" r="4"/><circle cx="214" cy="145" r="4"/>
    <circle cx="207" cy="48" r="4"/><circle cx="113" cy="48" r="4"/>
  </g>
  <g fill="#d9a95d" stroke="#15161c" stroke-width="1.2">
    <circle cx="189" cy="92" r="5"/>
  </g>
  <g fill="#67c795" stroke="#15161c" stroke-width="1.2">
    <circle cx="223" cy="69" r="4.5"/><circle cx="160" cy="30" r="4.5"/>
    <circle cx="158" cy="92" r="4.5"/><circle cx="210" cy="92" r="4.5"/>
  </g>
</svg>
