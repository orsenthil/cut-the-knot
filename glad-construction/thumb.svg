<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The key moment: the line from D to the midpoint crosses the diagonal at
       one third, and its parallel reaches one third of the bottom side. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M55 160 L230 160 L270 55 L95 55 Z" stroke="#b9c0cc" stroke-width="2.5"/>
    <path d="M55 160 L270 55 M95 55 L230 160" stroke="#8f86ff" stroke-width="1.8" stroke-dasharray="6 5"/>
    <path d="M142.5 160 L95 55 M126.7 125 L113.3 160" stroke="#8f86ff" stroke-width="2"/>
    <path d="M162.5 107.5 L142.5 160" stroke="#8f86ff" stroke-width="2.2"/>
  </g>
  <g fill="#4ade80">
    <circle cx="142.5" cy="160" r="6"/><circle cx="113.3" cy="160" r="6"/>
  </g>
  <g fill="#8f86ff">
    <circle cx="162.5" cy="107.5" r="4.5"/><circle cx="126.7" cy="125" r="4.5"/>
  </g>
  <g fill="#b9c0cc">
    <circle cx="55" cy="160" r="5"/><circle cx="230" cy="160" r="5"/>
    <circle cx="270" cy="55" r="5"/><circle cx="95" cy="55" r="5"/>
  </g>
</svg>
