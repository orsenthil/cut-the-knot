  <circle cx="129" cy="126" r="4.5" fill="#5b4ee8" stroke="#ffffff" stroke-width="1"/>
  <circle cx="127" cy="19" r="4.5" fill="#15803d"/>
  <circle cx="160" cy="37" r="4.5" fill="#15803d"/>
  <circle cx="193" cy="55" r="4.5" fill="#15803d"/>
