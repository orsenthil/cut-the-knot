  <line x1="97" y1="150" x2="220" y2="72" stroke="#77808f" stroke-width="1.5"/>
  <line x1="222" y1="150" x2="220" y2="72" stroke="#77808f" stroke-width="1.5"/>
  <polygon points="97,150 222,150 222,108 129,126" fill="none" stroke="#3e4656" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="97,150 127,19 222,108" fill="#5b4ee8" fill-opacity="0.16" stroke="#6b5ef0" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="129,126 160,37 222,108" fill="#5b4ee8" fill-opacity="0.16" stroke="#6b5ef0" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="129,126 193,55 222,150" fill="#5b4ee8" fill-opacity="0.16" stroke="#6b5ef0" stroke-width="2.5" stroke-linejoin="round"/>
