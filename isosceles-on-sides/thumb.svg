    <path d="M160 35 L98 73 L70 140" stroke="#5ec2a0"/>
    <path d="M186 98 L98 73 L163 160 Z" stroke="#afbad6" stroke-width="1.8" stroke-dasharray="5 4"/>
  </g>
  <g fill="none" stroke="#62c4a5" stroke-width="1.8" stroke-dasharray="7 4" opacity="0.85">
    <path d="M70 140 L147 173"/>
    <path d="M250 120 L147 173"/>
    <path d="M160 35 L147 173"/>
