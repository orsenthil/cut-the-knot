<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A triangle on a circle, the point P, three equally inclined lines and
       the single line through their feet. Mid-tones read on white and black. -->
  <circle cx="160" cy="100" r="76" fill="none" stroke="#7d8492" stroke-width="2" stroke-dasharray="5 5"/>
  <polygon points="160,30 70,165 250,165" fill="none" stroke="#5f6572" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#8f86ff" stroke-width="2.5" stroke-linecap="round">
    <line x1="102" y1="142" x2="78" y2="154"/>
    <line x1="102" y1="142" x2="214" y2="112"/>
    <line x1="102" y1="142" x2="41" y2="165"/>
  </g>
  <line x1="28" y1="169" x2="248" y2="101" stroke="#3fae8f" stroke-width="4" stroke-linecap="round"/>
  <g fill="#3fae8f" stroke="#ffffff" stroke-width="1.5">
    <circle cx="78" cy="154" r="5"/>
    <circle cx="214" cy="112" r="5"/>
    <circle cx="41" cy="165" r="5"/>
  </g>
  <g fill="#8f86ff" stroke="#ffffff" stroke-width="2">
    <circle cx="160" cy="30" r="6"/>
    <circle cx="70" cy="165" r="6"/>
    <circle cx="250" cy="165" r="6"/>
    <circle cx="102" cy="142" r="7"/>
  </g>
</svg>
