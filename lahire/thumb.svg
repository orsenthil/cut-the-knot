<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The moment of La Hire's theorem: A lies on B's polar and B lies on A's. -->
  <g stroke-linecap="round">
    <line x1="40" y1="91" x2="286" y2="91" stroke="#d36a6a" stroke-width="3" stroke-dasharray="10 8"/>
    <line x1="106" y1="41" x2="127" y2="189" stroke="#d36a6a" stroke-width="3" stroke-dasharray="10 8"/>
    <circle cx="105" cy="110" r="38" fill="none" stroke="#8a94a6" stroke-width="3"/>
    <line x1="105" y1="110" x2="240" y2="91" stroke="#7b93d6" stroke-width="3"/>
    <line x1="105" y1="110" x2="105" y2="34" stroke="#7b93d6" stroke-width="3"/>
    <circle cx="105" cy="91" r="6" fill="#69ad7c"/>
    <circle cx="115.5" cy="108.5" r="6" fill="#69ad7c"/>
    <circle cx="105" cy="110" r="6" fill="#acb3c2"/>
    <circle cx="143" cy="110" r="6" fill="#acb3c2"/>
    <circle cx="240" cy="91" r="8" fill="#8f86ff"/>
    <circle cx="105" cy="34" r="8" fill="#8f86ff"/>
  </g>
  <g fill="#b9c0cc" font-family="sans-serif" font-size="18" font-weight="bold">
    <text x="247" y="86">A</text>
    <text x="112" y="30">B</text>
    <text x="84" y="132">O</text>
  </g>
</svg>
