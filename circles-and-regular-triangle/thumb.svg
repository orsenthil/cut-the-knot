<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The key moment: circle W, centre Q, sits straight above B, touching the
       circle on diameter AC, the circle on diameter AB, and the side BE.
       Transparent background and mid-tones read on white and near-black. -->
  <polygon points="172,105 222,105 197,55" fill="#8f86ff" opacity="0.2"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- circle S, centre O, diameter AC -->
    <circle cx="160" cy="105" r="62" stroke="#5b8dd9" stroke-width="3"/>
    <line x1="98" y1="105" x2="222" y2="105" stroke="#9aa3b2" stroke-width="2"/>
    <!-- circle G, centre P, diameter AB -->
    <circle cx="135" cy="105" r="37" stroke="#4f9d78" stroke-width="3"/>
    <!-- the isosceles triangle BCE -->
    <path d="M 172 105 L 197 55 L 222 105" stroke="#9aa3b2" stroke-width="2"/>
    <!-- circle W, centre Q: the right angle QB to AC -->
    <circle cx="172" cy="64" r="18" stroke="#d97a4a" stroke-width="3"/>
    <line x1="172" y1="64" x2="172" y2="105" stroke="#d97a4a" stroke-width="2.5"/>
    <path d="M 165 105 L 165 98 L 172 98" stroke="#d97a4a" stroke-width="2"/>
  </g>
  <g fill="#5b8dd9">
    <circle cx="160" cy="105" r="3.5"/><circle cx="135" cy="105" r="3.5"/>
  </g>
  <g fill="#d97a4a">
    <circle cx="172" cy="64" r="4"/><circle cx="172" cy="105" r="4"/>
  </g>
  <g fill="#9aa3b2">
    <circle cx="98" cy="105" r="3.5"/><circle cx="222" cy="105" r="3.5"/>
    <circle cx="197" cy="55" r="3.5"/>
  </g>
</svg>
