<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Four circles at the corners of a quadrilateral; the triangle covered by
       three of them is shaded. Mid-tones read on both white and near-black. -->
  <polygon points="70,50 238,58 258,150 92,162" fill="#8f86ff" fill-opacity="0.18"/>
  <polygon points="70,50 238,58 258,150" fill="#4ade80" fill-opacity="0.28"
           stroke="#4ade80" stroke-width="2.5"/>
  <g fill="none" stroke-width="2.5" stroke="#8f86ff" fill-opacity="0.08">
    <circle cx="70" cy="50" r="48" fill="#8f86ff" fill-opacity="0.10"/>
    <circle cx="238" cy="58" r="52" fill="#8f86ff" fill-opacity="0.10"/>
    <circle cx="258" cy="150" r="56" fill="#8f86ff" fill-opacity="0.10"/>
    <circle cx="92" cy="162" r="44" fill="#8f86ff" fill-opacity="0.10" stroke-dasharray="5 5"/>
  </g>
  <polygon points="70,50 238,58 258,150 92,162" fill="none" stroke="#c9cfda" stroke-width="2"/>
  <g fill="#4ade80" stroke="#15171d" stroke-width="1.5">
    <circle cx="70" cy="50" r="5"/>
    <circle cx="238" cy="58" r="5"/>
    <circle cx="258" cy="150" r="5"/>
  </g>
  <circle cx="92" cy="162" r="5" fill="#9aa1ad" stroke="#15171d" stroke-width="1.5"/>
</svg>
