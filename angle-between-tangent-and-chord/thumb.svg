<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The sangaku's key moment: two tangents from C, the chord AB, and the
       incenter sitting on the circle at the midpoint of the small arc. -->
  <circle cx="130" cy="110" r="55" fill="none" stroke="#8f86ff" stroke-width="3"/>
  <line x1="265" y1="55" x2="168" y2="149" stroke="#94a0b3" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="265" y1="55" x2="130" y2="55" stroke="#94a0b3" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="130" y1="55" x2="168" y2="149" fill="none" stroke="#4aa3a2" stroke-width="2.4" stroke-dasharray="6 5"/>
  <circle cx="181" cy="89" r="6" fill="#4aa3a2"/>
  <circle cx="130" cy="110" r="3.5" fill="#8f86ff"/>
  <circle cx="265" cy="55" r="4.5" fill="#8f86ff"/>
</svg>
