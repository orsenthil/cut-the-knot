  <g stroke="#c084fc" stroke-width="4" stroke-linejoin="round" fill="none">
    <polygon points="218,139.7 119.5,178 89.4,55.9 218,28.2"/>
  </g>
  <g stroke="#5d9c8f" stroke-width="1.5" stroke-dasharray="5 4" fill="none">
    <line x1="218" y1="84" x2="103" y2="84"/>
    <line x1="160" y1="161" x2="97" y2="46"/>
    <line x1="154" y1="117" x2="250" y2="18"/>
    <line x1="168" y1="42" x2="195" y2="164"/>
  </g>
  <polygon points="162.7,83.9 139.6,83.9 148.3,106.1 166.6,101.6"
           fill="none" stroke="#8f86ff" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="153" cy="95" r="11" fill="none" stroke="#4bbfa0" stroke-width="2"/>
  <g fill="#8f86ff" stroke="#20242c" stroke-width="2">
    <circle cx="218" cy="100" r="5"/>
    <circle cx="181" cy="154.1" r="5"/>
    <circle cx="103.7" cy="113.9" r="5"/>
    <circle cx="147.8" cy="43.3" r="5"/>
  </g>
</svg>
