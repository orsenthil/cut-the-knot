<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Bachet's grid with two rows picked and the pair 5 and 6 revealed">
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <!-- two chosen row buttons on the left -->
    <rect x="30" y="24" width="34" height="32" rx="7" fill="#2a9d8f"/>
    <text x="47" y="45" fill="#f2fbf9">1</text>
    <rect x="30" y="100" width="34" height="32" rx="7" fill="#2a9d8f"/>
    <text x="47" y="121" fill="#f2fbf9">3</text>
    <rect x="30" y="62" width="34" height="32" rx="7" fill="#5c6a82"/>
    <text x="47" y="83" fill="#eef1f6">2</text>
    <rect x="30" y="138" width="34" height="32" rx="7" fill="#5c6a82"/>
    <text x="47" y="159" fill="#eef1f6">4</text>

    <!-- the N=4 grid: row 0 -->
    <g fill="#3a4457">
      <rect x="84" y="24" width="34" height="32" rx="6"/>
      <rect x="124" y="24" width="34" height="32" rx="6"/>
      <rect x="164" y="24" width="34" height="32" rx="6"/>
      <rect x="244" y="24" width="34" height="32" rx="6"/>
    </g>
    <rect x="204" y="24" width="34" height="32" rx="6" fill="#e9a23b"/>
    <g fill="#eef1f6">
      <text x="101" y="45">1</text><text x="141" y="45">2</text><text x="181" y="45">3</text>
      <text x="261" y="45">7</text>
    </g>
    <text x="221" y="45" fill="#2f2410">5</text>

    <!-- row 1 -->
    <g fill="#3a4457">
      <rect x="84" y="62" width="34" height="32" rx="6"/>
      <rect x="124" y="62" width="34" height="32" rx="6"/>
      <rect x="164" y="62" width="34" height="32" rx="6"/>
      <rect x="204" y="62" width="34" height="32" rx="6"/>
      <rect x="244" y="62" width="34" height="32" rx="6"/>
    </g>
    <g fill="#eef1f6">
      <text x="101" y="83">4</text><text x="141" y="83">9</text><text x="181" y="83">10</text>
      <text x="221" y="83">11</text><text x="261" y="83">13</text>
    </g>

    <!-- row 2 -->
    <rect x="84" y="100" width="34" height="32" rx="6" fill="#e9a23b"/>
    <g fill="#3a4457">
      <rect x="124" y="100" width="34" height="32" rx="6"/>
      <rect x="164" y="100" width="34" height="32" rx="6"/>
      <rect x="204" y="100" width="34" height="32" rx="6"/>
      <rect x="244" y="100" width="34" height="32" rx="6"/>
    </g>
    <text x="101" y="121" fill="#2f2410">6</text>
    <g fill="#eef1f6">
      <text x="141" y="121">12</text><text x="181" y="121">15</text>
      <text x="221" y="121">16</text><text x="261" y="121">17</text>
    </g>

    <!-- row 3 -->
    <g fill="#3a4457">
      <rect x="84" y="138" width="34" height="32" rx="6"/>
      <rect x="124" y="138" width="34" height="32" rx="6"/>
      <rect x="164" y="138" width="34" height="32" rx="6"/>
      <rect x="204" y="138" width="34" height="32" rx="6"/>
      <rect x="244" y="138" width="34" height="32" rx="6"/>
    </g>
    <g fill="#eef1f6">
      <text x="101" y="159">8</text><text x="141" y="159">14</text><text x="181" y="159">18</text>
      <text x="221" y="159">19</text><text x="261" y="159">20</text>
    </g>

    <!-- the answer -->
    <text x="164" y="192" fill="#2a9d8f" font-size="17">rows 1 + 3  →  5 and 6</text>
  </g>
</svg>
