    <path d="M68 38V162 M104 38V162 M140 38V162 M176 38V162 M212 38V162 M68 38H212 M68 74H212 M68 110H212 M68 146H212"/>
  </g>
  <rect x="62" y="32" width="156" height="136" rx="6" fill="none" stroke="#9a8ff0" stroke-width="2"/>
  <polyline fill="none" stroke="#7cc0a8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"
    points="86,56 86,92 122,92 122,56 158,56 158,92 194,92 194,56
            86,128 86,164 122,164 122,128 158,128 158,164 194,164 194,128"/>
  <circle cx="86" cy="56" r="5" fill="#7cc0a8"/>
  <circle cx="194" cy="128" r="5" fill="#e08a8a"/>
</svg>
