<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A flat picture of the curve's key moment: a chain visiting the centres
       of a 4x4 grid in the top-down, left-right order. Mid-tone colours read on
       both the white and near-black card backgrounds. -->
