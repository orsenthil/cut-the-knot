    <circle cx="195" cy="83" r="53" stroke="#9aa0a8" stroke-dasharray="9 6"/>
    <circle cx="125" cy="83" r="70" stroke="#9aa0a8"/>
    <circle cx="171" cy="71" r="28" stroke="#d97373" stroke-width="2.5"/>
    <circle cx="137" cy="131" r="19" stroke="#d97373" stroke-width="2.5"/>
    <circle cx="196" cy="127" r="7" stroke="#d97373" stroke-width="2.5"/>
    <circle cx="175" cy="115" r="15" stroke="#62b884" stroke-width="4"/>
    <circle cx="173" cy="114" r="17" stroke="#6f9de8" stroke-width="4"/>
  </g>
  <g fill="#9aa0a8">
    <circle cx="160" cy="133" r="3"/>
