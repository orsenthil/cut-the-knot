<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Four rigid rectangles hinged at the corners of a rhombus; the arrows
       show the pattern opening in both directions. Mid-tone flat colours. -->
  <g stroke="#8891a1" stroke-width="2" stroke-linejoin="round">
    <polygon points="130,65 215,100 227.25,70.25 142.25,35.25" fill="#6d74cf" fill-opacity="0.85"/>
    <polygon points="215,100 150,135 162.25,157.75 227.25,122.75" fill="#3f9a8d" fill-opacity="0.85"/>
    <polygon points="150,135 65,100 52.75,129.75 137.75,164.75" fill="#c4874a" fill-opacity="0.85"/>
    <polygon points="65,100 130,65 117.75,42.25 52.75,77.25" fill="#b0618c" fill-opacity="0.85"/>
  </g>
  <polygon points="130,65 215,100 150,135 65,100" fill="none" stroke="#d6dae2" stroke-width="2" stroke-dasharray="6 5"/>
  <g fill="#e6e8ee" stroke="#596173" stroke-width="1.5">
    <circle cx="130" cy="65" r="4"/>
    <circle cx="215" cy="100" r="4"/>
    <circle cx="150" cy="135" r="4"/>
    <circle cx="65" cy="100" r="4"/>
  </g>
  <g fill="none" stroke="#7c89a6" stroke-width="3" stroke-linecap="round">
    <path d="M 30 100 H 44 M 30 100 L 36 95 M 30 100 L 36 105"/>
    <path d="M 250 100 H 264 M 264 100 L 258 95 M 264 100 L 258 105"/>
    <path d="M 160 20 V 32 M 160 20 L 155 26 M 160 20 L 165 26"/>
    <path d="M 160 180 V 168 M 160 180 L 155 174 M 160 180 L 165 174"/>
  </g>
</svg>
