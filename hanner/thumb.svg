<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A right triangle with its three squares: the five pieces have slid
       from the bottom square into the two squares on the short sides. -->
  <g stroke="#39404d" stroke-width="2" stroke-linejoin="round">
    <polygon points="110,120 210,120 210,190 110,190" fill="#e6e9ef" opacity="0.45"/>
    <polygon points="110,120 70,50 140,10 180,80" fill="#e6e9ef" opacity="0.45"/>
    <polygon points="210,120 250,90 220,50 180,80" fill="#e6e9ef" opacity="0.45"/>
    <polygon points="110,120 160,150 110,190" fill="#a88ac4"/>
    <polygon points="110,120 210,120 160,150" fill="#e0b354"/>
    <polygon points="160,150 210,120 210,170 180,190" fill="#43a58e"/>
    <polygon points="160,150 180,190 110,190" fill="#9a8b56"/>
    <polygon points="210,170 210,190 180,190" fill="#d76b73"/>
    <polygon points="110,120 180,80 140,10 70,50" fill="#a88ac4" opacity="0.65"/>
    <polygon points="180,80 210,120 250,90 220,50" fill="#43a58e" opacity="0.65"/>
    <polygon points="110,120 210,120 180,80" fill="#5aa6c9" opacity="0.85"/>
  </g>
</svg>
