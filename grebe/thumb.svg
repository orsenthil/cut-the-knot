<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <title>A triangle with squares on its sides and three lines meeting at one point</title>
  <!-- Transparent background; mid-tones that read on light and dark cards. -->
  <g fill="none" stroke="#c47d8e" stroke-width="2.2" stroke-dasharray="5 4">
    <path d="M 140 101 L 5.75 178 M 140 101 L 274.25 178 M 140 101 L 140 -37"/>
  </g>
  <g fill="#d69a5b" fill-opacity="0.38" stroke="#d69a5b" stroke-width="2.2" stroke-linejoin="round">
    <polygon points="110,118 110,178 170,178 170,118"/>
    <polygon points="170,118 218,88 188,40 140,70"/>
    <polygon points="140,70 92,40 62,88 110,118"/>
  </g>
  <polygon points="110,118 170,118 140,70" fill="#6f7bd8" fill-opacity="0.34" stroke="#8b95e8" stroke-width="2.6" stroke-linejoin="round"/>
  <circle cx="140" cy="101" r="6" fill="#79c9b4" stroke="#14202a" stroke-width="1.5"/>
  <g fill="#8b95e8" stroke="#14202a" stroke-width="1.5">
    <circle cx="110" cy="118" r="4"/>
    <circle cx="170" cy="118" r="4"/>
    <circle cx="140" cy="70" r="4"/>
  </g>
</svg>
