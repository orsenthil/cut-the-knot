<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <title>An arbelos with a circle on the upright at the contact point</title>
  <!-- The gap between the big half-circle and the two small ones matches the
       circle standing on the upright; blue and red halves show the proof. -->
  <path d="M 25 160 A 135 135 0 0 1 295 160 Z" fill="#8f86ff" fill-opacity="0.14"/>
  <path d="M 25 160 A 63 63 0 0 1 151 160 Z" fill="#8f86ff" fill-opacity="0.38"/>
  <path d="M 151 160 A 72 72 0 0 1 295 160 Z" fill="#e07a72" fill-opacity="0.38"/>
  <path d="M 25 160 A 135 135 0 0 1 295 160" fill="none" stroke="#b9bfd0" stroke-width="4"/>
  <path d="M 25 160 A 63 63 0 0 1 151 160" fill="none" stroke="#8f86ff" stroke-width="4"/>
  <path d="M 151 160 A 72 72 0 0 1 295 160" fill="none" stroke="#e07a72" stroke-width="4"/>
  <line x1="25" y1="160" x2="295" y2="160" stroke="#b9bfd0" stroke-width="4"/>
  <line x1="151" y1="54" x2="151" y2="200" stroke="#b9bfd0" stroke-width="4"/>
  <circle cx="151" cy="107" r="53" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="4"/>
  <path d="M 25 160 L 151 214 M 295 160 L 151 214" fill="none" stroke="#9aa1ad" stroke-width="3" stroke-dasharray="6 5"/>
  <path d="M 25 160 A 101 101 0 0 1 151 214" fill="none" stroke="#8f86ff" stroke-width="4"/>
  <path d="M 151 214 A 105 105 0 0 1 295 160" fill="none" stroke="#e07a72" stroke-width="4"/>
  <circle cx="151" cy="160" r="9" fill="#8f86ff" stroke="#f3f5f8" stroke-width="3"/>
</svg>
