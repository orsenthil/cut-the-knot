<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A pentagon, the smaller flipped pentagon of the other-four-centres,
       and the five lines that all pass through G. Mid-tones read on both themes. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#7b83c7" stroke-width="2" stroke-dasharray="6 5">
      <line x1="40" y1="60" x2="186.25" y2="107.5"/>
      <line x1="150" y1="25" x2="158.75" y2="116.25"/>
      <line x1="280" y1="70" x2="126.25" y2="91"/>
      <line x1="240" y1="165" x2="136.25" y2="81.25"/>
      <line x1="75" y1="170" x2="177.5" y2="80"/>
    </g>
    <polygon points="40,60 150,25 280,70 240,165 75,170" stroke="#8f86ff" stroke-width="4"/>
    <polygon points="186.25,107.5 158.75,116.25 126.25,91 136.25,81.25 177.5,80"
             stroke="#4f9d78" stroke-width="3"/>
  </g>
  <g fill="#8f86ff">
    <circle cx="40" cy="60" r="5"/>
    <circle cx="150" cy="25" r="5"/>
    <circle cx="280" cy="70" r="5"/>
    <circle cx="240" cy="165" r="5"/>
    <circle cx="75" cy="170" r="5"/>
  </g>
  <g fill="#4f9d78">
    <circle cx="186.25" cy="107.5" r="4"/>
    <circle cx="158.75" cy="116.25" r="4"/>
    <circle cx="126.25" cy="91" r="4"/>
    <circle cx="136.25" cy="81.25" r="4"/>
    <circle cx="177.5" cy="80" r="4"/>
  </g>
  <circle cx="157" cy="98" r="9" fill="#f0b429" stroke="#ffffff" stroke-width="2"/>
</svg>
