<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The two radius-vector sums from different origins, and the parallelogram
       whose opposite corners are the two origins and the two sums. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 140 L130 80 L240 20 L190 80 Z" stroke="#8f86ff" stroke-width="3"/>
    <path d="M250 110 L130 80 L70 50 L190 80 Z" stroke="#4ade80" stroke-width="3" stroke-dasharray="7 5"/>
    <path d="M80 140 L70 50 L240 20 L250 110 Z" stroke="#e0a23c" stroke-width="3.5"/>
  </g>
  <g fill="#9aa1ad">
    <circle cx="130" cy="80" r="6"/>
    <circle cx="190" cy="80" r="6"/>
  </g>
  <g fill="#cbd5e1">
    <circle cx="80" cy="140" r="6"/>
    <circle cx="250" cy="110" r="6"/>
  </g>
  <g fill="#8f86ff">
    <circle cx="240" cy="20" r="6"/>
  </g>
  <g fill="#4ade80">
    <circle cx="70" cy="50" r="6"/>
  </g>
  <g fill="#cbd5e1" font-family="sans-serif" font-size="20" font-weight="600">
    <text x="136" y="73">A</text>
    <text x="196" y="73">B</text>
    <text x="58" y="162">O</text>
    <text x="254" y="132">O'</text>
    <text x="246" y="18">S</text>
    <text x="40" y="40">S'</text>
  </g>
</svg>
