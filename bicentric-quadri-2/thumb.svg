<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <title>Four feet of perpendiculars form a quadrilateral with an incircle and a circumcircle</title>
  <!-- The circle w and the four points on it, with the perpendicular diagonals. -->
  <circle cx="160" cy="100" r="55" fill="none" stroke="#8f86ff" stroke-width="2" opacity="0.7"/>
  <polygon points="215,100 187.5,52.4 117.3,65.4 151.4,154.3"
           fill="none" stroke="#6c7488" stroke-width="2" stroke-linejoin="round"/>
  <g stroke="#b85c55" stroke-width="1.6" stroke-dasharray="5 4">
    <line x1="215" y1="100" x2="117.3" y2="65.4"/>
    <line x1="187.5" y1="52.4" x2="151.4" y2="154.3"/>
  </g>
  <!-- KLMN and the perpendiculars from P to the four sides. -->
  <g stroke="#9aa3b2" stroke-width="1.2">
    <line x1="175.6" y1="86" x2="199.1" y2="72.5"/>
    <line x1="175.6" y1="86" x2="169.9" y2="55.6"/>
    <line x1="175.6" y1="86" x2="131.7" y2="102.9"/>
    <line x1="175.6" y1="86" x2="199.1" y2="113.6"/>
  </g>
  <polygon points="199.1,72.5 169.9,55.6 131.7,102.9 199.1,113.6"
           fill="#8f86ff" fill-opacity="0.16" stroke="#8f86ff" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- The incircle at P and the circumcircle that appears in this case. -->
  <circle cx="175.6" cy="86" r="23.5" fill="none" stroke="#d4a72c" stroke-width="1.8" stroke-dasharray="4 4"/>
  <circle cx="167.8" cy="93" r="37.5" fill="none" stroke="#4f9d78" stroke-width="2.6"/>
  <g fill="#6c7488">
    <circle cx="215" cy="100" r="4"/>
    <circle cx="187.5" cy="52.4" r="4"/>
    <circle cx="117.3" cy="65.4" r="4"/>
    <circle cx="151.4" cy="154.3" r="4"/>
  </g>
  <g fill="#8f86ff">
    <circle cx="199.1" cy="72.5" r="3.6"/>
    <circle cx="169.9" cy="55.6" r="3.6"/>
    <circle cx="131.7" cy="102.9" r="3.6"/>
    <circle cx="199.1" cy="113.6" r="3.6"/>
  </g>
  <circle cx="175.6" cy="86" r="4.5" fill="#d4a72c"/>
  <circle cx="167.8" cy="93" r="4.5" fill="#4f9d78"/>
</svg>
