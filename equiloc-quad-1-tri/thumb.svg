<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The key moment: A, B and S on one circle, the equal sides AD and BC
       through S, and Q at the midpoint of the arc from A to B through S.
       Flat mid-tones read on white and on near-black. -->
  <circle cx="160" cy="110" r="74" fill="none" stroke="#7b83c7" stroke-width="3" stroke-dasharray="6 6"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- the two secants through S -->
    <path d="M 83 147 L 235 70 M 237 147 L 235 70" stroke="#6d7490" stroke-width="2.5"/>
    <!-- quadrilateral A-B-C-D -->
    <path d="M 83 147 L 237 147 L 236 108 L 123 127 Z" stroke="#8f86ff" stroke-width="4"/>
    <!-- the isosceles triangle on CD, apex Q on the arc -->
    <path d="M 123 127 L 160 36 L 236 108" stroke="#d0a24a" stroke-width="4"/>
  </g>
  <g fill="#8f86ff">
    <circle cx="83" cy="147" r="5"/>
    <circle cx="237" cy="147" r="5"/>
    <circle cx="235" cy="70" r="5"/>
  </g>
  <circle cx="123" cy="127" r="4" fill="#d0a24a"/>
  <circle cx="236" cy="108" r="4" fill="#d0a24a"/>
  <circle cx="160" cy="36" r="9" fill="#4f9d78" stroke="#ffffff" stroke-width="2"/>
  <circle cx="160" cy="36" r="14" fill="none" stroke="#4f9d78" stroke-width="2.5"/>
</svg>
