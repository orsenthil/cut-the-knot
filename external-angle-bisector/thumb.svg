    <path d="M80 40 L140 140 L180 160 Z" stroke="#6b74c9" stroke-width="4"/>
    <path d="M180 160 L22 81" stroke="#8d94a5" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M80 40 L22 81" stroke="#e0a63c" stroke-width="5"/>
    <path d="M180 160 L160 174" stroke="#4aa3a2" stroke-width="3" stroke-dasharray="6 5"/>
    <path d="M80 40 L160 174" stroke="#4aa3a2" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M81 58 Q69 65 62 81" stroke="#e0a63c" stroke-width="3"/>
    <path d="M64 84 Q53 99 45 115" stroke="#4aa3a2" stroke-width="3"/>
