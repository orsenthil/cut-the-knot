<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The droodle: four equal circles through one point, their four common
       tangents, and the circle through the tangent corners. Transparent
       background and mid-tone colours so it reads in either theme. -->
  <circle cx="163.8" cy="104.5" r="73.5" fill="none" stroke="#59b6a5" stroke-width="2.5"/>
  <polygon points="225.1,145 102.5,145 106.8,58 196.6,38.7" fill="none" stroke="#7d8a9c" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="none" stroke="#8f86ff" stroke-width="2.5">
    <circle cx="186" cy="115" r="30"/>
    <circle cx="134" cy="115" r="30"/>
    <circle cx="135.6" cy="82.5" r="30"/>
    <circle cx="175" cy="74" r="30"/>
  </g>
  <g fill="#e07575">
    <circle cx="186" cy="115" r="4"/>
    <circle cx="134" cy="115" r="4"/>
    <circle cx="135.6" cy="82.5" r="4"/>
    <circle cx="175" cy="74" r="4"/>
  </g>
  <circle cx="160" cy="100" r="5" fill="#d96a6a"/>
  <g fill="#59b6a5">
    <circle cx="225.1" cy="145" r="3.5"/>
    <circle cx="102.5" cy="145" r="3.5"/>
    <circle cx="106.8" cy="58" r="3.5"/>
    <circle cx="196.6" cy="38.7" r="3.5"/>
  </g>
</svg>
