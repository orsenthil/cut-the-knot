<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Four triangles in one circle: four Griffiths dots on a single line. -->
  <circle cx="160" cy="100" r="72" fill="none" stroke="#6d84b8" stroke-width="2"/>
  <circle cx="126" cy="108" r="30" fill="none" stroke="#8f86ff" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="193" cy="96" r="27" fill="none" stroke="#8f86ff" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="102,55 224,74 198,158 110,141" fill="none" stroke="#6d84b8" stroke-width="2"/>
  <line x1="52" y1="152" x2="268" y2="49" stroke="#4aa3a2" stroke-width="2"/>
  <line x1="60" y1="44" x2="260" y2="66" stroke="#d96f6f" stroke-width="2" stroke-dasharray="8 5"/>
  <g fill="#d96f6f">
    <circle cx="88" cy="48" r="4"/>
    <circle cx="137" cy="53" r="4"/>
    <circle cx="188" cy="58" r="4"/>
    <circle cx="236" cy="63" r="4"/>
  </g>
  <g fill="#4aa3a2">
    <circle cx="102" cy="55" r="4"/>
    <circle cx="224" cy="74" r="4"/>
    <circle cx="198" cy="158" r="4"/>
    <circle cx="110" cy="141" r="4"/>
  </g>
  <circle cx="160" cy="100" r="3.5" fill="#8f86ff"/>
  <circle cx="237" cy="63" r="5" fill="#4aa3a2"/>
</svg>
