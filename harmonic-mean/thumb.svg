    <rect x="34" y="54" width="58" height="36" rx="4" fill="#3358c5"/>
    <rect x="96" y="36" width="58" height="54" rx="4" fill="#6189c7"/>
    <rect x="158" y="66" width="58" height="24" rx="4" fill="#c4936a"/>
    <rect x="220" y="28" width="58" height="62" rx="4" fill="#bc2f2f"/>
  </g>
  <g stroke="#334155" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M34 174 H288"/>
