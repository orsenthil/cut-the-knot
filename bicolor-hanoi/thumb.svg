<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Two striped towers of gold and red disks on three pegs, one peg empty">
  <!-- pegs and base: mid grey, readable on white and on near-black -->
  <g fill="#8a8f99">
    <rect x="18" y="168" width="284" height="9" rx="4"/>
    <rect x="63" y="72" width="7" height="96" rx="3.5"/>
    <rect x="157" y="72" width="7" height="96" rx="3.5"/>
    <rect x="251" y="72" width="7" height="96" rx="3.5"/>
  </g>
  <g stroke="#3d424d" stroke-width="2">
    <!-- left tower: gold at the bottom, colours alternating up -->
    <rect x="23" y="142" width="86" height="24" rx="12" fill="#dda01b"/>
    <rect x="34" y="114" width="64" height="24" rx="12" fill="#c4453a"/>
    <rect x="45" y="86" width="42" height="24" rx="12" fill="#dda01b"/>
    <!-- middle tower: the mirror image, red at the bottom -->
    <rect x="117" y="142" width="86" height="24" rx="12" fill="#c4453a"/>
    <rect x="128" y="114" width="64" height="24" rx="12" fill="#dda01b"/>
    <rect x="139" y="86" width="42" height="24" rx="12" fill="#c4453a"/>
    <!-- a disk in flight towards the empty peg -->
    <rect x="233" y="30" width="42" height="24" rx="12" fill="#dda01b"/>
  </g>
  <path d="M160 74 C 185 34, 215 26, 231 34" fill="none" stroke="#8a8f99" stroke-width="3"
        stroke-dasharray="7 7" stroke-linecap="round"/>
</svg>
