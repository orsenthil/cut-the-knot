    <circle cx="111" cy="130" r="35" stroke="#c05b4c" opacity="0.85"/>
    <circle cx="156" cy="98" r="57" stroke="#7f74e8" stroke-dasharray="7 6" opacity="0.8"/>
    <circle cx="169" cy="112" r="61" stroke="#7f74e8" stroke-dasharray="7 6" opacity="0.6"/>
  </g>
  <polygon points="57,53 252,56 268,166 82,149" fill="none" stroke="#68748c" stroke-width="3" stroke-linejoin="round"/>
