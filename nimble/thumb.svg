<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Nimble: chips on needles sliding toward zero -->
  <!-- Base line -->
  <line x1="30" y1="160" x2="290" y2="160" stroke="#888" stroke-width="2"/>

  <!-- Needles -->
  <g stroke="#aaa" stroke-width="2">
    <line x1="50" y1="60" x2="50" y2="160"/>
    <line x1="98" y1="60" x2="98" y2="160"/>
    <line x1="146" y1="60" x2="146" y2="160"/>
    <line x1="194" y1="60" x2="194" y2="160"/>
    <line x1="242" y1="60" x2="242" y2="160"/>
  </g>

  <!-- Position labels -->
  <g font-size="12" fill="#888" text-anchor="middle" font-family="sans-serif">
    <text x="50" y="176">0</text>
    <text x="98" y="176">1</text>
    <text x="146" y="176">2</text>
    <text x="194" y="176">3</text>
    <text x="242" y="176">4</text>
  </g>

  <!-- Chips (coloured circles on needles) -->
  <!-- Chip at position 0 (home, faded) -->
  <circle cx="50" cy="145" r="12" fill="#e25c5c" opacity="0.35" stroke="rgba(0,0,0,0.2)" stroke-width="1.5"/>

  <!-- Chip at position 2 -->
  <circle cx="146" cy="145" r="12" fill="#4ea6e2" stroke="rgba(0,0,0,0.2)" stroke-width="1.5"/>

  <!-- Chip at position 4 (selected, with highlight) -->
  <circle cx="242" cy="145" r="12" fill="#4ec26a" stroke="rgba(0,0,0,0.2)" stroke-width="1.5"/>
  <circle cx="242" cy="145" r="15" fill="none" stroke="#5b8dde" stroke-width="2.5" stroke-dasharray="4 3"/>

  <!-- Arrow showing movement -->
  <path d="M228,125 C200,100 130,100 108,125" fill="none" stroke="#5b8dde" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="105,121 108,128 114,122" fill="#5b8dde"/>

  <!-- "0" label highlighted -->
  <rect x="36" y="48" width="28" height="16" rx="4" fill="#5b8dde" opacity="0.15"/>
  <text x="50" y="60" font-size="11" fill="#5b8dde" text-anchor="middle" font-family="sans-serif" font-weight="bold">HOME</text>
</svg>
