<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="A list of permutations with their cycle notation, with a counter showing the factorial">
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="24" y="22" width="204" height="156" rx="10" fill="#3b4353" stroke="#aab4c4" stroke-width="2"/>
    <g font-family="ui-monospace, monospace" font-size="12" fill="#e9eef6">
      <text x="36" y="50">1 2 3   (1)(2)(3)</text>
      <text x="36" y="74">1 3 2   (1)(2 3)</text>
      <text x="36" y="98">2 1 3   (1 2)(3)</text>
      <text x="36" y="122">2 3 1   (1 2 3)</text>
      <text x="36" y="146">3 1 2   (1 3 2)</text>
      <text x="36" y="170">3 2 1   (1 3)(2)</text>
    </g>
    <rect x="36" y="38" width="180" height="24" rx="4" fill="#6a5df0" opacity="0.35"/>
    <rect x="238" y="62" width="66" height="52" rx="8" fill="#2f3542" stroke="#d9a441" stroke-width="2"/>
    <text x="271" y="84" fill="#dbe3ef" font-size="13" font-weight="700" text-anchor="middle">3! =</text>
    <text x="271" y="104" fill="#f2f5fa" font-size="17" font-weight="700" text-anchor="middle">6</text>
  </g>
</svg>
