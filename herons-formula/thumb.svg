    <path d="M48 116 L110 26 L240 116 Z" fill="#ff3fbf" fill-opacity="0.16" stroke="#c9cfda" stroke-width="2.5"/>
    <path d="M48 116 L162 92 L110 26 Z" fill="#ff3fbf" fill-opacity="0.32"/>
    <path d="M110 26 L162 92 L240 116 Z" fill="#5bbf5b" fill-opacity="0.32"/>
    <path d="M240 116 L162 92 L48 116 Z" fill="#bfbf5b" fill-opacity="0.32"/>
    <circle cx="162" cy="92" r="40" fill="none" stroke="#4ade80" stroke-width="2.5"/>
    <path d="M162 92 L128 116 M162 92 L192 53 M162 92 L170 116" fill="none" stroke="#9aa1ad" stroke-width="1.7" stroke-dasharray="4 3"/>
    <circle cx="128" cy="116" r="4" fill="#4ade80"/>
    <circle cx="192" cy="53" r="4" fill="#4ade80"/>
    <circle cx="170" cy="116" r="4" fill="#4ade80"/>
    <circle cx="162" cy="92" r="4" fill="#4ade80"/>
    <g transform="translate(46 147)">
      <rect x="0" y="0" width="60" height="30" fill="#ff3fbf" fill-opacity="0.34" stroke="#c9cfda" stroke-width="2"/>
      <rect x="60" y="0" width="110" height="30" fill="#5bbf5b" fill-opacity="0.34" stroke="#c9cfda" stroke-width="2"/>
      <rect x="170" y="0" width="50" height="30" fill="#bfbf5b" fill-opacity="0.34" stroke="#c9cfda" stroke-width="2"/>
      <path d="M0 0 V30 M220 0 V30" fill="none" stroke="#c9cfda" stroke-width="2"/>
    </g>
  </g>
</svg>
