    <circle cx="200" cy="100" r="20" stroke="#d98b5f" stroke-width="4"/>
    <circle cx="215" cy="100" r="45" stroke="#7e8ce0" stroke-width="5"/>
    <path d="M148 43 L296 157 M148 157 L296 43" stroke="#6b9a96" stroke-width="2.5"/>
    <path d="M170 100 L260 100" stroke="#7e8ce0" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M237.5 61 L213 83 M237.5 61 L219 119" stroke="#66aaa3" stroke-width="3"/>
  </g>
  <g fill="#7e8ce0" stroke="#f4f4f6" stroke-width="2">
