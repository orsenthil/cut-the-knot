<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- BQT lemma: A, B, C on a line, D and E above it, with two pairs of
       parallel sides and the midpoint F (here B = F). -->
  <polygon points="120,50 240,50 160,150" fill="#4f9ec4" opacity="0.45"/>
  <polygon points="40,150 160,150 120,50" fill="#d69a55" opacity="0.38"/>
  <polygon points="160,150 280,150 240,50" fill="#d69a55" opacity="0.38"/>
  <g fill="none" stroke="#5b7086" stroke-width="2.5" stroke-linejoin="round">
    <path d="M40 150 L280 150"/>
    <path d="M40 150 L120 50 M160 150 L120 50"/>
    <path d="M160 150 L240 50 M280 150 L240 50"/>
    <path d="M120 50 L240 50"/>
  </g>
  <g fill="none" stroke="#4f9ec4" stroke-width="2.5" stroke-linecap="round">
    <path d="M77 101 L89 83 M93 108 L105 90"/>
    <path d="M197 101 L209 83 M213 108 L225 90"/>
  </g>
  <g fill="#7f8fa6" stroke="#f4f6f8" stroke-width="2">
    <circle cx="40" cy="150" r="6"/>
    <circle cx="160" cy="150" r="6"/>
    <circle cx="280" cy="150" r="6"/>
    <circle cx="120" cy="50" r="6"/>
    <circle cx="240" cy="50" r="6"/>
  </g>
</svg>
