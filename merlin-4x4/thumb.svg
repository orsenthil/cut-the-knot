<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Four by four torus of lit and unlit circular buttons">
  <g>
    <!-- 4x4 circles -->
    <circle cx="70" cy="50" r="18" fill="#e8b84a" stroke="#2a2a2a" stroke-width="3"/>
    <circle cx="130" cy="50" r="18" fill="#6b7280" stroke="#2a2a2a" stroke-width="3"/>
    <circle cx="190" cy="50" r="18" fill="#e8b84a" stroke="#2a2a2a" stroke-width="3"/>
    <circle cx="250" cy="50" r="18" fill="#6b7280" stroke="#2a2a2a" stroke-width="3"/>

    <circle cx="70" cy="100" r="18" fill="#6b7280" stroke="#2a2a2a" stroke-width="3"/>
    <circle cx="130" cy="100" r="18" fill="#e8b84a" stroke="#2a2a2a" stroke-width="3"/>
    <circle cx="190" cy="100" r="18" fill="#6b7280" stroke="#2a2a2a" stroke-width="3"/>
    <circle cx="250" cy="100" r="18" fill="#e8b84a" stroke="#2a2a2a" stroke-width="3"/>

    <circle cx="70" cy="150" r="18" fill="#e8b84a" stroke="#2a2a2a" stroke-width="3"/>
    <circle cx="130" cy="150" r="18" fill="#6b7280" stroke="#2a2a2a" stroke-width="3"/>
    <circle cx="190" cy="150" r="18" fill="#e8b84a" stroke="#2a2a2a" stroke-width="3"/>
    <circle cx="250" cy="150" r="18" fill="#6b7280" stroke="#2a2a2a" stroke-width="3"/>
  </g>
  <!-- accent ring on one "hint" cell -->
  <circle cx="130" cy="100" r="24" fill="none" stroke="#5b4fcf" stroke-width="3"/>
</svg>
