<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A cyclic hexagon, cut into triangles with their incircles. -->
  <circle cx="160" cy="100" r="66" fill="none" stroke="#697586" stroke-width="2.5"/>
  <polygon points="226,100 193,157 127,157 94,100 127,43 193,43"
           fill="none" stroke="#9aa4b2" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="none" stroke="#8f86ff" stroke-width="2" stroke-dasharray="5 4" opacity="0.85">
    <line x1="226" y1="100" x2="127" y2="157"/>
    <line x1="226" y1="100" x2="94" y2="100"/>
    <line x1="226" y1="100" x2="127" y2="43"/>
  </g>
  <g fill="none" stroke="#4b82d8" stroke-width="2.75">
    <circle cx="182" cy="138" r="18"/>
    <circle cx="150" cy="119" r="25"/>
    <circle cx="150" cy="81" r="25"/>
    <circle cx="182" cy="62" r="18"/>
  </g>
  <g fill="#5b4ee8">
    <circle cx="226" cy="100" r="5"/>
    <circle cx="193" cy="157" r="5"/>
    <circle cx="127" cy="157" r="5"/>
    <circle cx="94" cy="100" r="5"/>
    <circle cx="127" cy="43" r="5"/>
    <circle cx="193" cy="43" r="5"/>
  </g>
</svg>
