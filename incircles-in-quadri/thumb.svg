  <line x1="45" y1="145" x2="275" y2="55" stroke="#8a6fa8" stroke-width="3" stroke-dasharray="9 7"/>
  <circle cx="169" cy="123" r="23" fill="none" stroke="#4f86c6" stroke-width="5"/>
  <circle cx="151" cy="77" r="23" fill="none" stroke="#c27a52" stroke-width="5"/>
  <circle cx="160" cy="100" r="5" fill="#3f9b73"/>
  <g fill="#5d6b82">
    <circle cx="45" cy="145" r="6"/>
    <circle cx="130" cy="180" r="6"/>
    <circle cx="275" cy="55" r="6"/>
    <circle cx="95" cy="35" r="6"/>
  </g>
</svg>
