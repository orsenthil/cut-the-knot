<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- An ellipse, a chord through R on the diameter PP, and tangents at the
       chord's ends meeting at U on the same diameter. -->
  <ellipse cx="160" cy="100" rx="110" ry="60" fill="#8f86ff" fill-opacity="0.11"
           stroke="#8f86ff" stroke-width="2.5"/>
  <g fill="none" stroke="#8f86ff" stroke-width="2" stroke-opacity="0.55" stroke-dasharray="6 4">
    <line x1="62" y1="44" x2="258" y2="156"/>
    <line x1="100" y1="133" x2="220" y2="67"/>
  </g>
  <line x1="51" y1="108" x2="176" y2="41" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <g fill="none" stroke="#4ade80" stroke-width="1.8" stroke-opacity="0.75" stroke-dasharray="5 4">
    <line x1="30" y1="29" x2="176" y2="41"/>
    <line x1="30" y1="29" x2="51" y2="108"/>
  </g>
  <g fill="#8f86ff">
    <circle cx="82" cy="58" r="4.5"/>
    <circle cx="238" cy="142" r="4.5"/>
  </g>
  <circle cx="160" cy="100" r="4" fill="#c3c7d1"/>
  <circle cx="113" cy="75" r="5" fill="#4ade80" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.5"/>
  <g fill="#4ade80">
    <circle cx="176" cy="41" r="3.5"/>
    <circle cx="51" cy="108" r="3.5"/>
  </g>
  <circle cx="30" cy="29" r="6" fill="#f0a35e" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5"/>
</svg>
