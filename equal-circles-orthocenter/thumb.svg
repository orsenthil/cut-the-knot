<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Three equal circles through the corners and the orthocenter of a triangle. -->
  <g fill="none" stroke-width="3">
    <circle cx="160" cy="110" r="66" stroke="#7d8cff" opacity="0.85"/>
    <circle cx="120" cy="90" r="66" stroke="#4bb3a6" opacity="0.85"/>
    <circle cx="200" cy="90" r="66" stroke="#e0845f" opacity="0.85"/>
  </g>
  <polygon points="160,42 76,154 244,154" fill="#7d8cff" fill-opacity="0.12"
           stroke="#b0b8c8" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#b0b8c8" stroke-width="2" stroke-dasharray="5 5" opacity="0.8">
    <line x1="160" y1="42" x2="160" y2="154"/>
    <line x1="76" y1="154" x2="205" y2="91"/>
    <line x1="244" y1="154" x2="115" y2="91"/>
  </g>
  <circle cx="160" cy="109" r="7" fill="#e0845f" stroke="#ffffff" stroke-width="2"/>
  <g fill="#b0b8c8" font-family="sans-serif" font-size="18" font-weight="600">
    <text x="165" y="37">A</text>
    <text x="58" y="172">B</text>
    <text x="250" y="172">C</text>
    <text x="170" y="116">H</text>
  </g>
</svg>
