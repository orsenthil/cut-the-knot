<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A square ABCD with the midpoint handles M and N and the four cuts.
       Mid-tone fills read on both the light and the dark card background. -->
  <g stroke-linejoin="round">
    <polygon points="225,35 173,139 138,122 121,87" fill="#6b7be0" opacity="0.62"/>
    <polygon points="95,35 121,87 95,100" fill="#d96a63" opacity="0.62"/>
    <polygon points="95,100 138,122 160,165 95,165" fill="#d96a63" opacity="0.62"/>
    <polygon points="225,165 173,139 160,165" fill="#d96a63" opacity="0.62"/>
    <g stroke="#4a5266" stroke-width="2" fill="none">
      <path d="M95 35 L160 165 M225 35 L95 100 M225 165 L95 100 M225 35 L160 165"/>
      <rect x="95" y="35" width="130" height="130" stroke-width="2.6"/>
    </g>
    <circle cx="95" cy="100" r="5" fill="#7b71e8" stroke="#e9eaf6" stroke-width="2"/>
    <circle cx="160" cy="165" r="5" fill="#7b71e8" stroke="#e9eaf6" stroke-width="2"/>
  </g>
</svg>
