  <line x1="112" y1="100" x2="111.5" y2="76" stroke="#8f86ff" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="45.2" y1="76.1" x2="177.8" y2="76.1" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>
