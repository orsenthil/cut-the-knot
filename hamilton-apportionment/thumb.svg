    <rect x="24" y="22" width="272" height="156" rx="10" fill="#3b4353" stroke="#aab4c4" stroke-width="2"/>
    <g font-size="12" fill="#dbe3ef" font-weight="700">
      <text x="55" y="48">State</text><text x="98" y="48">Pop.</text><text x="150" y="48">Std Q</text><text x="200" y="48">Left</text><text x="262" y="48">Final</text>
    </g>
    <path d="M36 58 H284" stroke="#aab4c4" stroke-width="1.5"/>
    <g font-size="13" fill="#e9eef6">
      <text x="55" y="82">A</text><text x="98" y="82">307</text><text x="150" y="82">7.14</text><text x="200" y="82">.14</text><text x="262" y="82">7</text>
      <text x="55" y="108">B</text><text x="98" y="108">524</text><text x="150" y="108">12.19</text><text x="200" y="108">.19</text><text x="262" y="108">13</text>
      <text x="55" y="134">C</text><text x="98" y="134">169</text><text x="150" y="134">3.93</text><text x="200" y="134">.93</text><text x="262" y="134">4</text>
    </g>
    <g fill="none" stroke="#d9a441" stroke-width="2.5" stroke-dasharray="4 3">
      <rect x="180" y="96" width="42" height="24" rx="5"/>
      <rect x="180" y="122" width="42" height="24" rx="5"/>
    </g>
    <path d="M36 146 H284" stroke="#aab4c4" stroke-width="1.5"/>
    <g font-size="13" font-weight="700" fill="#f2f5fa">
      <text x="55" y="166">Total</text><text x="98" y="166">1000</text><text x="262" y="166">24</text>
    </g>
  </g>
</svg>
