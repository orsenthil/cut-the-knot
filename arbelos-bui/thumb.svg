<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The twin circles inside Bùi Quang Tuấn's arbelos: three semicircles on
       one baseline, with the two equal new circles drawn above it. -->
  <g fill="none" stroke="#6c78a8" stroke-width="3">
    <path d="M30 155 A130 130 0 0 1 290 155"/>
    <path d="M30 155 A70 70 0 0 1 170 155"/>
    <path d="M170 155 A60 60 0 0 1 290 155"/>
  </g>
  <path d="M30 155 H290" stroke="#8590a3" stroke-width="3"/>
  <circle cx="100" cy="88" r="32" fill="#7c8cff" fill-opacity="0.55" stroke="#aab6ff" stroke-width="3"/>
  <circle cx="230" cy="99" r="32" fill="#7c8cff" fill-opacity="0.55" stroke="#aab6ff" stroke-width="3"/>
  <g fill="#d0d7e6">
    <circle cx="30" cy="155" r="5"/>
    <circle cx="170" cy="155" r="5"/>
    <circle cx="290" cy="155" r="5"/>
  </g>
</svg>
