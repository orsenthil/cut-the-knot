<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The starting triangle, its three medians and the median triangle. -->
  <polygon points="40,160 230,160 130,30" fill="#8f86ff" fill-opacity="0.18" stroke="#8f86ff" stroke-width="2.5"/>
  <polygon points="85,95 180,95 130,30" fill="#8f86ff" fill-opacity="0.25"/>
  <polygon points="85,95 135,160 40,160" fill="#8f86ff" fill-opacity="0.25"/>
  <polygon points="180,95 135,160 230,160" fill="#8f86ff" fill-opacity="0.25"/>
  <polygon points="225,30 180,95 275,95" fill="#8f86ff" fill-opacity="0.25"/>
  <g stroke="#f87171" stroke-width="2">
    <line x1="40" y1="160" x2="180" y2="95"/>
    <line x1="230" y1="160" x2="85" y2="95"/>
    <line x1="130" y1="30" x2="135" y2="160"/>
  </g>
  <polygon points="230,160 85,95 225,30" fill="#4ade80" fill-opacity="0.22" stroke="#4ade80" stroke-width="3"/>
  <g fill="#8f86ff">
    <circle cx="180" cy="95" r="4"/>
    <circle cx="85" cy="95" r="4"/>
    <circle cx="135" cy="160" r="4"/>
  </g>
  <g fill="#c9cfda" stroke="#5d6472" stroke-width="1.5">
    <circle cx="40" cy="160" r="5"/>
    <circle cx="230" cy="160" r="5"/>
    <circle cx="130" cy="30" r="5"/>
  </g>
</svg>
