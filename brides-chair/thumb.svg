<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The Bride's Chair: a right triangle with a square on each side.
       Transparent background; mid-tone colours read on white and near-black. -->
  <g stroke="#9aa1ad" stroke-width="2.5" stroke-linejoin="round">
    <!-- square on the long leg -->
    <polygon points="105,115 170,115 170,180 105,180" fill="#5b6bb5"/>
    <!-- square on the short leg -->
    <polygon points="105,115 105,70 60,70 60,115" fill="#3f8f8a"/>
    <!-- square on the sloping side, outside the triangle -->
    <polygon points="170,115 215,50 150,5 105,70" fill="#c08a3e"/>
    <!-- the right triangle in the middle -->
    <polygon points="105,115 170,115 105,70" fill="#d2d8e2" stroke="#e8ecf2" stroke-width="3"/>
    <polygon points="105,115 170,115 105,70" fill="none" stroke="#6b7280" stroke-width="2.5"/>
  </g>
  <g fill="#e8ecf2" stroke="#6b7280" stroke-width="2">
    <circle cx="105" cy="115" r="4.5"/>
    <circle cx="170" cy="115" r="4.5"/>
    <circle cx="105" cy="70" r="4.5"/>
  </g>
  <!-- the right-angle marker at A -->
  <path d="M 105 103 L 117 103 L 117 115" fill="none" stroke="#6b7280" stroke-width="2.5"/>
</svg>
