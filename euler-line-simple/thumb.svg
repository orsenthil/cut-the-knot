           stroke="#d5d8e8" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="160" y1="150" x2="166" y2="58" stroke="#e0a458" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="165" cy="75" r="5" fill="#d5d8e8"/>
