<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Gerbino's illusion: a hexagon with six small triangles at its corners. -->
  <defs>
    <polygon id="spin" points="0,-13 11.26,6.5 -11.26,6.5"/>
  </defs>
  <polygon points="160,45 207.6,72.5 207.6,127.5 160,155 112.4,127.5 112.4,72.5"
           fill="#8f86ff" fill-opacity="0.10" stroke="#d9656f" stroke-width="3.5" stroke-linejoin="round"/>
  <g fill="#4aa3df" fill-opacity="0.85" stroke="#2f6f9e" stroke-width="1">
    <use href="#spin" transform="translate(160 45) rotate(0)"/>
    <use href="#spin" transform="translate(207.6 72.5) rotate(60)"/>
    <use href="#spin" transform="translate(207.6 127.5) rotate(120)"/>
    <use href="#spin" transform="translate(160 155) rotate(180)"/>
    <use href="#spin" transform="translate(112.4 127.5) rotate(240)"/>
    <use href="#spin" transform="translate(112.4 72.5) rotate(300)"/>
  </g>
</svg>
