<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A flexed square (rhombus) with the equilateral triangles that stay rigid. -->
  <g stroke="#5d6472" stroke-width="2" stroke-linejoin="round">
    <polygon points="160,66 196,100 160,134 124,100" fill="#7c86c9" fill-opacity="0.72"/>
    <polygon points="124,100 160,134 106,152" fill="#63ad95" fill-opacity="0.75"/>
    <polygon points="196,100 160,66 214,48" fill="#63ad95" fill-opacity="0.75"/>
    <polygon points="124,100 160,66 106,48" fill="#6d84bf" fill-opacity="0.6"/>
    <polygon points="196,100 160,134 214,152" fill="#6d84bf" fill-opacity="0.6"/>
    <polygon points="106,48 160,66 124,100" fill="#63ad95" fill-opacity="0.45"/>
    <polygon points="214,152 160,134 196,100" fill="#63ad95" fill-opacity="0.45"/>
  </g>
  <circle cx="160" cy="66" r="6" fill="#9aa1ad"/>
  <circle cx="196" cy="100" r="6" fill="#9aa1ad"/>
  <circle cx="160" cy="134" r="6" fill="#9aa1ad"/>
</svg>
