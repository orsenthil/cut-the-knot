<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="A stack of numbered pancakes being flipped">
  <title>Auto Flipper</title>
  <!-- A snapshot of the pile: five pancakes, top first, with the flip arrow. -->
  <g stroke="#6b7280" stroke-width="2">
    <rect x="130" y="34" width="60" height="20" rx="10" fill="#c98a4b"/>
    <rect x="112" y="62" width="96" height="20" rx="10" fill="#7a8bc4"/>
    <rect x="94"  y="90" width="132" height="20" rx="10" fill="#4f9b8f"/>
    <rect x="78"  y="118" width="164" height="20" rx="10" fill="#b56b8c"/>
    <rect x="62"  y="146" width="196" height="20" rx="10" fill="#6c63c8"/>
  </g>
  <g fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
    <text x="160" y="48">1</text>
    <text x="160" y="76">4</text>
    <text x="160" y="104">2</text>
    <text x="160" y="132">5</text>
    <text x="160" y="160">3</text>
  </g>
  <!-- Curved arrow showing the top prefix turning over. -->
  <path d="M52 60 C 26 40, 36 18, 74 16" fill="none" stroke="#d9a441" stroke-width="5" stroke-linecap="round"/>
  <path d="M64 8 L78 16 L64 26 Z" fill="#d9a441"/>
</svg>
