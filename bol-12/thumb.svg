<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Circle on AB, the tangents from T, the crossing R and the perpendicular to AB. -->
  <circle cx="160" cy="120" r="50" fill="#8f86ff" fill-opacity="0.10"
          stroke="#8f86ff" stroke-opacity="0.55" stroke-width="2"/>
  <path d="M 110 120 A 50 50 0 0 1 210 120" fill="none" stroke="#8f86ff" stroke-width="3"/>
  <line x1="110" y1="120" x2="210" y2="120" stroke="#8f86ff" stroke-width="2.5"/>
  <g stroke="#8f86ff" stroke-width="2" stroke-opacity="0.8">
    <line x1="110" y1="120" x2="180" y2="21.3"/>
    <line x1="210" y1="120" x2="180" y2="21.3"/>
  </g>
  <g stroke="#4ade80" stroke-width="2.5">
    <line x1="180" y1="60" x2="143.4" y2="72.8"/>
    <line x1="180" y1="60" x2="201.6" y2="92.2"/>
  </g>
  <line x1="180" y1="60" x2="180" y2="120" stroke="#4ade80" stroke-width="2.5"
        stroke-dasharray="6 5"/>
  <path d="M 172 120 L 172 112 L 180 112" fill="none" stroke="#4ade80" stroke-width="2"/>
  <g fill="#8f86ff">
    <circle cx="110" cy="120" r="4"/>
    <circle cx="210" cy="120" r="4"/>
    <circle cx="143.4" cy="72.8" r="4"/>
    <circle cx="201.6" cy="92.2" r="4"/>
    <circle cx="180" cy="60" r="5"/>
  </g>
  <g fill="#4ade80">
    <circle cx="180" cy="21.3" r="4.5"/>
    <circle cx="180" cy="120" r="4"/>
  </g>
</svg>
