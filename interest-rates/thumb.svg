<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Two stacked bars comparing simple and compound interest, with compound interest growing faster">
  <rect x="20" y="20" width="280" height="160" rx="10" fill="#3b4353" stroke="#aab4c4" stroke-width="2"/>
  <g font-family="ui-sans-serif, sans-serif" font-size="11" fill="#dbe3ef">
    <text x="36" y="48">Simple</text><text x="36" y="88">Compound</text>
  </g>
  <rect x="110" y="36" width="140" height="18" rx="6" fill="#6a5df0"/>
  <rect x="110" y="76" width="140" height="18" rx="6" fill="#6a5df0"/>
  <rect x="250" y="76" width="26" height="18" rx="6" fill="#15803d"/>
  <g stroke="#8f86ff" stroke-width="2" fill="none">
    <path d="M110 128 Q170 120 200 104 T288 58"/>
  </g>
  <g fill="#8f86ff">
