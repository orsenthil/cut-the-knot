<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The key moment: lines from C through the Vecten square's far corners cut
       the base at P and Q, the base of the red inscribed square. -->
  <g fill="none" stroke="#8f86ff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 80 L160 80 L160 160 L80 160 Z" stroke-width="2.5" opacity="0.75"/>
    <path d="M80 80 L130 30 L160 80" stroke-width="3"/>
    <path d="M130 30 L80 160 M130 30 L160 160" stroke-width="1.8" opacity="0.8"/>
  </g>
  <path d="M110.8 80 L110.8 49.2 L141.5 49.2 L141.5 80 Z"
        fill="#f87171" fill-opacity="0.18" stroke="#f87171" stroke-width="3"
        stroke-linejoin="round"/>
  <g fill="#8f86ff">
    <circle cx="80" cy="80" r="5"/>
    <circle cx="160" cy="80" r="5"/>
    <circle cx="130" cy="30" r="5"/>
    <circle cx="80" cy="160" r="4"/>
    <circle cx="160" cy="160" r="4"/>
  </g>
  <g fill="#4ade80">
    <circle cx="110.8" cy="80" r="4"/>
    <circle cx="141.5" cy="80" r="4"/>
    <circle cx="110.8" cy="49.2" r="4"/>
    <circle cx="141.5" cy="49.2" r="4"/>
  </g>
</svg>
