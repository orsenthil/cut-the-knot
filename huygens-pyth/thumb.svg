<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Huygens' figure: three squares on a right triangle, with the big square
       split into the two strips whose areas are AC² and BC². -->
  <g fill="none" stroke="#8d95ad" stroke-width="2" stroke-linejoin="round">
    <polygon points="80,130 210,130 210,195 80,195" fill="#8490e6" fill-opacity="0.32"/>
    <polygon points="80,130 145,65 80,0 15,65" fill="#d38fae" fill-opacity="0.34"/>
    <polygon points="210,130 145,65 210,0 275,65" fill="#83c29d" fill-opacity="0.34"/>
  </g>
  <polygon points="80,130 210,130 145,65" fill="#f0f2f8" fill-opacity="0.5" stroke="#9aa2b8" stroke-width="2"/>
  <path d="M80 130 L210 130 M80 195 L210 195 M145 130 L145 195" fill="none" stroke="#c9d0e4" stroke-width="2" stroke-dasharray="5 4"/>
  <g fill="#7b83a8">
    <circle cx="80" cy="130" r="4"/><circle cx="210" cy="130" r="4"/><circle cx="145" cy="65" r="4"/>
  </g>
  <path d="M145 65 L145 80 L160 80" fill="none" stroke="#7b83a8" stroke-width="2"/>
</svg>
