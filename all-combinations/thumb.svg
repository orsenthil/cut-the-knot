<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="A scrolling list of number triples representing all combinations, with a counter showing the binomial coefficient">
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="24" y="22" width="200" height="156" rx="10" fill="#3b4353" stroke="#aab4c4" stroke-width="2"/>
    <g font-family="ui-monospace, monospace" font-size="13" fill="#e9eef6">
      <text x="38" y="48">1  2  3</text>
      <text x="38" y="70">1  2  4</text>
      <text x="38" y="92">1  2  5</text>
      <text x="38" y="114">1  3  4</text>
      <text x="38" y="136">1  3  5</text>
      <text x="38" y="158">1  4  5</text>
    </g>
    <rect x="38" y="58" width="170" height="20" rx="4" fill="#6a5df0" opacity="0.35"/>
    <rect x="236" y="62" width="62" height="52" rx="8" fill="#2f3542" stroke="#d9a441" stroke-width="2"/>
    <text x="267" y="84" fill="#dbe3ef" font-size="13" font-weight="700" text-anchor="middle">C(5,3)</text>
    <text x="267" y="103" fill="#f2f5fa" font-size="16" font-weight="700" text-anchor="middle">= 10</text>
  </g>
</svg>
