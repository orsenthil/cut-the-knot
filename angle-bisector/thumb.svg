<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <title>An angle with its two equal-circle construction and bisecting line</title>
  <!-- The two rays from A -->
  <path d="M 62 152 L 288 152 M 62 152 L 108 34" fill="none" stroke="#8b95b5" stroke-width="3" stroke-linecap="round"/>
  <!-- Circle centred at A copying AD onto the other ray -->
  <circle cx="62" cy="152" r="88" fill="none" stroke="#7987e8" stroke-width="1.6" stroke-dasharray="5 6" opacity="0.75"/>
  <!-- The two equal circles at D and E -->
  <circle cx="152" cy="152" r="84" fill="#46b39c" fill-opacity="0.06" stroke="#46b39c" stroke-width="2" opacity="0.85"/>
  <circle cx="92" cy="71" r="84" fill="#46b39c" fill-opacity="0.06" stroke="#46b39c" stroke-width="2" opacity="0.85"/>
  <!-- The common chord through A and the crossing F -->
  <path d="M 62 152 L 216 62" fill="none" stroke="#d9962f" stroke-width="3" stroke-dasharray="8 5" stroke-linecap="round"/>
  <circle cx="152" cy="152" r="5" fill="#7987e8"/>
  <circle cx="92" cy="71" r="5" fill="#7987e8"/>
  <circle cx="178" cy="67" r="6" fill="#d9962f"/>
  <circle cx="62" cy="152" r="6" fill="#e6e9ff" stroke="#7987e8" stroke-width="2"/>
</svg>
