<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A triangle, the perpendiculars from its side midpoints, the nine-point
       circle and Cantor's point where the three lines meet. -->
  <circle cx="160" cy="100" r="62" fill="none" stroke="#7c8394" stroke-width="2" stroke-dasharray="6 5"/>
  <g stroke="#8f86ff" stroke-width="2.5" stroke-linecap="round">
    <line x1="170.1" y1="117.3" x2="169.3" y2="86.3"/>
    <line x1="189.5" y1="62.9" x2="169.3" y2="86.3"/>
    <line x1="138.8" y1="92.5" x2="169.3" y2="86.3"/>
  </g>
  <polygon points="158.2,38 119.5,146.9 220.8,87.7" fill="#8f86ff" fill-opacity="0.12" stroke="#8f86ff" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="169.3" cy="86.3" r="31" fill="#4ade80" fill-opacity="0.12" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="5 4"/>
  <g fill="#7c8394">
    <circle cx="170.1" cy="117.3" r="3"/>
    <circle cx="189.5" cy="62.9" r="3"/>
    <circle cx="138.8" cy="92.5" r="3"/>
  </g>
  <circle cx="169.3" cy="86.3" r="6" fill="#4ade80"/>
  <g fill="#8f86ff">
    <circle cx="158.2" cy="38" r="5"/>
    <circle cx="119.5" cy="146.9" r="5"/>
    <circle cx="220.8" cy="87.7" r="5"/>
  </g>
</svg>
