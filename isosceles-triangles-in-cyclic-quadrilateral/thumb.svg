  <polygon points="216.3,132.5 103.7,132.5 106.4,62.1 192.5,43.7"
           fill="none" stroke="#6f9bb5" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="216.3" y1="132.5" x2="106.4" y2="62.1" stroke="#c79a55" stroke-width="2"/>
  <line x1="103.7" y1="132.5" x2="192.5" y2="43.7" stroke="#c79a55" stroke-width="2"/>
  <line x1="103.7" y1="132.5" x2="216.3" y2="132.5" stroke="#4f9d69" stroke-width="4"/>
  <line x1="139.1" y1="91.3" x2="152.3" y2="91.3" stroke="#4f9d69" stroke-width="4"/>
  <g fill="#e0a23c" stroke="#4b5563" stroke-width="1.5">
