<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Six-circle chain: triangle, four of the circles, touching dots and the
       circle through the touching points. Mid tones read on light and dark. -->
  <g fill="none" stroke-width="3">
    <path d="M 55 166 L 148 30 L 272 142 Z" stroke="#8f9bb3" stroke-linejoin="round"/>
    <circle cx="112" cy="112" r="31" stroke="#6c8cff"/>
    <circle cx="176" cy="92" r="24" stroke="#e09a5c"/>
    <circle cx="205" cy="132" r="30" stroke="#6c8cff"/>
    <circle cx="118" cy="142" r="20" stroke="#e09a5c"/>
    <circle cx="163" cy="103" r="71" stroke="#57b39a" stroke-dasharray="7 6" stroke-width="2.5"/>
  </g>
  <g fill="#d4d9e6">
    <circle cx="55" cy="166" r="5"/>
    <circle cx="148" cy="30" r="5"/>
    <circle cx="272" cy="142" r="5"/>
  </g>
  <g fill="#f0c04a">
    <circle cx="99" cy="92" r="4"/>
    <circle cx="158" cy="116" r="4"/>
    <circle cx="228" cy="121" r="4"/>
    <circle cx="141" cy="161" r="4"/>
    <circle cx="102" cy="126" r="4"/>
    <circle cx="202" cy="102" r="4"/>
  </g>
</svg>
