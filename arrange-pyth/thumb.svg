<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Two equal squares: one square on the long side, two squares on the legs. -->
  <g fill="none" stroke="#6f7887" stroke-width="2.4">
    <rect x="18" y="48" width="104" height="104"/>
    <rect x="180" y="48" width="104" height="104"/>
  </g>

  <!-- Left: four triangles and the square on the long side. -->
  <g stroke="#6f7887" stroke-width="1.4" stroke-linejoin="round">
    <path d="M18 152 L54 152 L18 84 Z" fill="#d9ad4a" opacity="0.6"/>
    <path d="M18 84 L18 48 L86 48 Z" fill="#d9ad4a" opacity="0.6"/>
    <path d="M86 48 L122 48 L122 116 Z" fill="#d9ad4a" opacity="0.6"/>
    <path d="M122 116 L122 152 L54 152 Z" fill="#d9ad4a" opacity="0.6"/>
    <path d="M18 84 L86 48 L122 116 L54 152 Z" fill="#5a86c8" opacity="0.7"/>
  </g>
  <circle cx="54" cy="152" r="5" fill="#3f8f6b" stroke="#6f7887" stroke-width="1.5"/>

  <path d="M144 100 H164 M159 94 L166 100 L159 106" fill="none" stroke="#6f7887" stroke-width="2.4"/>

  <!-- Right: the same four triangles, now leaving squares of sides a and b. -->
  <g stroke="#6f7887" stroke-width="1.4" stroke-linejoin="round">
    <path d="M180 152 L216 84 L216 152 Z" fill="#d9ad4a" opacity="0.6"/>
    <path d="M180 152 L180 84 L216 84 Z" fill="#d9ad4a" opacity="0.6"/>
    <path d="M284 48 L216 84 L216 48 Z" fill="#d9ad4a" opacity="0.6"/>
    <path d="M284 48 L284 84 L216 84 Z" fill="#d9ad4a" opacity="0.6"/>
    <path d="M180 48 L216 48 L216 84 L180 84 Z" fill="#5a86c8" opacity="0.7"/>
    <path d="M284 152 L216 152 L216 84 L284 84 Z" fill="#5a86c8" opacity="0.45"/>
  </g>
</svg>
