<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="A circle of eight cups holding stones; the top cup is empty and highlighted, with two stones in flight toward the next cup">
  <g stroke="#515b6b" stroke-width="2">
    <circle cx="111" cy="49" r="18" fill="#9ba6b6"/>
    <circle cx="88"  cy="100" r="18" fill="#9ba6b6"/>
    <circle cx="111" cy="151" r="18" fill="#9ba6b6"/>
    <circle cx="160" cy="172" r="18" fill="#9ba6b6"/>
    <circle cx="209" cy="151" r="18" fill="#9ba6b6"/>
    <circle cx="232" cy="100" r="18" fill="#9ba6b6"/>
    <circle cx="209" cy="49" r="18" fill="#9ba6b6"/>
  </g>

  <!-- the cup the hand is at: just emptied, so no stones in it -->
  <circle cx="160" cy="28" r="18" fill="#9ba6b6" stroke="#6a5df0" stroke-width="4"/>

  <g fill="#e9b949">
    <circle cx="105" cy="53" r="4"/><circle cx="117" cy="53" r="4"/><circle cx="111" cy="43" r="4"/>
    <circle cx="82"  cy="104" r="4"/><circle cx="94"  cy="104" r="4"/><circle cx="88"  cy="94" r="4"/>
    <circle cx="105" cy="155" r="4"/><circle cx="117" cy="155" r="4"/><circle cx="111" cy="145" r="4"/>
    <circle cx="154" cy="176" r="4"/><circle cx="166" cy="176" r="4"/><circle cx="160" cy="166" r="4"/>
    <circle cx="203" cy="155" r="4"/><circle cx="215" cy="155" r="4"/><circle cx="209" cy="145" r="4"/>
    <circle cx="226" cy="104" r="4"/><circle cx="238" cy="104" r="4"/><circle cx="232" cy="94" r="4"/>
    <circle cx="203" cy="53" r="4"/><circle cx="215" cy="53" r="4"/><circle cx="209" cy="43" r="4"/>
  </g>

  <!-- two stones in flight from the hand's cup to the next one, counterclockwise -->
  <g fill="#e9b949" stroke="#8a6a12" stroke-width="1.5">
    <circle cx="142" cy="12" r="5"/>
    <circle cx="116" cy="22" r="5"/>
  </g>

  <!-- the hand, inside the ring, pointing at the cup it is holding -->
  <polygon points="160,52 151,68 169,68" fill="#6a5df0"/>
</svg>
