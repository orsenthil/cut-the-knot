<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The applet's key moment: two equilateral triangles on the diagonals of
       an antiequilic quadrilateral, with their shared tip on the S–T bisector.
       Transparent background, mid-tone colours for light and dark cards. -->
  <circle cx="160" cy="102" r="89" fill="none" stroke="#77808f" stroke-width="1.5" stroke-dasharray="5 6"/>
  <line x1="83" y1="58" x2="153" y2="13" stroke="#77808f" stroke-width="1.5"/>
  <line x1="237" y1="58" x2="153" y2="13" stroke="#77808f" stroke-width="1.5"/>
  <polygon points="83,58 237,58 200,38 118,35" fill="none" stroke="#3e4656" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="83" y1="58" x2="200" y2="38" stroke="#5b4ee8" stroke-width="2.5"/>
  <line x1="237" y1="58" x2="118" y2="35" stroke="#5b4ee8" stroke-width="2.5"/>
  <polygon points="83,58 200,38 158,149" fill="#5b4ee8" fill-opacity="0.16" stroke="#6b5ef0" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="237,58 118,35 158,149" fill="#5b4ee8" fill-opacity="0.16" stroke="#6b5ef0" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="153" y1="13" x2="160" y2="191" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
  <circle cx="83" cy="58" r="4" fill="#3e4656"/>
  <circle cx="237" cy="58" r="4" fill="#3e4656"/>
  <circle cx="153" cy="13" r="4" fill="#3e4656"/>
  <circle cx="200" cy="38" r="4" fill="#6b5ef0" stroke="#ffffff" stroke-width="1"/>
  <circle cx="118" cy="35" r="4" fill="#6b5ef0" stroke="#ffffff" stroke-width="1"/>
  <circle cx="160" cy="191" r="4.5" fill="#15803d"/>
  <circle cx="158" cy="149" r="6" fill="#15803d" stroke="#ffffff" stroke-width="1.5"/>
</svg>
