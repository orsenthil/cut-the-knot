    <rect x="24" y="28" width="272" height="16" rx="5"/>
  </g>
  <g fill="#8982dc">
    <rect x="24" y="70" width="91" height="16" rx="5"/>
    <rect x="205" y="70" width="91" height="16" rx="5"/>
  </g>
  <g fill="#7a70cf">
    <rect x="24" y="112" width="46" height="16" rx="5"/>
    <rect x="97" y="112" width="46" height="16" rx="5"/>
    <rect x="177" y="112" width="46" height="16" rx="5"/>
    <rect x="250" y="112" width="46" height="16" rx="5"/>
  </g>
  <g fill="#6c62bd">
    <rect x="24" y="154" width="23" height="16" rx="4"/>
    <rect x="73" y="154" width="23" height="16" rx="4"/>
    <rect x="97" y="154" width="23" height="16" rx="4"/>
    <rect x="122" y="154" width="23" height="16" rx="4"/>
    <rect x="175" y="154" width="23" height="16" rx="4"/>
    <rect x="200" y="154" width="23" height="16" rx="4"/>
    <rect x="225" y="154" width="23" height="16" rx="4"/>
    <rect x="273" y="154" width="23" height="16" rx="4"/>
  </g>
</svg>
