<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="A five by five board with one missing corner, covered by eight L-shaped trominoes in blue, orange, green and purple">
  <!-- Transparent background. A 5x5 board, 32 px a square. -->
  <rect x="80" y="20" width="160" height="160" rx="5" fill="#3a4252"/>
  <g transform="translate(80 20) scale(32)" stroke="#5c6678" stroke-width="0.025" opacity="0.8">
    <line x1="0" y1="1" x2="5" y2="1"/>
    <line x1="0" y1="2" x2="5" y2="2"/>
    <line x1="0" y1="3" x2="5" y2="3"/>
    <line x1="0" y1="4" x2="5" y2="4"/>
    <line x1="1" y1="0" x2="1" y2="5"/>
    <line x1="2" y1="0" x2="2" y2="5"/>
    <line x1="3" y1="0" x2="3" y2="5"/>
    <line x1="4" y1="0" x2="4" y2="5"/>
  </g>

  <!-- The missing corner. -->
  <rect x="80" y="20" width="32" height="32" fill="#11151d"/>
  <rect x="84" y="24" width="24" height="24" rx="4" fill="none" stroke="#9aa1ad" stroke-width="2" stroke-dasharray="4 4" opacity="0.9"/>

  <!-- One tiling of the 5x5 board with the upper-left corner missing. -->
  <g transform="translate(80 20) scale(32)" stroke="#22283a" stroke-width="0.06" stroke-linejoin="round">
    <polygon points="0,0 2,0 2,2 1,2 1,1 0,1" transform="translate(1 0)" fill="#b07aa1"/>
    <polygon points="0,0 2,0 2,2 1,2 1,1 0,1" transform="translate(3 0)" fill="#b07aa1"/>
    <polygon points="0,0 2,0 2,1 1,1 1,2 0,2" transform="translate(0 1)" fill="#59a14f"/>
    <polygon points="0,0 1,0 1,1 2,1 2,2 0,2" transform="translate(3 1)" fill="#f28e2b"/>
    <polygon points="0,0 2,0 2,1 1,1 1,2 0,2" transform="translate(1 2)" fill="#59a14f"/>
    <polygon points="0,0 1,0 1,1 2,1 2,2 0,2" transform="translate(0 3)" fill="#f28e2b"/>
    <polygon points="0,0 1,0 1,1 2,1 2,2 0,2" transform="translate(2 3)" fill="#f28e2b"/>
    <polygon points="0,0 2,0 2,2 1,2 1,1 0,1" transform="translate(3 3)" fill="#b07aa1"/>
  </g>
</svg>
