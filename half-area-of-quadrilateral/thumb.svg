<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The key moment: KE (dashed) runs from the midpoint of BD parallel to AC,
       and CE (gold) splits the quadrilateral into two equal coloured pieces.
       Mid-tones read on white and on near-black. -->
  <polygon points="270,150 65.35,59.20 70,35 245,45" fill="#8f86ff" fill-opacity="0.42"/>
  <polygon points="270,150 65.35,59.20 45,165" fill="#4f9d78" fill-opacity="0.42"/>
  <g fill="none" stroke="#7b83c7" stroke-width="3" stroke-linejoin="round">
    <polygon points="70,35 45,165 270,150 245,45"/>
    <line x1="45" y1="165" x2="245" y2="45" stroke-dasharray="6 5" stroke-width="2"/>
  </g>
  <line x1="70" y1="35" x2="270" y2="150" stroke="#7b83c7" stroke-width="2" stroke-dasharray="6 5" opacity="0.8"/>
  <line x1="145" y1="105" x2="65.35" y2="59.20" stroke="#8f86ff" stroke-width="3" stroke-dasharray="6 5"/>
  <line x1="270" y1="150" x2="65.35" y2="59.20" stroke="#d0a24a" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#ffffff" stroke-width="2">
    <circle cx="145" cy="105" r="6" fill="#d0a24a"/>
    <circle cx="65.35" cy="59.20" r="6" fill="#d0a24a"/>
  </g>
</svg>
