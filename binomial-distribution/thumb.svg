  <line x1="26" y1="152" x2="26" y2="40" stroke="#8993a6" stroke-width="2" stroke-linecap="round"/>

  <g fill="#7b86c9">
    <rect x="32" y="134" width="22" height="18" rx="3"/>
    <rect x="60" y="122" width="22" height="30" rx="3"/>
    <rect x="88" y="104" width="22" height="48" rx="3"/>
    <rect x="172" y="80" width="22" height="72" rx="3"/>
    <rect x="200" y="104" width="22" height="48" rx="3"/>
    <rect x="228" y="122" width="22" height="30" rx="3"/>
    <rect x="256" y="134" width="22" height="18" rx="3"/>
  </g>
  <rect x="116" y="80" width="22" height="72" rx="3" fill="#8d97d4"/>
  <rect x="144" y="50" width="22" height="102" rx="3" fill="#d98a3a"/>

  <polyline points="43,134 71,122 99,104 127,80 155,50 183,80 211,104 239,122 267,134"
