<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The key moment: two carpets over one quadrilateral. The four red corner
       triangles have the same total area as the green middle quadrilateral.
       Mid-tones read on white and on near-black; the background is transparent. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="35,65 250,160 250,35 125,35" stroke="#7b83c7" stroke-width="3.5"/>

    <!-- partition 1: AFCH blue, ABF and CDH red -->
    <polygon points="35,65 250,97.5 250,35 80,50" fill="#5f6fd8" fill-opacity="0.32"/>
    <polygon points="35,65 250,160 250,97.5" fill="#c85a5a" fill-opacity="0.35"/>
    <polygon points="250,35 125,35 80,50" fill="#c85a5a" fill-opacity="0.35"/>

    <!-- partition 2: BGDE blue, ADE and BCG red -->
    <polygon points="250,160 187.5,35 125,35 142.5,112.5" fill="#5f6fd8" fill-opacity="0.32"/>
    <polygon points="35,65 142.5,112.5 125,35" fill="#c85a5a" fill-opacity="0.35"/>
    <polygon points="250,35 187.5,35 250,160" fill="#c85a5a" fill-opacity="0.35"/>

    <!-- the four crossings and the middle quadrilateral -->
    <polygon points="135.2,80.1 216.2,92.4 190.1,40.3 127.4,45.8"
             fill="#3f9d78" fill-opacity="0.55" stroke="#3f9d78" stroke-width="3.5"/>
    <line x1="35" y1="65" x2="250" y2="97.5" stroke="#5f6fd8" stroke-width="2.5"/>
    <line x1="250" y1="35" x2="80" y2="50" stroke="#5f6fd8" stroke-width="2.5"/>
    <line x1="250" y1="160" x2="187.5" y2="35" stroke="#c85a5a" stroke-width="2.5"/>
    <line x1="125" y1="35" x2="142.5" y2="112.5" stroke="#c85a5a" stroke-width="2.5"/>
  </g>

  <g fill="#8f86ff">
    <circle cx="35" cy="65" r="4.5"/>
    <circle cx="250" cy="160" r="4.5"/>
    <circle cx="250" cy="35" r="4.5"/>
    <circle cx="125" cy="35" r="4.5"/>
  </g>
  <g fill="#d0a24a">
    <circle cx="135.2" cy="80.1" r="4"/>
    <circle cx="216.2" cy="92.4" r="4"/>
    <circle cx="190.1" cy="40.3" r="4"/>
    <circle cx="127.4" cy="45.8" r="4"/>
  </g>
</svg>
