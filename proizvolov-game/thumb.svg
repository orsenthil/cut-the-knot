<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Two columns of numbers summing absolute differences">
  <rect width="320" height="200" fill="transparent"/>
  <g font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <rect x="36" y="28" width="100" height="144" rx="10" fill="#e8edf4" stroke="#5a6578" stroke-width="1.5"/>
    <rect x="184" y="28" width="100" height="144" rx="10" fill="#e8edf4" stroke="#5a6578" stroke-width="1.5"/>
    <text x="86" y="58" fill="#3d7ea6">6</text>
    <text x="86" y="88" fill="#3d7ea6">4</text>
    <text x="86" y="118" fill="#2f9e6b">2</text>
    <text x="86" y="148" fill="#2f9e6b">1</text>
    <text x="234" y="58" fill="#2f9e6b">3</text>
    <text x="234" y="88" fill="#2f9e6b">5</text>
    <text x="234" y="118" fill="#3d7ea6">7</text>
    <text x="234" y="148" fill="#3d7ea6">8</text>
    <text x="160" y="100" fill="#5a6578" font-size="22">↔</text>
  </g>
  <text x="160" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#5a6578">sum = 16 = 4²</text>
</svg>
