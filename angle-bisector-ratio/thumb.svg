    <path d="M120 40 L60 160 L270 160 Z" stroke="#6b74c9" stroke-width="4"/>
    <path d="M120 40 L146 160" stroke="#e0a63c" stroke-width="5"/>
    <path d="M270 160 L247 46" stroke="#4aa3a2" stroke-width="3" stroke-dasharray="7 6"/>
    <path d="M120 58 Q133 60 140 80" stroke="#4aa3a2" stroke-width="3"/>
    <path d="M140 82 Q146 101 146 123" stroke="#e0a63c" stroke-width="3"/>
  </g>
  <g stroke="#f3f5f8" stroke-width="2">
    <circle cx="60" cy="160" r="6" fill="#6b74c9"/>
    <circle cx="270" cy="160" r="6" fill="#6b74c9"/>
    <circle cx="120" cy="40" r="6" fill="#6b74c9"/>
    <circle cx="146" cy="160" r="7" fill="#e0a63c"/>
  </g>
</svg>
