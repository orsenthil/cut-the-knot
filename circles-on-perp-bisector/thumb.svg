<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <g fill="none" stroke-linecap="round">
    <!-- sides of the triangle and its base BC -->
    <path d="M 152 34 L 62 150 L 258 150 Z" stroke="#9aa3b2" stroke-width="3"/>
    <path d="M 62 150 L 258 150" stroke="#c7ced9" stroke-width="4"/>
    <!-- perpendicular bisector of BC -->
    <path d="M 160 150 L 160 194" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="6 6"/>
    <!-- the coaxal circle through B and C -->
    <circle cx="160" cy="172" r="104" stroke="#8f86ff" stroke-width="4"/>
    <!-- the two circles tangent to the sides -->
    <circle cx="151" cy="139" r="39" fill="#8f86ff" fill-opacity="0.28" stroke="#6fbfa0" stroke-width="3.5"/>
    <circle cx="178" cy="85" r="20" stroke="#e0a458" stroke-width="3.5" stroke-dasharray="7 5"/>
    <!-- one internal tangent parallel to BC -->
    <path d="M 52 112 L 268 112" stroke="#6fbfa0" stroke-width="3" stroke-dasharray="8 6"/>
  </g>
  <g fill="#8f86ff">
    <circle cx="152" cy="34" r="6"/>
    <circle cx="62" cy="150" r="6"/>
    <circle cx="258" cy="150" r="6"/>
  </g>
  <circle cx="160" cy="172" r="7" fill="#e0a458"/>
</svg>
