<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A handful of coins on the left, and the growing "number of ways" bars
       on the right: the key moment of the Coin Change demo. Transparent
       background; mid-tone colours read on both white and near-black. -->
  <g>
    <!-- three stacked coins -->
    <circle cx="66" cy="128" r="34" fill="#e0a140"/>
    <circle cx="66" cy="128" r="26" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="3"/>
    <circle cx="98" cy="104" r="34" fill="#4bb3a7"/>
    <circle cx="98" cy="104" r="26" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="3"/>
    <circle cx="80" cy="74" r="34" fill="#8f86ff"/>
    <circle cx="80" cy="74" r="26" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="3"/>
  </g>
  <!-- chart base -->
  <rect x="156" y="158" width="140" height="4" rx="2" fill="#8f86ff" opacity="0.7"/>
  <!-- bars: the counts grow as the amount rises -->
  <g fill="#8f86ff" opacity="0.9">
    <rect x="162" y="136" width="18" height="20" rx="3"/>
    <rect x="188" y="120" width="18" height="36" rx="3" fill="#4bb3a7" opacity="0.95"/>
    <rect x="214" y="98" width="18" height="58" rx="3"/>
    <rect x="240" y="70" width="18" height="86" rx="3" fill="#e0a140" opacity="0.95"/>
    <rect x="266" y="40" width="18" height="116" rx="3"/>
  </g>
</svg>
