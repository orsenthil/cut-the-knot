<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="A card of numbers with Yes and No buttons">
  <title>Number Guessing</title>
  <!-- The card of numbers: one of the seven binary-digit cards. -->
  <rect x="55" y="16" width="210" height="142" rx="12" fill="#7a8bc4" stroke="#6c63c8" stroke-width="3"/>
  <g fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
    <text x="85" y="52">1</text><text x="120" y="52">3</text><text x="155" y="52">5</text><text x="190" y="52">7</text><text x="225" y="52">9</text>
    <text x="85" y="82">11</text><text x="120" y="82">13</text><text x="155" y="82">15</text><text x="190" y="82">17</text><text x="225" y="82">19</text>
    <text x="85" y="112">21</text><text x="120" y="112">23</text><text x="155" y="112">25</text><text x="190" y="112">27</text><text x="225" y="112">29</text>
  </g>
  <!-- The mystery, and the two answers the player can press. -->
  <circle cx="250" cy="168" r="17" fill="#d9a441"/>
  <text x="250" y="175" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">?</text>
  <rect x="74" y="164" width="70" height="26" rx="13" fill="#4f9b8f"/>
  <text x="109" y="182" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Yes</text>
  <rect x="157" y="164" width="70" height="26" rx="13" fill="#b56b8c"/>
  <text x="192" y="182" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">No</text>
</svg>
