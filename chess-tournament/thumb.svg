<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Three chess players and a bar chart of B's chances from each starting pair">
  <g font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">
    <!-- the three players -->
    <circle cx="48" cy="52" r="21" fill="#5566bb"/>
    <text x="48" y="59" fill="#ffffff" font-size="22">A</text>
    <circle cx="48" cy="104" r="21" fill="#b5793c"/>
    <text x="48" y="111" fill="#ffffff" font-size="22">B</text>
    <circle cx="48" cy="156" r="21" fill="#4c9574"/>
    <text x="48" y="163" fill="#ffffff" font-size="22">C</text>

    <!-- the games they can start -->
    <path d="M69 52 H104 V78 M69 104 H104 M69 156 H104 V130" fill="none" stroke="#8a93a3" stroke-width="3" stroke-linecap="round"/>
    <rect x="104" y="86" width="92" height="36" rx="10" fill="#6b7280"/>
    <text x="150" y="110" fill="#ffffff" font-size="16">first game</text>
    <path d="M196 104 H224" fill="none" stroke="#8a93a3" stroke-width="3" stroke-linecap="round"/>

    <!-- B's chances from each start: the middle one is the tallest -->
    <g>
      <rect x="228" y="128" width="20" height="38" rx="4" fill="#8a93a3"/>
      <rect x="258" y="118" width="20" height="48" rx="4" fill="#5566bb"/>
      <rect x="288" y="136" width="20" height="30" rx="4" fill="#8a93a3"/>
      <path d="M224 168 H314" fill="none" stroke="#8a93a3" stroke-width="2"/>
      <text x="238" y="184" fill="#7a8290" font-size="12" font-weight="600">AB</text>
      <text x="268" y="184" fill="#7a8290" font-size="12" font-weight="600">BC</text>
      <text x="298" y="184" fill="#7a8290" font-size="12" font-weight="600">AC</text>
    </g>
  </g>
</svg>
