<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Human Tutor &mdash; coolmaths</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Book a 30-minute one-to-one maths coaching session where a teacher leads you through coolmaths games and the ideas behind them.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icons/icon-48.png" type="image/png">
<link rel="apple-touch-icon" href="../assets/icons/icon-180.png">
<link rel="stylesheet" href="../assets/site.css">
<script src="../assets/site.js"></script>
<style>
  .tutor { width: 100%; max-width: 680px; line-height: 1.65; }
  .tutor h2 { margin: 30px 0 8px; font-size: 1.15rem; letter-spacing: -0.01em; }
  .tutor p, .tutor ul, .tutor ol { margin: 0 0 12px; }
  .tutor ul, .tutor ol { padding-left: 1.3em; }
  .tutor li { margin-bottom: 6px; }
  .tutor .lead { color: var(--muted); font-size: 1.05rem; }
  .tutor .book {
    padding: 16px 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
  }
  .tutor .book p:last-child { margin-bottom: 0; }
  .tutor .book .price { font-size: 1.1rem; font-weight: 650; }
  .tutor a.button {
    display: inline-block;
    padding: 10px 20px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    text-decoration: none;
  }
  .tutor a.button:hover { filter: brightness(1.08); }
  .tutor pre {
    margin: 0 0 12px;
    padding: 12px 14px;
    overflow-x: auto;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.88rem;
  }
  .tutor code { overflow-wrap: anywhere; }
  .tutor pre code { overflow-wrap: normal; }
  .tutor .say {
    margin: 0 0 12px;
    padding: 4px 14px;
    border-left: 3px solid var(--accent);
    color: var(--muted);
  }
  .tutor .say p { margin: 6px 0; }
</style>
</head>
<body data-page="tutor">
<main id="main">
  <h1>Human Tutor</h1>

  <div class="tutor">
    <p class="lead">The teacher asks questions, not answers.</p>
    <p>The teacher will help you understand this, and guide you until the concept clicks with an &ldquo;Aha!&rdquo; moment.</p>

    <div class="book">
      <p class="price">30 minutes of maths coaching &mdash; $30</p>
      <p><a class="button" href="https://meeting.learntosolveit.com/index.php/?service=1" target="_blank" rel="noopener">Book a session</a></p>
    </div>
  </div>
</main>
</body>
</html>
