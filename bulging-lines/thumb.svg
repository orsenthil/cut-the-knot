<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A small patch of the illusion: alternating squares, circles on the grid
       points, and the perfectly straight lines that only look bent. Mid-tone
       colours read on both white and near-black. -->
  <g transform="translate(28 12)">
    <g fill="#6f7787">
      <rect x="0" y="0" width="32" height="32"/><rect x="64" y="0" width="32" height="32"/><rect x="128" y="0" width="32" height="32"/>
      <rect x="32" y="32" width="32" height="32"/><rect x="96" y="32" width="32" height="32"/><rect x="160" y="32" width="32" height="32"/>
      <rect x="0" y="64" width="32" height="32"/><rect x="64" y="64" width="32" height="32"/><rect x="128" y="64" width="32" height="32"/>
      <rect x="32" y="96" width="32" height="32"/><rect x="96" y="96" width="32" height="32"/><rect x="160" y="96" width="32" height="32"/>
      <rect x="0" y="128" width="32" height="32"/><rect x="64" y="128" width="32" height="32"/><rect x="128" y="128" width="32" height="32"/>
    </g>
    <g fill="#c2c8d2">
      <rect x="32" y="0" width="32" height="32"/><rect x="96" y="0" width="32" height="32"/><rect x="160" y="0" width="32" height="32"/>
      <rect x="0" y="32" width="32" height="32"/><rect x="64" y="32" width="32" height="32"/><rect x="128" y="32" width="32" height="32"/>
      <rect x="32" y="64" width="32" height="32"/><rect x="96" y="64" width="32" height="32"/><rect x="160" y="64" width="32" height="32"/>
      <rect x="0" y="96" width="32" height="32"/><rect x="64" y="96" width="32" height="32"/><rect x="128" y="96" width="32" height="32"/>
      <rect x="32" y="128" width="32" height="32"/><rect x="96" y="128" width="32" height="32"/><rect x="160" y="128" width="32" height="32"/>
    </g>
    <g fill="#e6e8ee">
      <circle cx="32" cy="32" r="11"/><circle cx="96" cy="32" r="11"/><circle cx="160" cy="32" r="11"/>
      <circle cx="128" cy="64" r="11"/><circle cx="64" cy="96" r="11"/><circle cx="32" cy="128" r="11"/>
      <circle cx="160" cy="128" r="11"/>
    </g>
    <g fill="#505868">
      <circle cx="96" cy="64" r="11"/><circle cx="32" cy="64" r="11"/><circle cx="160" cy="64" r="11"/>
      <circle cx="64" cy="32" r="11"/><circle cx="128" cy="32" r="11"/><circle cx="64" cy="128" r="11"/>
      <circle cx="96" cy="128" r="11"/><circle cx="128" cy="128" r="11"/>
    </g>
    <g stroke="#8f86ff" stroke-width="2">
      <path d="M32 0V160M64 0V160M96 0V160M128 0V160M160 0V160"/>
      <path d="M0 32H192M0 64H192M0 96H192M0 128H192"/>
    </g>
  </g>
  <!-- The see-through second copy, shifted a little: its lines are straight too. -->
  <g transform="translate(38 17)" opacity="0.42">
    <rect x="0" y="0" width="192" height="160" rx="6" fill="none" stroke="#8f86ff" stroke-width="3" stroke-dasharray="9 7"/>
    <path d="M32 0V160M160 0V160M0 32H192M0 128H192" fill="none" stroke="#8f86ff" stroke-width="2"/>
  </g>
  <circle cx="268" cy="171" r="9" fill="#8f86ff"/>
</svg>
