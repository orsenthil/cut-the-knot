  <circle cx="142" cy="104" r="25" fill="none" stroke="#4d9f88" stroke-width="4"/>
  <circle cx="229" cy="104" r="38" fill="none" stroke="#c97070" stroke-width="4"/>
  <path d="M 30 130 L 312 74" fill="none" stroke="#d6dce5" stroke-width="3" stroke-linecap="round"/>
  <path d="M 165 98 L 174 126 M 213 81 L 205 108" fill="none" stroke="#8f86ff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="96" cy="104" r="6" fill="#8f86ff"/>
  <circle cx="142" cy="104" r="5" fill="#4d9f88"/>
  <circle cx="229" cy="104" r="5" fill="#c97070"/>
  <circle cx="312" cy="74" r="5" fill="#8f86ff"/>
</svg>
