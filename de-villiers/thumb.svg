<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The key moment: similar triangles on the sides of a quadrilateral,
       with their free tips P,Q,R,S forming a parallelogram. Mid-tone colours
       read on both white and near-black. -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="45,110 120,140 240,100 180,25" stroke="#7b83c7" stroke-width="3"/>
    <g stroke="#8f86ff" stroke-width="2.5">
      <path d="M45 110 L52.5 162 L120 140"/>
      <path d="M240 100 L178.5 45.5 L120 140"/>
      <path d="M240 100 L262.7 41.9 L180 25"/>
      <path d="M45 110 L136.7 158.4 L180 25"/>
    </g>
    <polygon points="52.5,162 178.5,45.5 262.7,41.9 136.7,158.4"
             fill="#4f9d78" fill-opacity="0.18" stroke="#4f9d78" stroke-width="4"/>
  </g>
  <g fill="#8f86ff">
    <circle cx="45" cy="110" r="4"/><circle cx="120" cy="140" r="4"/>
    <circle cx="240" cy="100" r="4"/><circle cx="180" cy="25" r="4"/>
  </g>
  <g fill="#d0a24a">
    <circle cx="52.5" cy="162" r="5"/><circle cx="178.5" cy="45.5" r="5"/>
    <circle cx="262.7" cy="41.9" r="5"/><circle cx="136.7" cy="158.4" r="5"/>
  </g>
</svg>
