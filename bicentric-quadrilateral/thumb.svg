<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <title>Bicentric quadrilateral: an outer quadrilateral with an incircle and a circumcircle</title>
  <!-- Circumcircle through the four outer corners. -->
  <circle cx="160" cy="94.4" r="75.5" fill="none" stroke="#4f9d78" stroke-width="2"/>
  <!-- The circumscribed quadrilateral: tangents to the inner circle. -->
  <polygon points="170,169.3 96.7,135.8 84.4,93.5 170,19.6"
           fill="#8f98aa" fill-opacity="0.25" stroke="#8f98aa" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- The inner circle (incircle of the outer quadrilateral). -->
  <circle cx="130" cy="107" r="40" fill="#7580e0" fill-opacity="0.10" stroke="#7580e0" stroke-width="2.5"/>
  <!-- The contact quadrilateral and its diagonals. -->
  <polygon points="170,107 113.4,143.4 91.6,118.2 103.9,76.7"
           fill="none" stroke="#6c7488" stroke-width="1.6"/>
  <line x1="170" y1="107" x2="91.6" y2="118.2" stroke="#9aa3b2" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="113.4" y1="143.4" x2="103.9" y2="76.7" stroke="#9aa3b2" stroke-width="1.3" stroke-dasharray="4 4"/>
  <!-- I, E and O lie on one line. -->
  <line x1="130" y1="107" x2="159.9" y2="94.4" stroke="#d4a72c" stroke-width="3" stroke-linecap="round"/>
  <circle cx="130" cy="107" r="4.5" fill="#7580e0"/>
  <circle cx="109.4" cy="115.6" r="4.5" fill="#4f9d78"/>
  <circle cx="159.9" cy="94.4" r="4.5" fill="#4f9d78"/>
  <g fill="#6c7488">
    <circle cx="170" cy="107" r="3.6"/>
    <circle cx="113.4" cy="143.4" r="3.6"/>
    <circle cx="91.6" cy="118.2" r="3.6"/>
    <circle cx="103.9" cy="76.7" r="3.6"/>
  </g>
  <g fill="#8f98aa">
    <circle cx="170" cy="169.3" r="3"/>
    <circle cx="96.7" cy="135.8" r="3"/>
    <circle cx="84.4" cy="93.5" r="3"/>
    <circle cx="170" cy="19.6" r="3"/>
  </g>
</svg>
