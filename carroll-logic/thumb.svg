<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Lewis Carroll's trilateral diagram with red and grey counters">
  <rect x="80" y="20" width="160" height="160" rx="6" fill="#e6e9ef" stroke="#3a3f4a" stroke-width="3"/>
  <rect x="120" y="60" width="80" height="80" fill="#cfd5df" stroke="#3a3f4a" stroke-width="3"/>
  <line x1="160" y1="20" x2="160" y2="180" stroke="#3a3f4a" stroke-width="3"/>
  <line x1="80" y1="100" x2="240" y2="100" stroke="#3a3f4a" stroke-width="3"/>
  <circle cx="140" cy="80" r="11" fill="#8c92a0" stroke="#3a3f4a" stroke-width="2"/>
  <circle cx="180" cy="80" r="11" fill="#8c92a0" stroke="#3a3f4a" stroke-width="2"/>
  <circle cx="140" cy="120" r="11" fill="#d0463b" stroke="#6e1f19" stroke-width="2"/>
  <circle cx="220" cy="160" r="11" fill="#8c92a0" stroke="#3a3f4a" stroke-width="2"/>
  <circle cx="100" cy="100" r="9" fill="#d0463b" stroke="#6e1f19" stroke-width="2"/>
</svg>
