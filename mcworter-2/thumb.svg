        stroke-width="2" stroke-dasharray="5 5"/>
  <polygon points="210,135 256,155 206,85 160,65" fill="#8189d6" fill-opacity="0.45"
           stroke="#6f78b4" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="160,65 174,9 104,79 90,135" fill="#d4a85a" fill-opacity="0.5"
           stroke="#a9843f" stroke-width="2" stroke-linejoin="round"/>
  <path d="M256 155 L104 79" fill="none" stroke="#d46c72" stroke-width="3"/>
  <circle cx="180" cy="117" r="6.5" fill="#d46c72"/>
  <circle cx="90" cy="135" r="5" fill="#6f78b4"/>
  <circle cx="210" cy="135" r="5" fill="#6f78b4"/>
  <circle cx="160" cy="65" r="5" fill="#6f78b4"/>
</svg>
