<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Twelve squares in a loop with four coloured chips on the first four">
  <g transform="translate(28,20)">
    <rect x="0" y="0" width="164" height="164" rx="6" fill="#8a8f99"/>
    <!-- top row -->
    <rect x="2" y="2" width="38" height="38" fill="#c7cbd3"/>
    <rect x="42" y="2" width="38" height="38" fill="#aeb3bd"/>
    <rect x="82" y="2" width="38" height="38" fill="#c7cbd3"/>
    <rect x="122" y="2" width="38" height="38" fill="#aeb3bd"/>
    <!-- right -->
    <rect x="122" y="42" width="38" height="38" fill="#c7cbd3"/>
    <rect x="122" y="82" width="38" height="38" fill="#aeb3bd"/>
    <rect x="122" y="122" width="38" height="38" fill="#c7cbd3"/>
    <!-- bottom -->
    <rect x="82" y="122" width="38" height="38" fill="#aeb3bd"/>
    <rect x="42" y="122" width="38" height="38" fill="#c7cbd3"/>
    <rect x="2" y="122" width="38" height="38" fill="#aeb3bd"/>
    <!-- left -->
    <rect x="2" y="82" width="38" height="38" fill="#c7cbd3"/>
    <rect x="2" y="42" width="38" height="38" fill="#aeb3bd"/>
    <!-- inner hole -->
    <rect x="42" y="42" width="78" height="78" fill="#8a8f99"/>
    <!-- chips -->
    <circle cx="21" cy="21" r="14" fill="#c0362c" stroke="#2a2a2a" stroke-width="2"/>
    <circle cx="61" cy="21" r="14" fill="#d4a017" stroke="#2a2a2a" stroke-width="2"/>
    <circle cx="101" cy="21" r="14" fill="#2c5fc0" stroke="#2a2a2a" stroke-width="2"/>
    <circle cx="141" cy="21" r="14" fill="#6b7280" stroke="#2a2a2a" stroke-width="2"/>
  </g>
  <!-- unfolded hint ring -->
  <g fill="none" stroke="#5b4ee8" stroke-width="3">
    <circle cx="250" cy="100" r="48"/>
  </g>
  <g fill="#5b4ee8">
    <circle cx="250" cy="52" r="5"/>
    <circle cx="290" cy="76" r="5"/>
    <circle cx="290" cy="124" r="5"/>
    <circle cx="250" cy="148" r="5"/>
    <circle cx="210" cy="124" r="5"/>
    <circle cx="210" cy="76" r="5"/>
  </g>
</svg>
