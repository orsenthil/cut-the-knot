<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Two falling capital lines and one rising mix">
  <rect width="320" height="200" fill="none"/>
  <!-- axes -->
  <path d="M48 20 V180 H300" fill="none" stroke="#6b7280" stroke-width="2"/>
  <path d="M48 100 H300" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- losing A -->
  <path d="M48 100 C120 108, 180 130, 290 168" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <!-- losing B -->
  <path d="M48 100 C110 112, 170 140, 290 175" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <!-- winning mix -->
  <path d="M48 100 C100 92, 160 70, 290 36" fill="none" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="290" cy="36" r="5" fill="#16a34a" stroke="#111827" stroke-width="1"/>
  <text x="58" y="28" fill="#4b5563" font-family="system-ui,sans-serif" font-size="14" font-weight="700">A+B wins</text>
</svg>
