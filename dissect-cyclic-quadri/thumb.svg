<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Four corners on one circle, a free point P, and four cuts that make
       cyclic quadrilaterals. Mid-tones read on both white and near-black. -->
  <circle cx="160" cy="100" r="72" fill="none" stroke="#7d86c9" stroke-width="2" stroke-dasharray="5 5"/>
  <g stroke="#4bbfa0" stroke-width="2" fill="#4bbfa0" fill-opacity="0.14">
    <polygon points="190,152 160,172 133,153 165,114"/>
    <polygon points="155,58 92,125 133,153 165,114"/>
    <polygon points="155,58 182,32 204,80 165,114"/>
    <polygon points="204,80 226,127 190,152 165,114"/>
  </g>
  <polygon points="226,127 160,172 92,125 182,32" fill="none" stroke="#8f86ff" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#c08a5a" stroke-width="2" stroke-dasharray="5 4">
    <line x1="165" y1="114" x2="190" y2="152"/>
    <line x1="165" y1="114" x2="133" y2="153"/>
    <line x1="165" y1="114" x2="155" y2="58"/>
    <line x1="165" y1="114" x2="204" y2="80"/>
  </g>
  <g fill="#c084fc" stroke="#20242c" stroke-width="1.5">
    <circle cx="226" cy="127" r="4"/>
    <circle cx="160" cy="172" r="4"/>
    <circle cx="92" cy="125" r="4"/>
    <circle cx="182" cy="32" r="4"/>
  </g>
  <g fill="#8f86ff" stroke="#20242c" stroke-width="1.5">
    <circle cx="190" cy="152" r="3.5"/>
    <circle cx="133" cy="153" r="3.5"/>
    <circle cx="155" cy="58" r="3.5"/>
    <circle cx="204" cy="80" r="3.5"/>
  </g>
  <circle cx="165" cy="114" r="5" fill="#4bbfa0" stroke="#20242c" stroke-width="1.5"/>
</svg>
