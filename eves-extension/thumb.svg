<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A six-sided polygon drawn around one circle, with tangency points and a
       red start dot: the moment when the second loop repeats the first. -->
  <circle cx="160" cy="100" r="52" fill="none" stroke="#8f86ff" stroke-width="3"/>
  <path d="M108 48 L212 48 L245 100 L212 152 L108 152 L75 100 Z"
        fill="none" stroke="#e8c15a" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#8f86ff" stroke="#f7f7f7" stroke-width="2">
    <circle cx="160" cy="48" r="6"/>
    <circle cx="231" cy="74" r="6"/>
    <circle cx="231" cy="126" r="6"/>
    <circle cx="160" cy="152" r="6"/>
    <circle cx="89" cy="126" r="6"/>
    <circle cx="89" cy="74" r="6"/>
  </g>
  <g fill="#e8c15a">
    <circle cx="108" cy="48" r="5"/>
    <circle cx="212" cy="48" r="5"/>
    <circle cx="245" cy="100" r="5"/>
    <circle cx="212" cy="152" r="5"/>
    <circle cx="108" cy="152" r="5"/>
    <circle cx="75" cy="100" r="5"/>
  </g>
  <g fill="#ff8a7a" stroke="#f7f7f7" stroke-width="2">
    <circle cx="160" cy="74" r="7"/>
    <circle cx="212" cy="74" r="5"/>
    <circle cx="212" cy="126" r="5"/>
    <circle cx="160" cy="126" r="5"/>
    <circle cx="108" cy="126" r="5"/>
    <circle cx="108" cy="74" r="5"/>
  </g>
</svg>
