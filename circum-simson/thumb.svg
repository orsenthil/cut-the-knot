<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A triangle on a circle, P and its opposite point Q, the two perpendicular
       Simson lines through the feet, and the nine-point circle of their crossing
       point. Mid-tones read on white and near-black. -->
  <circle cx="160" cy="100" r="62" fill="none" stroke="#7d8492" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="169" cy="86" r="31" fill="none" stroke="#3fae8f" stroke-width="1.6" stroke-dasharray="4 4"/>
  <polygon points="158,38 120,147 221,88" fill="none" stroke="#5f6572" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="237" y1="100" x2="128" y2="123" stroke="#3fae8f" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="163" y1="122" x2="142" y2="25" stroke="#8f86ff" stroke-width="3" stroke-linecap="round"/>
  <g fill="#8f86ff" stroke="#ffffff" stroke-width="1.5">
    <circle cx="178" cy="113" r="4"/>
    <circle cx="237" cy="100" r="4"/>
    <circle cx="128" cy="123" r="4"/>
    <circle cx="163" cy="122" r="4"/>
  </g>
  <circle cx="161" cy="116" r="5.5" fill="#3fae8f" stroke="#ffffff" stroke-width="1.5"/>
  <g fill="#8f86ff" stroke="#ffffff" stroke-width="2">
    <circle cx="158" cy="38" r="6"/>
    <circle cx="120" cy="147" r="6"/>
    <circle cx="221" cy="88" r="6"/>
    <circle cx="199" cy="149" r="7"/>
    <circle cx="122" cy="51" r="6" fill-opacity="0.75"/>
  </g>
</svg>
