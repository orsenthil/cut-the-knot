<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A triangle laid over rings, and rings laid over triangles: the two
       crossing patterns of the illusion. Transparent, mid-tone strokes. -->
  <g fill="none" stroke="#8f9ab5" stroke-width="3">
    <circle cx="88" cy="100" r="66"/>
    <circle cx="88" cy="100" r="49"/>
    <circle cx="88" cy="100" r="32"/>
    <circle cx="88" cy="100" r="15"/>
  </g>
  <polygon points="88,34 145,133 31,133" fill="none" stroke="#c58a68" stroke-width="4" stroke-linejoin="round"/>

  <g fill="none" stroke="#8f9ab5" stroke-width="2.5">
    <polygon points="232,32 291,134 173,134"/>
    <polygon points="232,50 277,125 187,125"/>
    <polygon points="232,68 263,116 201,116"/>
    <polygon points="232,86 249,107 215,107"/>
  </g>
  <g fill="none" stroke="#c58a68" stroke-width="3">
    <circle cx="232" cy="100" r="60"/>
    <circle cx="232" cy="100" r="40"/>
    <circle cx="232" cy="100" r="20"/>
  </g>
</svg>
