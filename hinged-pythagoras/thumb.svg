<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The hinged dissection at 90 degrees: one tilted square on the left,
       two leg-squares on the right, with the same four triangles in both. -->
  <g stroke="#6b7280" stroke-width="2" stroke-linejoin="round">
    <rect x="18" y="38" width="120" height="120" fill="none"/>
    <rect x="182" y="38" width="120" height="120" fill="none"/>

    <polygon points="18,158 68,158 18,88" fill="#f0a45e"/>
    <polygon points="18,88 18,38 88,38" fill="#f0a45e"/>
    <polygon points="88,38 138,38 138,108" fill="#f0a45e"/>
    <polygon points="138,108 138,158 68,158" fill="#f0a45e"/>
    <polygon points="18,88 88,38 138,108 68,158" fill="#4caf9b"/>

    <polygon points="232,158 182,158 182,88" fill="#f0a45e"/>
    <polygon points="182,88 182,38 252,38" fill="#f0a45e"/>
    <polygon points="252,38 252,88 182,88" fill="#7c86ff"/>
    <polygon points="232,158 232,88 182,88" fill="#7c86ff"/>
    <rect x="252" y="38" width="50" height="50" fill="#4caf9b"/>
    <rect x="232" y="88" width="70" height="70" fill="#4caf9b"/>
  </g>
  <g fill="#6b7280">
    <circle cx="68" cy="158" r="5"/>
    <circle cx="232" cy="158" r="5"/>
    <circle cx="182" cy="88" r="5"/>
  </g>
</svg>
