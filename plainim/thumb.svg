<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Plainim board with chips">
  <rect width="320" height="200" fill="transparent"/>
  <g transform="translate(50,30)">
    <!-- 5x4 board -->
    <rect x="0" y="0" width="220" height="140" rx="6" fill="#d8dde6" stroke="#5a6578" stroke-width="2"/>
    <!-- grid -->
    <path d="M44 0V140M88 0V140M132 0V140M176 0V140M0 35H220M0 70H220M0 105H220"
          stroke="#5a6578" stroke-width="1.2" opacity="0.55"/>
    <!-- chips: binary-looking rows -->
    <circle cx="22" cy="17.5" r="11" fill="#c9a04a" stroke="#6a5220" stroke-width="1.5"/>
    <circle cx="110" cy="17.5" r="11" fill="#c9a04a" stroke="#6a5220" stroke-width="1.5"/>
    <circle cx="198" cy="17.5" r="11" fill="#c9a04a" stroke="#6a5220" stroke-width="1.5"/>

    <circle cx="66" cy="52.5" r="11" fill="#c9a04a" stroke="#6a5220" stroke-width="1.5"/>
    <circle cx="154" cy="52.5" r="11" fill="#c9a04a" stroke="#6a5220" stroke-width="1.5"/>

    <circle cx="22" cy="87.5" r="11" fill="#c9a04a" stroke="#6a5220" stroke-width="1.5"/>
    <circle cx="66" cy="87.5" r="11" fill="#c9a04a" stroke="#6a5220" stroke-width="1.5"/>
    <circle cx="110" cy="87.5" r="11" fill="#c9a04a" stroke="#6a5220" stroke-width="1.5"/>

    <circle cx="154" cy="122.5" r="11" fill="#c9a04a" stroke="#6a5220" stroke-width="1.5"/>
    <circle cx="198" cy="122.5" r="11" fill="#c9a04a" stroke="#6a5220" stroke-width="1.5"/>
    <!-- accent selection ring -->
    <circle cx="110" cy="17.5" r="14" fill="none" stroke="#3d7ea6" stroke-width="3"/>
  </g>
</svg>
