<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A triangle cut into six pieces, and the s by r rectangle they make. -->
  <g stroke="#34405a" stroke-width="2" stroke-linejoin="round">
    <polygon points="122,52 143,30 110,30" fill="#7b6ce0"/>
    <polygon points="122,52 110,30 86,52" fill="#7b6ce0" opacity="0.75"/>
    <polygon points="122,52 86,52 70,95" fill="#2f9e70"/>
    <polygon points="122,52 70,95 122,95" fill="#2f9e70" opacity="0.75"/>
    <polygon points="122,52 122,95 250,95" fill="#d9a02b"/>
    <polygon points="122,52 250,95 143,30" fill="#d9a02b" opacity="0.75"/>
    <polygon points="70,95 250,95 110,30" fill="none"/>
  </g>
  <circle cx="122" cy="52" r="19" fill="none" stroke="#2f9e70" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="122" cy="52" r="3.5" fill="#34405a"/>
  <g stroke="#34405a" stroke-width="2">
