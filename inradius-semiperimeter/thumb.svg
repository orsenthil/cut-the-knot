    <rect x="111" y="131" width="78" height="38" fill="#d9a02b"/>
    <rect x="191" y="131" width="68" height="38" fill="#7b6ce0"/>
  </g>
  <path d="M60 178 H260" fill="none" stroke="#7b6ce0" stroke-width="3" stroke-linecap="round"/>
