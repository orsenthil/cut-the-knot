<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Four circles in a ring, their contact points and the circle through them. -->
  <circle cx="100" cy="70" r="35" fill="none" stroke="#7284d8" stroke-width="3"/>
  <circle cx="170" cy="70" r="35" fill="none" stroke="#d4875e" stroke-width="3"/>
  <circle cx="170" cy="140" r="35" fill="none" stroke="#6baa85" stroke-width="3"/>
  <circle cx="100" cy="140" r="35" fill="none" stroke="#b87bc6" stroke-width="3"/>
  <circle cx="135" cy="105" r="35" fill="none" stroke="#9ca3b0" stroke-width="2.5" stroke-dasharray="6 5"/>
  <g fill="#e2b53c" stroke="#3d414c" stroke-width="1.5">
    <circle cx="135" cy="70" r="5"/>
    <circle cx="170" cy="105" r="5"/>
    <circle cx="135" cy="140" r="5"/>
    <circle cx="100" cy="105" r="5"/>
  </g>
</svg>
