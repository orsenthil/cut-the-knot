<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <title>A triangle whose incircle touches the sides, with the three collinear lines highlighted</title>
  <!-- The triangle and its incircle. -->
  <path d="M250 30 L50 166 L150 174 Z" fill="none" stroke="#7d8bd4" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="130" cy="146" r="25" fill="#46b39c" fill-opacity="0.10" stroke="#46b39c" stroke-width="2"/>
  <!-- The midline through the two side midpoints. -->
  <path d="M112 118 L206 102" fill="none" stroke="#e0a24a" stroke-width="3" stroke-dasharray="8 5" stroke-linecap="round"/>
  <!-- The two contact-point lines through the perpendicular feet. -->
  <path d="M123 168 L157 155 L268 110" fill="none" stroke="#d96b7a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M111 128 L95 86 L123 168" fill="none" stroke="#d96b7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Marked points: corners, touch points, midpoints, feet. -->
  <g fill="#7d8bd4">
    <circle cx="250" cy="30" r="6"/><circle cx="50" cy="166" r="6"/><circle cx="150" cy="174" r="6"/>
  </g>
  <g fill="#46b39c">
    <circle cx="123" cy="168" r="5"/><circle cx="157" cy="155" r="5"/><circle cx="111" cy="128" r="5"/>
  </g>
  <g fill="#e0a24a">
    <circle cx="200" cy="102" r="5"/><circle cx="150" cy="98" r="5"/>
  </g>
  <g fill="#d96b7a">
    <circle cx="268" cy="110" r="5"/><circle cx="95" cy="86" r="5"/>
  </g>
</svg>
