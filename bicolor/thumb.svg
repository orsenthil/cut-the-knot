<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <title>Sixteen numbered squares connected by a bitwise operation</title>
  <!-- Four-bit grid: a coloured tile is being dragged onto a second tile. -->
  <g fill="none" stroke="#64748b" stroke-width="2">
    <rect x="34" y="42" width="26" height="26" rx="4"/>
    <rect x="64" y="42" width="26" height="26" rx="4"/>
    <rect x="94" y="42" width="26" height="26" rx="4"/>
    <rect x="124" y="42" width="26" height="26" rx="4"/>
    <rect x="34" y="72" width="26" height="26" rx="4"/>
    <rect x="64" y="72" width="26" height="26" rx="4"/>
    <rect x="94" y="72" width="26" height="26" rx="4"/>
    <rect x="124" y="72" width="26" height="26" rx="4"/>
    <rect x="34" y="102" width="26" height="26" rx="4"/>
    <rect x="64" y="102" width="26" height="26" rx="4"/>
    <rect x="94" y="102" width="26" height="26" rx="4"/>
    <rect x="124" y="102" width="26" height="26" rx="4"/>
    <rect x="34" y="132" width="26" height="26" rx="4"/>
    <rect x="64" y="132" width="26" height="26" rx="4"/>
    <rect x="94" y="132" width="26" height="26" rx="4"/>
    <rect x="124" y="132" width="26" height="26" rx="4"/>
  </g>
  <g font-family="sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">
    <rect x="64" y="42" width="26" height="26" rx="4" fill="#4f46e5"/>
    <text x="77" y="61">1</text>
    <rect x="124" y="42" width="26" height="26" rx="4" fill="#0e7490"/>
    <text x="137" y="61">3</text>
    <rect x="94" y="102" width="26" height="26" rx="4" fill="#b45309"/>
    <text x="107" y="121">2</text>
    <rect x="34" y="132" width="26" height="26" rx="4" fill="#15803d"/>
    <text x="47" y="151">4</text>
  </g>
  <!-- the floating tile and the arrow from source to target -->
  <rect x="182" y="66" width="30" height="30" rx="5" fill="#7c3aed" opacity="0.85"/>
  <text x="197" y="87" font-family="sans-serif" font-size="17" font-weight="700" fill="#f8fafc" text-anchor="middle">5</text>
  <path d="M 215 81 L 163 81" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <path d="M 172 74 L 162 81 L 172 88" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="232" y="88" font-family="monospace" font-size="22" font-weight="700" fill="#475569">^</text>
</svg>
