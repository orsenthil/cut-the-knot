<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A closed triangle whose side midpoints are the three dots; the red
       rings sit on the starting vertex, which the chain returns to. -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="70,60 150,180 250,60" stroke="#6f7bf7" stroke-width="5" opacity="0.75"/>
    <path d="M 70 60 L 110 120 L 150 180 L 200 120 L 250 60 L 160 60 Z"
          stroke="#9aa3f9" stroke-width="2.5" stroke-dasharray="7 5" opacity="0.9"/>
    <circle cx="70" cy="60" r="13" stroke="#d97757" stroke-width="2"/>
    <circle cx="70" cy="60" r="8" stroke="#d97757" stroke-width="2"/>
    <circle cx="70" cy="60" r="3.5" stroke="#d97757" stroke-width="2"/>
  </g>
  <g fill="#38a3a5">
    <circle cx="110" cy="120" r="6"/>
    <circle cx="200" cy="120" r="6"/>
    <circle cx="160" cy="60" r="6"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#59a14f" stroke="#e8f0e8" stroke-width="2"/>
</svg>
