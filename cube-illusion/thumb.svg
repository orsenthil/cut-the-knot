<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <title>A tiled cube corner with a smaller cube at its centre</title>
  <g fill="none" stroke="#7d8da3" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Three gridded planes meeting at the middle corner. -->
    <path d="M160 18 68 74 68 142 160 182 252 142 252 74Z"/>
    <path d="M160 18 160 110 M68 74 160 110 M252 74 160 110 M68 142 160 182 M252 142 160 182"/>
    <path d="M139 31 68 78 M118 45 68 93 M97 59 68 107 M181 31 252 78 M202 45 252 93 M223 59 252 107"/>
    <path d="M68 96 160 137 M68 118 160 159 M252 96 160 137 M252 118 160 159"/>
    <path d="M94 158 160 121 M126 176 160 153 M226 158 160 121 M194 176 160 153"/>
  </g>
  <!-- The small cube, drawn with the same slant as the walls. -->
  <g stroke="#42536b" stroke-width="2" stroke-linejoin="round">
    <path d="M160 58 130 77 160 96 190 77Z" fill="#b8c5d5"/>
    <path d="M130 77 130 116 160 136 160 96Z" fill="#93a5ba"/>
    <path d="M190 77 190 116 160 136 160 96Z" fill="#6f849e"/>
  </g>
  <g fill="none" stroke="#42536b" stroke-width="1" opacity="0.75">
    <path d="M145 67 175 86 M145 86 175 67 M130 96 160 116 M190 96 160 116 M145 106 145 126 M175 106 175 126"/>
  </g>
</svg>
