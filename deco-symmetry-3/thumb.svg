<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A triangle cut into three kites, and the same kites turned into its
       mirror across the dashed centre line. Transparent background. -->
  <g stroke="#6b7280" stroke-width="2" stroke-linejoin="round" opacity="0.95">
    <polygon points="76,124 32,139 42,48 98,102" fill="#8f86ff" fill-opacity="0.72"/>
    <polygon points="76,124 32,139 24,162 86,162" fill="#4ade80" fill-opacity="0.62"/>
    <polygon points="76,124 86,162 146,162 98,102" fill="#d9a441" fill-opacity="0.62"/>
    <polygon points="244,124 288,139 278,48 222,102" fill="#8f86ff" fill-opacity="0.4"/>
    <polygon points="244,124 288,139 296,162 234,162" fill="#4ade80" fill-opacity="0.38"/>
    <polygon points="244,124 234,162 174,162 222,102" fill="#d9a441" fill-opacity="0.38"/>
  </g>
  <line x1="160" y1="28" x2="160" y2="184" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="76" cy="124" r="4" fill="#8f86ff"/>
  <circle cx="244" cy="124" r="4" fill="#8f86ff"/>
</svg>
