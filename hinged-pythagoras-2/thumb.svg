<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Transparent card art: the cut square and its hinged copy. -->
  <g stroke="#4b5563" stroke-width="2.5" stroke-linejoin="round">
    <rect x="20" y="40" width="100" height="100" fill="none"/>
    <polygon points="20,140 120,140 92,116 83,69" fill="#6b74c9" fill-opacity="0.55"/>
    <polygon points="120,140 120,40 96,55 92,116" fill="#6b74c9" fill-opacity="0.55"/>
    <polygon points="120,40 20,40 45,64 96,55" fill="#6b74c9" fill-opacity="0.55"/>
    <polygon points="20,40 20,140 83,69 45,64" fill="#6b74c9" fill-opacity="0.55"/>
    <polygon points="83,69 92,116 45,64 96,55" fill="none" stroke="#374151"/>

    <rect x="190" y="40" width="100" height="100" fill="none"/>
    <polygon points="190,140 290,140 245,108" fill="#6b74c9" fill-opacity="0.55"/>
    <polygon points="290,140 290,40 268,72" fill="#6b74c9" fill-opacity="0.55"/>
    <polygon points="290,40 290,140 320,105" fill="#d4a24c" fill-opacity="0.75"/>
    <polygon points="190,140 190,40 160,105" fill="#d4a24c" fill-opacity="0.75"/>
    <line x1="190" y1="140" x2="160" y2="105" stroke="#374151" stroke-dasharray="5 5"/>
    <line x1="290" y1="40" x2="320" y2="105" stroke="#374151" stroke-dasharray="5 5"/>
    <circle cx="190" cy="140" r="5" fill="#b47b32"/>
    <circle cx="290" cy="40" r="5" fill="#b47b32"/>
  </g>
</svg>
