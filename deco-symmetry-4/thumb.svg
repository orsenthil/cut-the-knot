<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The key moment: A' lies on the base, two cuts split the triangle into
       three coloured pieces, and the outer pieces turn into the mirror. -->
  <g stroke="#6f7783" stroke-width="2.5" stroke-linejoin="round">
    <polygon points="135,140 80,140 107.5,92.5" fill="#d43f3f" fill-opacity="0.8"/>
    <polygon points="135,140 107.5,92.5 135,45 187.5,92.5" fill="#d9a406" fill-opacity="0.75"/>
    <polygon points="135,140 187.5,92.5 240,140" fill="#3f78d4" fill-opacity="0.8"/>
    <polygon points="135,45 80,140 240,140" fill="none" stroke="#8c939d" stroke-width="3"/>
    <polygon points="135,140 80,45 240,45" fill="none" stroke="#4a89d8" stroke-width="3" stroke-dasharray="7 6"/>
    <line x1="135" y1="140" x2="107.5" y2="92.5" stroke="#a83232" stroke-width="3"/>
    <line x1="135" y1="140" x2="187.5" y2="92.5" stroke="#a83232" stroke-width="3"/>
  </g>
  <g fill="#6f7783">
    <circle cx="135" cy="45" r="4"/>
    <circle cx="80" cy="140" r="4"/>
    <circle cx="240" cy="140" r="4"/>
    <circle cx="135" cy="140" r="4"/>
  </g>
</svg>
