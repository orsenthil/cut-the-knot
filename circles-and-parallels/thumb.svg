<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <!-- A triangle with P on AB, the parallels PN and PM, and the two circles
       through P meeting again at Q. The chord PQ runs through the fixed X. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M55 130 L230 130 L135 90 Z" fill="#6d7f96" fill-opacity="0.16" stroke="#8799ad" stroke-width="2"/>
    <path d="M135 130 L91.6 107.1 M135 130 L178.4 102.9" stroke="#8aa0b8" stroke-width="1.8" stroke-dasharray="5 4"/>
    <circle cx="95" cy="164.3" r="52.7" stroke="#5b9bd5" stroke-width="2.6"/>
    <circle cx="182.5" cy="170.7" r="62.6" stroke="#5bb79a" stroke-width="2.6"/>
    <path d="M142.5 24 L124 200" stroke="#e08a5b" stroke-width="2.6"/>
  </g>
  <g fill="#c8d6e5">
    <circle cx="55" cy="130" r="4.2"/>
    <circle cx="230" cy="130" r="4.2"/>
    <circle cx="135" cy="90" r="4.2"/>
    <circle cx="135" cy="130" r="5"/>
  </g>
  <circle cx="129.6" cy="190" r="5" fill="#a9d8c6"/>
  <circle cx="142.5" cy="28" r="6" fill="#e08a5b"/>
  <g fill="#aebfd2" font-family="system-ui, sans-serif" font-size="12" font-weight="600">
    <text x="43" y="124">A</text>
    <text x="232" y="124">B</text>
    <text x="138" y="85">C</text>
    <text x="139" y="146">P</text>
    <text x="116" y="188">Q</text>
    <text x="151" y="32">X</text>
  </g>
</svg>
