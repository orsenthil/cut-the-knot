<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The four columns of the sliding-letter board, with the two O counters
       picked out and the empty square at the bottom right. -->
  <g font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <g fill="#6f66cf">
      <rect x="94" y="34" width="30" height="30" rx="6"/><text x="109" y="55" fill="#ffffff">M</text>
      <rect x="94" y="68" width="30" height="30" rx="6"/><text x="109" y="89" fill="#ffffff">A</text>
      <rect x="94" y="102" width="30" height="30" rx="6"/><text x="109" y="123" fill="#ffffff">K</text>
      <rect x="94" y="136" width="30" height="30" rx="6"/><text x="109" y="157" fill="#ffffff">E</text>
      <rect x="128" y="34" width="30" height="30" rx="6"/><text x="143" y="55" fill="#ffffff">Y</text>
      <rect x="128" y="102" width="30" height="30" rx="6"/><text x="143" y="123" fill="#ffffff">U</text>
      <rect x="128" y="136" width="30" height="30" rx="6"/><text x="143" y="157" fill="#ffffff">R</text>
      <rect x="162" y="34" width="30" height="30" rx="6"/><text x="177" y="55" fill="#ffffff">M</text>
      <rect x="162" y="102" width="30" height="30" rx="6"/><text x="177" y="123" fill="#ffffff">V</text>
      <rect x="162" y="136" width="30" height="30" rx="6"/><text x="177" y="157" fill="#ffffff">E</text>
      <rect x="196" y="34" width="30" height="30" rx="6"/><text x="211" y="55" fill="#ffffff">K</text>
      <rect x="196" y="68" width="30" height="30" rx="6"/><text x="211" y="89" fill="#ffffff">I</text>
      <rect x="196" y="102" width="30" height="30" rx="6"/><text x="211" y="123" fill="#ffffff">D</text>
    </g>
    <g fill="#cf9146">
      <rect x="128" y="68" width="30" height="30" rx="6"/><text x="143" y="89" fill="#1b1c22">O</text>
      <rect x="162" y="68" width="30" height="30" rx="6"/><text x="177" y="89" fill="#1b1c22">O</text>
    </g>
    <rect x="196" y="136" width="30" height="30" rx="6" fill="none" stroke="#8f979f" stroke-width="3" stroke-dasharray="6 5"/>
