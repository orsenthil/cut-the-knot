    <path d="M70 115 L124 181 M250 115 L196 49" stroke="#8f86ff" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M70 115 L250 115" stroke="#b9c0cc" stroke-width="3"/>
    <path d="M88 137 L196 49 M106 159 L214 71 M124 181 L232 93" stroke="#8f86ff" stroke-width="2.2"/>
  </g>
  <g fill="#8f86ff">
    <circle cx="88" cy="137" r="4"/><circle cx="106" cy="159" r="4"/><circle cx="124" cy="181" r="4"/>
    <circle cx="232" cy="93" r="4"/><circle cx="214" cy="71" r="4"/><circle cx="196" cy="49" r="4"/>
  </g>
  <g fill="#4ade80">
    <circle cx="115" cy="115" r="6"/><circle cx="160" cy="115" r="6"/><circle cx="205" cy="115" r="6"/>
  </g>
  <g fill="#b9c0cc">
    <circle cx="92.5" cy="115" r="2.5"/><circle cx="137.5" cy="115" r="2.5"/>
    <circle cx="182.5" cy="115" r="2.5"/><circle cx="227.5" cy="115" r="2.5"/>
  </g>
  <g fill="none" stroke="#d9dee7" stroke-width="3">
    <circle cx="70" cy="115" r="6"/><circle cx="250" cy="115" r="6"/>
  </g>
</svg>
