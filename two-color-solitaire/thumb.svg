<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Eight numbered cards in alternating red and blue round a circle, with a pink dot between two odd neighbours">
  <!-- Transparent background. Eight cards of a 16-card deal, every other gap highlighted as a legal one. -->
  <circle cx="160" cy="100" r="62" fill="none" stroke="#7b8496" stroke-width="1.5" opacity="0.7"/>

  <!-- A pink dot at every gap; the one between the odd cards 1 and 5 is picked out. -->
  <circle cx="183.73" cy="42.72" r="7.5" fill="none" stroke="#e886ae" stroke-width="2"/>
  <circle cx="183.73" cy="42.72" r="4" fill="#e886ae"/>
  <circle cx="217.28" cy="123.73" r="2.6" fill="#e886ae" opacity="0.75"/>
  <circle cx="136.27" cy="157.28" r="2.6" fill="#e886ae" opacity="0.75"/>
  <circle cx="102.72" cy="76.27" r="2.6" fill="#e886ae" opacity="0.75"/>

  <!-- The cards, dealt alternately red and blue. -->
  <g stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.85">
    <circle cx="160" cy="38" r="16" fill="#cf4a4a"/>
    <circle cx="203.84" cy="56.16" r="16" fill="#3f6fd1"/>
    <circle cx="222" cy="100" r="16" fill="#cf4a4a"/>
    <circle cx="203.84" cy="143.84" r="16" fill="#3f6fd1"/>
    <circle cx="160" cy="162" r="16" fill="#cf4a4a"/>
    <circle cx="116.16" cy="143.84" r="16" fill="#3f6fd1"/>
    <circle cx="98" cy="100" r="16" fill="#cf4a4a"/>
    <circle cx="116.16" cy="56.16" r="16" fill="#3f6fd1"/>
  </g>
  <g fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="650" text-anchor="middle" font-size="15">
    <text x="160" y="43">1</text>
    <text x="203.84" y="61.16">5</text>
    <text x="222" y="105">2</text>
    <text x="203.84" y="148.84">6</text>
    <text x="160" y="167">3</text>
    <text x="116.16" y="148.84">7</text>
    <text x="98" y="105">4</text>
    <text x="116.16" y="61.16">8</text>
  </g>
</svg>
