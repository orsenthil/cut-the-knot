    <text x="182" y="45">9</text><text x="224" y="45">13</text>
    <text x="98" y="87">2</text><text x="140" y="87">6</text>
    <text x="182" y="87">10</text><text x="224" y="87">14</text>
    <text x="98" y="129">3</text><text x="140" y="129">7</text>
    <text x="182" y="129">11</text>
    <text x="98" y="171">4</text><text x="140" y="171">8</text>
    <text x="182" y="171">12</text>
  </g>
  <rect x="206" y="104" width="36" height="36" rx="5" fill="none" stroke="#9aa1ad" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="206" y="146" width="36" height="36" rx="5" fill="#5b9b78"/>
  <path d="M224 151 L224 176 M217 169 L224 177 L231 169" fill="none" stroke="#f3f5f8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
