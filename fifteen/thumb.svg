<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Four-by-four sliding board, with the last counter moving into the gap. -->
  <g fill="#8f86ff" opacity="0.9">
    <rect x="80" y="20" width="36" height="36" rx="5"/>
    <rect x="122" y="20" width="36" height="36" rx="5"/>
    <rect x="164" y="20" width="36" height="36" rx="5"/>
    <rect x="206" y="20" width="36" height="36" rx="5"/>
    <rect x="80" y="62" width="36" height="36" rx="5"/>
    <rect x="122" y="62" width="36" height="36" rx="5"/>
    <rect x="164" y="62" width="36" height="36" rx="5"/>
    <rect x="206" y="62" width="36" height="36" rx="5"/>
    <rect x="80" y="104" width="36" height="36" rx="5"/>
    <rect x="122" y="104" width="36" height="36" rx="5"/>
    <rect x="164" y="104" width="36" height="36" rx="5"/>
    <rect x="80" y="146" width="36" height="36" rx="5"/>
    <rect x="122" y="146" width="36" height="36" rx="5"/>
    <rect x="164" y="146" width="36" height="36" rx="5"/>
  </g>
  <g fill="#f3f5f8" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">
