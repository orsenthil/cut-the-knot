<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- An ellipse inside the triangle made by its three tangents, with the
       cevians meeting at the Gergonne point. -->
  <rect x="80" y="75" width="160" height="50" fill="none" stroke="#8f86ff"
        stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 4"/>
  <ellipse cx="160" cy="100" rx="80" ry="25" fill="#8f86ff" fill-opacity="0.12"
           stroke="#8f86ff" stroke-width="2.5"/>
  <g fill="none" stroke="#8f86ff" stroke-width="1.4" stroke-opacity="0.6" stroke-dasharray="5 4">
    <line x1="103" y1="82" x2="278" y2="28"/>
    <line x1="239" y1="104" x2="30" y2="105"/>
    <line x1="120" y1="122" x2="221" y2="140"/>
  </g>
  <g fill="none" stroke="#8f86ff" stroke-width="2.8" stroke-linecap="round">
    <line x1="30" y1="105" x2="221" y2="140"/>
    <line x1="221" y1="140" x2="278" y2="28"/>
    <line x1="278" y1="28" x2="30" y2="105"/>
  </g>
  <g fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round">
    <line x1="30" y1="105" x2="239" y2="104"/>
    <line x1="221" y1="140" x2="103" y2="82"/>
    <line x1="278" y1="28" x2="120" y2="122"/>
  </g>
  <g fill="#8f86ff">
    <circle cx="30" cy="105" r="4"/>
    <circle cx="221" cy="140" r="4"/>
    <circle cx="278" cy="28" r="4"/>
    <circle cx="239" cy="104" r="4.5"/>
    <circle cx="103" cy="82" r="4.5"/>
    <circle cx="120" cy="122" r="4.5"/>
  </g>
  <circle cx="149" cy="105" r="6" fill="#4ade80" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5"/>
</svg>
