<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The key moment: two circles meet at D and E, and their chord cuts off
       the first of three equal parts of AB. -->
  <g fill="none" stroke="#8f86ff" stroke-width="2">
    <circle cx="60" cy="105" r="55"/>
    <circle cx="142.5" cy="105" r="82.5"/>
  </g>
  <path d="M60 105 L115 105" fill="none" stroke="#b9c0cc" stroke-width="4" stroke-linecap="round"/>
  <path d="M78.3 53 L78.3 157" fill="none" stroke="#8f86ff" stroke-width="2.5"/>
  <g fill="#b9c0cc">
    <circle cx="60" cy="105" r="2.8"/><circle cx="115" cy="105" r="2.8"/>
  </g>
  <g fill="#4ade80">
    <circle cx="78.3" cy="105" r="5.5"/>
    <circle cx="96.7" cy="105" r="3.5"/>
    <circle cx="115" cy="105" r="3.5"/>
  </g>
  <g fill="#8f86ff">
    <circle cx="78.3" cy="53" r="4.5"/>
    <circle cx="78.3" cy="157" r="4.5"/>
  </g>
  <g fill="none" stroke="#8f86ff" stroke-width="3">
    <circle cx="60" cy="105" r="6"/>
    <circle cx="115" cy="105" r="6"/>
  </g>
</svg>
