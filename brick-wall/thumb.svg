      <rect x="2" y="53" width="44" height="27"/><rect x="90" y="53" width="44" height="27"/><rect x="178" y="53" width="44" height="27"/><rect x="266" y="53" width="44" height="27"/>
      <rect x="24" y="80" width="44" height="27"/><rect x="112" y="80" width="44" height="27"/><rect x="200" y="80" width="44" height="27"/>
      <rect x="2" y="107" width="44" height="27"/><rect x="90" y="107" width="44" height="27"/><rect x="178" y="107" width="44" height="27"/><rect x="266" y="107" width="44" height="27"/>
      <rect x="24" y="134" width="44" height="27"/><rect x="112" y="134" width="44" height="27"/><rect x="200" y="134" width="44" height="27"/>
    </g>
    <g fill="#c2c8d2">
