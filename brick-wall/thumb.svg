      <rect x="46" y="53" width="44" height="27"/><rect x="134" y="53" width="44" height="27"/><rect x="222" y="53" width="44" height="27"/>
      <rect x="68" y="80" width="44" height="27"/><rect x="156" y="80" width="44" height="27"/><rect x="244" y="80" width="44" height="27"/>
      <rect x="46" y="107" width="44" height="27"/><rect x="134" y="107" width="44" height="27"/><rect x="222" y="107" width="44" height="27"/>
      <rect x="68" y="134" width="44" height="27"/><rect x="156" y="134" width="44" height="27"/><rect x="244" y="134" width="44" height="27"/>
