<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Three parallel lines carrying C, C1 and C2, with the two differently
       oriented equilateral triangles the 60-degree construction gives. -->
  <g stroke="#6f9bd0" stroke-width="2" opacity="0.85">
    <path d="M18 56 H302"/>
    <path d="M18 121 H302"/>
    <path d="M18 174 H302"/>
  </g>
  <path d="M200 56 L299 121 L193 174 Z" fill="none" stroke="#e08a70" stroke-width="2" opacity="0.6" stroke-dasharray="5 4"/>
  <path d="M200 56 L101 121 L207 174 Z" fill="none" stroke="#54b89a" stroke-width="3"/>
  <g fill="#7f8de0" stroke="#20242c" stroke-width="1.5">
    <circle cx="200" cy="56" r="6"/>
    <circle cx="101" cy="121" r="6"/>
    <circle cx="207" cy="174" r="6"/>
  </g>
  <g fill="#e08a70" stroke="#20242c" stroke-width="1.5" opacity="0.8">
    <circle cx="299" cy="121" r="4.5"/>
    <circle cx="193" cy="174" r="4.5"/>
  </g>
</svg>
