<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The broken chord theorem: P on the arc through C, PM down to the long
       side AC, and M splitting the path A-C-B. Mid tones read on light/dark. -->
  <circle cx="160" cy="100" r="68" fill="none" stroke="#8d95a5" stroke-width="2"/>
  <line x1="92" y1="100" x2="227" y2="87" stroke="#8d95a5" stroke-width="2"/>
  <path d="M 92 100 L 168 63 L 202 47 L 227 87" fill="none" stroke="#2f9e6e"
        stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 92 100 L 168 63" fill="none" stroke="#4f7cff" stroke-width="4"
        stroke-linecap="round"/>
  <line x1="153" y1="32" x2="168" y2="63" stroke="#8f86ff" stroke-width="2.5"
        stroke-dasharray="5 4"/>
  <circle cx="92" cy="100" r="5" fill="#b7bdc7"/>
  <circle cx="227" cy="87" r="5" fill="#b7bdc7"/>
  <circle cx="202" cy="47" r="5" fill="#b7bdc7"/>
  <circle cx="153" cy="32" r="6" fill="#8f86ff"/>
  <circle cx="168" cy="63" r="6" fill="#d19a00"/>
  <g fill="#c7ccd6" font-family="sans-serif" font-size="18" font-weight="600">
    <text x="74" y="106">A</text>
    <text x="233" y="88">B</text>
    <text x="207" y="43">C</text>
    <text x="132" y="27">P</text>
    <text x="175" y="62">M</text>
  </g>
</svg>
