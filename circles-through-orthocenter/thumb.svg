<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The theorem's key moment: three circles through H cut the sides in six
       points, and those points lie on one dashed circle about the circumcenter. -->
  <g fill="none" stroke-width="2">
    <circle cx="160" cy="130" r="81" stroke="#8f86ff" stroke-dasharray="7 5"/>
    <circle cx="205" cy="90" r="55" stroke="#5b9bd5"/>
    <circle cx="115" cy="90" r="55" stroke="#4aa39a"/>
    <circle cx="160" cy="140" r="81" stroke="#d98c4a"/>
  </g>
  <polygon points="70,140 250,140 160,40" fill="#8f86ff" fill-opacity="0.10" stroke="#7c8494" stroke-width="2"/>
  <g fill="#8f86ff">
    <circle cx="168.5" cy="49.4" r="4.5"/><circle cx="241.5" cy="130.6" r="4.5"/>
  </g>
  <g fill="#4aa39a">
    <circle cx="78.5" cy="130.6" r="4.5"/><circle cx="151.5" cy="49.4" r="4.5"/>
  </g>
  <g fill="#d98c4a">
    <circle cx="79" cy="140" r="4.5"/><circle cx="241" cy="140" r="4.5"/>
  </g>
  <circle cx="160" cy="59" r="6" fill="#5d6472"/>
  <circle cx="160" cy="130" r="5" fill="#8f86ff" stroke="#f0f0f0" stroke-width="1.5"/>
</svg>
