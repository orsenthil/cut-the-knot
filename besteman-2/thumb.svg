<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Two circles meet at D; the bisector DP cuts AC into three equal parts. -->
  <g fill="none" stroke="#6b8cbe" stroke-width="2" stroke-dasharray="6 5">
    <circle cx="55" cy="145" r="60"/>
    <circle cx="175" cy="145" r="120"/>
  </g>
  <line x1="55" y1="145" x2="175" y2="145" stroke="#8a94a6" stroke-width="3" stroke-linecap="round"/>
  <g fill="none" stroke="#8f86ff" stroke-width="2.5" stroke-linejoin="round">
    <path d="M55 145 L70 87 L175 145"/>
    <path d="M70 87 L95 145" stroke-dasharray="6 4"/>
  </g>
  <g fill="#4ade80" stroke="#10131a" stroke-width="1">
    <circle cx="55" cy="145" r="4"/>
    <circle cx="95" cy="145" r="4"/>
    <circle cx="135" cy="145" r="4"/>
  </g>
  <circle cx="70" cy="87" r="5" fill="#8f86ff"/>
  <circle cx="95" cy="145" r="5.5" fill="#8f86ff" stroke="#10131a" stroke-width="1"/>
  <g fill="#a5b0c0" font-family="sans-serif" font-size="13" font-weight="600">
    <text x="40" y="166">A</text>
    <text x="105" y="166">B</text>
    <text x="178" y="166">C</text>
    <text x="52" y="80">D</text>
    <text x="100" y="136">P</text>
  </g>
</svg>
