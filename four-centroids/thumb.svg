<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Triangle ABC, the point P, the three centroids Ga, Gb, Gc (small green
       triangle), their parallel lines through G, and the centre J. Mid-tones
       read on both white and near-black cards. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#8f86ff" stroke-width="1.5" stroke-dasharray="4 4">
      <line x1="238" y1="148" x2="152" y2="121"/>
      <line x1="104" y1="34" x2="152" y2="121"/>
      <line x1="66" y1="148" x2="152" y2="121"/>
    </g>
    <g stroke="#6a7285" stroke-width="1.5" stroke-dasharray="7 6">
      <line x1="170" y1="119" x2="107" y2="101"/>
      <line x1="120" y1="81" x2="152" y2="139"/>
      <line x1="100" y1="119" x2="165" y2="101"/>
    </g>
    <polygon points="238,148 104,34 66,148" stroke="#8f86ff" stroke-width="3"/>
    <polygon points="107,101 152,139 165,101" stroke="#4f9d78" stroke-width="3"/>
  </g>
  <g fill="#8f86ff">
    <circle cx="238" cy="148" r="5"/>
    <circle cx="104" cy="34" r="5"/>
    <circle cx="66" cy="148" r="5"/>
    <circle cx="152" cy="121" r="6"/>
  </g>
  <g fill="#4f9d78">
    <circle cx="107" cy="101" r="4"/>
    <circle cx="152" cy="139" r="4"/>
    <circle cx="165" cy="101" r="4"/>
  </g>
  <circle cx="136" cy="110" r="7" fill="#f0b429" stroke="#ffffff" stroke-width="2"/>
  <circle cx="140" cy="113" r="4" fill="#d87070" stroke="#ffffff" stroke-width="1.5"/>
</svg>
