<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The key moment: P on the circumcircle, M on the long side AC, and the
       auxiliary circle through A, B and F centred at P. Transparent, mid-tone. -->
  <circle cx="160" cy="100" r="64" fill="none" stroke="#8a94a6" stroke-width="2.5"/>
  <circle cx="153" cy="37" r="94" fill="none" stroke="#9a86c8" stroke-width="2"
          stroke-dasharray="6 6" opacity="0.75"/>
  <path d="M 96 100 L 200 50 L 223 87" fill="none" stroke="#5b8fb0"
        stroke-width="3" stroke-linejoin="round"/>
  <path d="M 96 100 L 168 66" fill="none" stroke="#7c9cde" stroke-width="5"/>
  <path d="M 168 66 L 200 50 L 223 87" fill="none" stroke="#64ad84"
        stroke-width="4" stroke-linejoin="round"/>
  <path d="M 153 37 L 168 66" fill="none" stroke="#d0a24a" stroke-width="2.5"
        stroke-dasharray="5 4"/>
  <path d="M 200 50 L 238 32" fill="none" stroke="#64ad84" stroke-width="3"/>
  <g fill="#d7dbe2" stroke="#424a58" stroke-width="1.5">
    <circle cx="96" cy="100" r="5"/>
    <circle cx="200" cy="50" r="5"/>
    <circle cx="223" cy="87" r="5"/>
  </g>
  <g fill="#e8b84b" stroke="#424a58" stroke-width="1.5">
    <circle cx="153" cy="37" r="6"/>
    <circle cx="168" cy="66" r="6"/>
    <circle cx="238" cy="32" r="5"/>
  </g>
</svg>
