<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Equal marks on the ray from B, parallels back to BC, and the cuts at thirds. -->
  <g stroke-linecap="round" fill="none">
    <!-- sloping ray B -> B3 -->
    <path d="M 50 132 L 150 72" stroke="#8f86ff" stroke-width="3"/>
    <!-- segment BC -->
    <path d="M 50 132 L 272 132" stroke="#c9cfda" stroke-width="4"/>
    <!-- B3 joined to C -->
    <path d="M 150 72 L 272 132" stroke="#8f86ff" stroke-width="3"/>
    <!-- the two parallels through B1 and B2 -->
    <path d="M 83 112 L 205 172" stroke="#9aa1ad" stroke-width="2.5"/>
    <path d="M 117 92 L 239 152" stroke="#9aa1ad" stroke-width="2.5"/>
  </g>
  <g fill="#8f86ff">
    <circle cx="83" cy="112" r="4"/>
    <circle cx="117" cy="92" r="4"/>
    <circle cx="150" cy="72" r="4"/>
  </g>
  <g fill="#4ade80">
    <circle cx="124" cy="132" r="5"/>
    <circle cx="198" cy="132" r="5"/>
  </g>
  <g fill="#c9cfda">
    <circle cx="50" cy="132" r="5"/>
    <circle cx="272" cy="132" r="5"/>
  </g>
</svg>
