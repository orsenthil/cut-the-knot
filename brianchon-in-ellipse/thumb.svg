    <circle cx="212" cy="152" r="4.5"/>
    <circle cx="145" cy="159" r="4.5"/>
    <circle cx="86" cy="142" r="4.5"/>
  </g>
  <circle cx="160" cy="103" r="6" fill="#4ade80" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5"/>
