  <g fill="none" stroke="#8f86ff" stroke-width="2" stroke-opacity="0.55" stroke-dasharray="6 4">
    <line x1="60" y1="73" x2="112" y2="43"/>
    <line x1="139" y1="38" x2="211" y2="44"/>
    <line x1="233" y1="52" x2="269" y2="88"/>
    <line x1="244" y1="141" x2="180" y2="163"/>
    <line x1="181" y1="156" x2="109" y2="162"/>
