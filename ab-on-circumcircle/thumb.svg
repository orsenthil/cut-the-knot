<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A triangle on its circumcircle. The angle bisectors hit D, E and F;
       AD (accent, dashed) is perpendicular to EF (green). -->
  <circle cx="160" cy="100" r="70" fill="none" stroke="#9aa1ad" stroke-width="2"/>
  <polygon points="160,30 103,140 217,140" fill="none" stroke="#c9cfda" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="none" stroke="#8f86ff" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round">
    <line x1="160" y1="30" x2="160" y2="170"/>
    <line x1="103" y1="140" x2="222" y2="68"/>
    <line x1="217" y1="140" x2="98" y2="68"/>
  </g>
  <line x1="98" y1="68" x2="222" y2="68" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>
  <path d="M 160 68 L 160 79 L 171 79 L 171 68" fill="none" stroke="#4ade80" stroke-width="2.5"/>
  <g fill="#c9cfda">
    <circle cx="160" cy="30" r="4.5"/>
    <circle cx="103" cy="140" r="4.5"/>
    <circle cx="217" cy="140" r="4.5"/>
  </g>
  <g fill="#4ade80">
    <circle cx="160" cy="170" r="4"/>
    <circle cx="222" cy="68" r="4"/>
    <circle cx="98" cy="68" r="4"/>
  </g>
  <circle cx="160" cy="68" r="4.5" fill="#8f86ff"/>
</svg>
