<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A regular tetrahedron with its three bimedians crossing at the middle. -->
  <g stroke-linejoin="round">
    <!-- translucent faces -->
    <polygon points="100,84 216,54 174,153" fill="#8f86ff" fill-opacity="0.13"/>
    <polygon points="100,84 216,54 144,52" fill="#8f86ff" fill-opacity="0.10"/>
    <polygon points="216,54 174,153 144,52" fill="#8f86ff" fill-opacity="0.16"/>
    <!-- edges: the three meeting at the rear corner are dashed -->
    <g stroke="#9aa1ad" stroke-width="2.5" stroke-dasharray="5 5" fill="none">
      <path d="M100 84 L216 54"/>
      <path d="M100 84 L174 153"/>
      <path d="M100 84 L144 52"/>
    </g>
    <g stroke="#c9cfda" stroke-width="3" fill="none">
      <path d="M216 54 L174 153"/>
      <path d="M216 54 L144 52"/>
      <path d="M174 153 L144 52"/>
    </g>
    <!-- the three bimedians, joining midpoints of opposite edges -->
    <g stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M158 69 L159 102.5" stroke="#8f86ff"/>
      <path d="M137 118.5 L180 53" stroke="#2aa9a0"/>
      <path d="M122 68 L195 103.5" stroke="#e08a3c"/>
    </g>
    <g stroke="#f3f5f8" stroke-width="1.5">
      <circle cx="158" cy="69" r="3.4" fill="#8f86ff"/>
      <circle cx="159" cy="102.5" r="3.4" fill="#8f86ff"/>
      <circle cx="137" cy="118.5" r="3.4" fill="#2aa9a0"/>
      <circle cx="180" cy="53" r="3.4" fill="#2aa9a0"/>
      <circle cx="122" cy="68" r="3.4" fill="#e08a3c"/>
      <circle cx="195" cy="103.5" r="3.4" fill="#e08a3c"/>
    </g>
    <circle cx="158.5" cy="85.75" r="5" fill="#4ade80" stroke="#f3f5f8" stroke-width="2"/>
  </g>
</svg>
