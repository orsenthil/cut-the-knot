<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The key moment: a parallel to AC through B meets AD extended at E;
       M is the midpoint of DE, and CM halves the quadrilateral. -->
  <g fill-opacity="0.22">
    <polygon points="55,100 95,170 265,155 75.45,86.37" fill="#8f86ff"/>
    <polygon points="160,30 265,155 75.45,86.37" fill="#4f9d78"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="55,100 95,170 265,155 160,30" stroke="#7b83c7" stroke-width="4"/>
    <line x1="55" y1="100" x2="265" y2="155" stroke="#5d6472" stroke-width="2.5" stroke-dasharray="7 6"/>
    <line x1="95" y1="170" x2="-9.1" y2="142.7" stroke="#b56a6a" stroke-width="3" stroke-dasharray="6 5"/>
    <line x1="265" y1="155" x2="75.45" y2="86.37" stroke="#d0a24a" stroke-width="5"/>
  </g>
  <g fill="#8f86ff" stroke="#ffffff" stroke-width="1.5">
    <circle cx="55" cy="100" r="5"/>
    <circle cx="95" cy="170" r="5"/>
    <circle cx="265" cy="155" r="5"/>
    <circle cx="160" cy="30" r="5"/>
  </g>
  <circle cx="-9.1" cy="142.7" r="5" fill="#b56a6a"/>
  <circle cx="75.45" cy="86.37" r="7" fill="#d0a24a" stroke="#ffffff" stroke-width="2"/>
</svg>
