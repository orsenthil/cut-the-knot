<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <title>McWorter: two squares on a triangle and the right angle at D</title>
  <!-- A=(60,140), B=(200,140), C=(130,95), D=A+B-C=(130,185).
       The two squares are quarter turns of C about B and A. -->
  <polygon points="200,140 250,25 175,25 130,95" fill="#6c7ced" fill-opacity="0.32" stroke="#6c7ced" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="130,95 85,25 10,25 60,140" fill="#2a9d8f" fill-opacity="0.32" stroke="#2a9d8f" stroke-width="3" stroke-linejoin="round"/>
  <line x1="130" y1="185" x2="250" y2="25" stroke="#e07a5f" stroke-width="3"/>
  <line x1="130" y1="185" x2="10" y2="25" stroke="#e07a5f" stroke-width="3"/>
  <line x1="130" y1="185" x2="60" y2="140" stroke="#e07a5f" stroke-width="3"/>
  <line x1="130" y1="185" x2="200" y2="140" stroke="#e07a5f" stroke-width="3"/>
  <path d="M 60 140 L 200 140 L 130 95 Z" fill="none" stroke="#8a8fa6" stroke-width="2.5" stroke-dasharray="6 5"/>
  <line x1="10" y1="25" x2="250" y2="25" stroke="#6c7ced" stroke-width="2.5" stroke-dasharray="7 6"/>
  <circle cx="60" cy="140" r="6" fill="#8a8fa6"/>
  <circle cx="200" cy="140" r="6" fill="#8a8fa6"/>
  <circle cx="130" cy="95" r="6" fill="#8a8fa6"/>
  <circle cx="130" cy="185" r="7" fill="#e07a5f"/>
  <path d="M 120 172 L 130 160 L 140 172" fill="none" stroke="#e07a5f" stroke-width="3"/>
</svg>
