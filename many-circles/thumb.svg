<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Three circles through one point, with the polygon whose sides run
       through their other crossings. Mid tones read on light and dark cards. -->
  <g fill="none" stroke-width="3" opacity="0.92">
    <circle cx="128" cy="98" r="54" stroke="#8f86ff"/>
    <circle cx="192" cy="98" r="54" stroke="#42b3a5"/>
    <circle cx="160" cy="154" r="54" stroke="#e08b4c"/>
  </g>
  <polygon points="182,98 185,152 135,152 138,98"
           fill="#8f86ff" fill-opacity="0.16" stroke="#8f86ff" stroke-width="2.5"/>
  <g fill="#e7e7ee" stroke="#3c3c50" stroke-width="1.5">
    <circle cx="160" cy="98" r="3.6"/>
    <circle cx="182" cy="98" r="3.6"/>
    <circle cx="185" cy="152" r="3.6"/>
    <circle cx="135" cy="152" r="3.6"/>
    <circle cx="138" cy="98" r="3.6"/>
  </g>
</svg>
