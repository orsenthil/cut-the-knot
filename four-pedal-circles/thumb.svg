<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Four pedal circles from a quadrangle, all passing through Q. -->
  <g fill="none" stroke-width="2.6">
    <polygon points="105,70 215,70 215,130 105,130" stroke="#5d6472" stroke-width="1.6" stroke-dasharray="4 4"/>
    <circle cx="105" cy="70" r="62.6" stroke="#8f86ff"/>
    <circle cx="215" cy="70" r="62.6" stroke="#4fb3a0"/>
    <circle cx="215" cy="130" r="62.6" stroke="#e0a44a"/>
    <circle cx="105" cy="130" r="62.6" stroke="#d2849b"/>
  </g>
  <g fill="#6c7480">
    <circle cx="105" cy="70" r="4.5"/>
    <circle cx="215" cy="70" r="4.5"/>
    <circle cx="215" cy="130" r="4.5"/>
    <circle cx="105" cy="130" r="4.5"/>
  </g>
  <circle cx="160" cy="42" r="5.5" fill="#8f86ff"/>
  <circle cx="160" cy="100" r="7" fill="#4fb3a0" stroke="#f3f5f8" stroke-width="2"/>
</svg>
