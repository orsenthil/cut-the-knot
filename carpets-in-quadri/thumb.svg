<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The key moment: P on AB and Q on CD at the same fraction, the crossing
       lines, the blue middle carpet PSQR and the two red corner triangles.
       Mid-tones read on white and on near-black. -->
  <g stroke-linejoin="round">
    <polygon points="30,150 250,175 285,35 105,30" fill="none" stroke="#7b83c7" stroke-width="3.5"/>

    <!-- the two red triangles ARD and BSC -->
    <g fill="#c96b62" fill-opacity="0.8" stroke="#c96b62" stroke-width="2">
      <polygon points="30,150 99.4,109.8 105,30"/>
      <polygon points="250,175 235.5,67.1 285,35"/>
    </g>

    <!-- the blue carpet PSQR -->
    <polygon points="96,157.5 235.5,67.1 231,33.5 99.4,109.8"
             fill="#8f86ff" fill-opacity="0.8" stroke="#6c62d8" stroke-width="3"/>

    <!-- the four crossing lines -->
    <g fill="none" stroke="#9aa1ad" stroke-width="2">
      <line x1="30" y1="150" x2="231" y2="33.5"/>
      <line x1="250" y1="175" x2="231" y2="33.5"/>
      <line x1="285" y1="35" x2="96" y2="157.5"/>
      <line x1="105" y1="30" x2="96" y2="157.5"/>
    </g>
  </g>

  <g fill="#d0a24a" stroke="#ffffff" stroke-width="1.5">
    <circle cx="96" cy="157.5" r="5"/>
    <circle cx="231" cy="33.5" r="5"/>
  </g>
  <g fill="#4f9d78" stroke="#ffffff" stroke-width="1.5">
    <circle cx="99.4" cy="109.8" r="4"/>
    <circle cx="235.5" cy="67.1" r="4"/>
  </g>
</svg>
