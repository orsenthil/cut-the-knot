<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The eight circles of the puzzle, solved: no two consecutive digits
       sit in circles that touch. -->
  <g stroke="#8a8f99" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round">
    <line x1="160" y1="30" x2="114" y2="74"/>
    <line x1="160" y1="30" x2="160" y2="74"/>
    <line x1="160" y1="30" x2="206" y2="74"/>
    <line x1="114" y1="74" x2="160" y2="74"/>
    <line x1="114" y1="74" x2="114" y2="118"/>
    <line x1="114" y1="74" x2="160" y2="118"/>
    <line x1="160" y1="74" x2="206" y2="74"/>
    <line x1="160" y1="74" x2="114" y2="118"/>
    <line x1="160" y1="74" x2="160" y2="118"/>
    <line x1="160" y1="74" x2="206" y2="118"/>
    <line x1="206" y1="74" x2="160" y2="118"/>
    <line x1="206" y1="74" x2="206" y2="118"/>
    <line x1="114" y1="118" x2="160" y2="118"/>
    <line x1="114" y1="118" x2="160" y2="162"/>
    <line x1="160" y1="118" x2="206" y2="118"/>
    <line x1="160" y1="118" x2="160" y2="162"/>
    <line x1="206" y1="118" x2="160" y2="162"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">
    <circle cx="160" cy="30" r="19" fill="#6f66d6"/>
    <text x="160" y="37" fill="#ffffff">2</text>
    <circle cx="114" cy="74" r="19" fill="#6f66d6"/>
    <text x="114" y="81" fill="#ffffff">5</text>
    <circle cx="160" cy="74" r="19" fill="#6f66d6"/>
    <text x="160" y="81" fill="#ffffff">8</text>
    <circle cx="206" cy="74" r="19" fill="#6f66d6"/>
    <text x="206" y="81" fill="#ffffff">6</text>
    <circle cx="114" cy="118" r="19" fill="#6f66d6"/>
    <text x="114" y="125" fill="#ffffff">3</text>
    <circle cx="160" cy="118" r="19" fill="#6f66d6"/>
    <text x="160" y="125" fill="#ffffff">1</text>
    <circle cx="206" cy="118" r="19" fill="#6f66d6"/>
    <text x="206" y="125" fill="#ffffff">4</text>
    <circle cx="160" cy="162" r="19" fill="#6f66d6"/>
    <text x="160" y="169" fill="#ffffff">7</text>
  </g>
</svg>
