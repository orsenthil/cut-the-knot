<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="A square board tiled by coloured L-shaped pieces with one dark square missing">
  <!-- transparent background: a 4x4 board, one hole, a few L-trominoes -->
  <rect x="96" y="36" width="128" height="128" rx="4" fill="#3a4252"/>
  <g stroke="#5c6678" stroke-width="1">
    <line x1="128" y1="36" x2="128" y2="164"/>
    <line x1="160" y1="36" x2="160" y2="164"/>
    <line x1="192" y1="36" x2="192" y2="164"/>
    <line x1="96" y1="68" x2="224" y2="68"/>
    <line x1="96" y1="100" x2="224" y2="100"/>
    <line x1="96" y1="132" x2="224" y2="132"/>
  </g>
  <!-- the missing square -->
  <rect x="99" y="39" width="26" height="26" rx="2" fill="#11151d" stroke="#9aa1ad" stroke-width="1.5"/>
  <!-- L-trominoes, each a 2x2 block missing one corner -->
  <polygon points="0,0 2,0 2,2 1,2 1,1 0,1" transform="translate(160 36) scale(32)" fill="#4e79a7" stroke="#22283a" stroke-width="0.06"/>
  <polygon points="0,0 2,0 2,1 1,1 1,2 0,2" transform="translate(128 68) scale(32)" fill="#76b7b2" stroke="#22283a" stroke-width="0.06"/>
  <polygon points="0,0 1,0 1,1 2,1 2,2 0,2" transform="translate(96 100) scale(32)" fill="#f28e2b" stroke="#22283a" stroke-width="0.06"/>
  <polygon points="1,0 2,0 2,2 0,2 0,1 1,1" transform="translate(160 100) scale(32)" fill="#59a14f" stroke="#22283a" stroke-width="0.06"/>
  <circle cx="160" cy="176" r="3" fill="#5b4ee8"/>
</svg>
