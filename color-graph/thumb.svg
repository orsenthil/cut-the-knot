<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="A wheel graph whose nodes are coloured with three different colours">
  <!-- Edges of the wheel: a six-cycle around one central hub. -->
  <g fill="none" stroke="#6b7280" stroke-width="3" stroke-linecap="round">
    <path d="M160 60 L228 92 L228 148 L160 180 L92 148 L92 92 Z"/>
    <path d="M160 60 L160 120 M228 92 L160 120 M228 148 L160 120 M160 180 L160 120 M92 148 L160 120 M92 92 L160 120"/>
  </g>
  <!-- Outer cycle alternates between two colours, the hub takes a third. -->
  <g stroke="#3f4652" stroke-width="2.5">
    <circle cx="160" cy="60" r="17" fill="#d75c5c"/>
    <circle cx="228" cy="92" r="17" fill="#4c8ed7"/>
    <circle cx="228" cy="148" r="17" fill="#d75c5c"/>
    <circle cx="160" cy="180" r="17" fill="#4c8ed7"/>
    <circle cx="92" cy="148" r="17" fill="#d75c5c"/>
    <circle cx="92" cy="92" r="17" fill="#4c8ed7"/>
    <circle cx="160" cy="120" r="19" fill="#54ad5c"/>
  </g>
  <!-- A couple of unused palette dots, to suggest the ten-colour palette. -->
  <g stroke="#3f4652" stroke-width="1.5">
    <circle cx="34" cy="30" r="8" fill="#d8a436"/>
    <circle cx="58" cy="30" r="8" fill="#9a6fd2"/>
    <circle cx="82" cy="30" r="8" fill="#41adad"/>
    <circle cx="106" cy="30" r="8" fill="#dd7b40"/>
  </g>
</svg>
