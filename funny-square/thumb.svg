<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <title>A square built from three points on a line</title>
  <g stroke="#b8bfcc" stroke-width="2" stroke-dasharray="5 5">
    <line x1="144" y1="20" x2="144" y2="184"/>
    <line x1="188" y1="20" x2="188" y2="184"/>
    <line x1="232" y1="20" x2="232" y2="184"/>
  </g>
  <line x1="70" y1="124" x2="262" y2="124" stroke="#8f96a6" stroke-width="3"/>
  <polygon points="100,124 188,168 232,80 144,36" fill="#7c74e8" fill-opacity="0.18" stroke="#3fa86a" stroke-width="4" stroke-linejoin="round"/>
  <g fill="#3fa86a">
    <circle cx="188" cy="168" r="5"/>
    <circle cx="232" cy="80" r="5"/>
    <circle cx="144" cy="36" r="5"/>
    <circle cx="188" cy="124" r="4"/>
  </g>
  <g fill="#7c74e8" stroke="#ffffff" stroke-width="2">
    <circle cx="100" cy="124" r="8"/>
    <circle cx="144" cy="124" r="8"/>
    <circle cx="232" cy="124" r="8"/>
  </g>
  <g fill="#8f96a6" font-family="sans-serif" font-size="14">
    <text x="86" y="148">A</text>
    <text x="138" y="148">P</text>
    <text x="226" y="148">R</text>
    <text x="194" y="148">Q</text>
    <text x="238" y="76">C</text>
    <text x="194" y="188">B</text>
    <text x="126" y="30">D</text>
  </g>
</svg>
