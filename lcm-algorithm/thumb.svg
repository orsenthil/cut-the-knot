<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Three number tiles being raised until they all show the same value">
  <g font-family="ui-monospace, monospace" font-size="16" text-anchor="middle">
    <rect x="30" y="40" width="70" height="60" rx="10" fill="#2f3542" stroke="#aab4c4" stroke-width="2"/>
    <text x="65" y="78" fill="#e9eef6">12</text>
    <rect x="125" y="40" width="70" height="60" rx="10" fill="#2f3542" stroke="#aab4c4" stroke-width="2"/>
    <text x="160" y="78" fill="#e9eef6">20</text>
    <rect x="220" y="40" width="70" height="60" rx="10" fill="#2f3542" stroke="#aab4c4" stroke-width="2"/>
    <text x="255" y="78" fill="#e9eef6">30</text>
    <path d="M65 160 H255 M65 156 V164 M255 156 V164" fill="none" stroke="#c4bcff" stroke-width="2"/>
    <text x="160" y="190" fill="#f2f5fa" font-size="13">all equal → LCM</text>
  </g>
</svg>
