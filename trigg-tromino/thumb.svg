  <rect x="72" y="28" width="176" height="144" rx="6" fill="#c8c4b8" opacity="0.35"/>
  <!-- hole -->
  <rect x="148" y="88" width="24" height="24" fill="#5a6570" opacity="0.45"/>
  <!-- L pieces -->
  <rect x="76" y="32" width="20" height="20" rx="3" fill="#d0463b"/>
  <rect x="96" y="32" width="20" height="20" rx="3" fill="#d0463b"/>
  <rect x="76" y="52" width="20" height="20" rx="3" fill="#d0463b"/>
  <rect x="116" y="32" width="20" height="20" rx="3" fill="#3d74c4"/>
  <rect x="136" y="32" width="20" height="20" rx="3" fill="#3d74c4"/>
  <rect x="136" y="52" width="20" height="20" rx="3" fill="#3d74c4"/>
  <rect x="96" y="52" width="20" height="20" rx="3" fill="#dda01b"/>
  <rect x="96" y="72" width="20" height="20" rx="3" fill="#dda01b"/>
  <rect x="116" y="72" width="20" height="20" rx="3" fill="#dda01b"/>
  <rect x="156" y="32" width="20" height="20" rx="3" fill="#3d9a5c"/>
  <rect x="176" y="32" width="20" height="20" rx="3" fill="#3d9a5c"/>
  <rect x="176" y="52" width="20" height="20" rx="3" fill="#3d9a5c"/>
  <rect x="196" y="32" width="20" height="20" rx="3" fill="#8a5cc2"/>
  <rect x="216" y="32" width="20" height="20" rx="3" fill="#8a5cc2"/>
  <rect x="216" y="52" width="20" height="20" rx="3" fill="#8a5cc2"/>
  <rect x="76" y="72" width="20" height="20" rx="3" fill="#d0773b"/>
  <rect x="76" y="92" width="20" height="20" rx="3" fill="#d0773b"/>
  <rect x="96" y="92" width="20" height="20" rx="3" fill="#d0773b"/>
  <!-- red fault line across the middle -->
  <line x1="72" y1="100" x2="248" y2="100" stroke="#c23b3b" stroke-width="3" stroke-linecap="round"/>
