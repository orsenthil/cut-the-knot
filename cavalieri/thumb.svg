<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Two stacks of strips between the same parallels: the right one has
       draggable ends, and both stacks still cover the same space. Flat,
       mid-tone colours read on white and on near-black. -->
  <line x1="24" y1="34" x2="296" y2="34" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/>
  <line x1="24" y1="166" x2="296" y2="166" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/>

  <!-- left stack: six equal strips, slid slightly out of line -->
  <rect x="34" y="38" width="104" height="18" rx="2" fill="#2f9e6e"/>
  <rect x="44" y="60" width="104" height="18" rx="2" fill="#3aa082"/>
  <rect x="30" y="82" width="104" height="18" rx="2" fill="#c9a13f"/>
  <rect x="48" y="104" width="104" height="18" rx="2" fill="#d08245"/>
  <rect x="36" y="126" width="104" height="18" rx="2" fill="#c8624f"/>
  <rect x="42" y="148" width="104" height="16" rx="2" fill="#b5546e"/>

  <!-- right stack: same six lengths, reshaped, with draggable end dots -->
  <rect x="182" y="38" width="104" height="18" rx="2" fill="#2f9e6e"/>
  <circle cx="182" cy="47" r="5" fill="#5b7fd0"/>
  <circle cx="286" cy="47" r="5" fill="#5b7fd0"/>

  <rect x="196" y="60" width="90" height="18" rx="2" fill="#3aa082"/>
  <circle cx="196" cy="69" r="5" fill="#5b7fd0"/>
  <circle cx="286" cy="69" r="5" fill="#5b7fd0"/>

  <rect x="180" y="82" width="106" height="18" rx="2" fill="#c9a13f"/>
  <circle cx="180" cy="91" r="5" fill="#5b7fd0"/>
  <circle cx="286" cy="91" r="5" fill="#5b7fd0"/>

  <rect x="206" y="104" width="80" height="18" rx="2" fill="#d08245"/>
  <circle cx="206" cy="113" r="5" fill="#5b7fd0"/>
  <circle cx="286" cy="113" r="5" fill="#5b7fd0"/>

  <rect x="188" y="126" width="98" height="18" rx="2" fill="#c8624f"/>
  <circle cx="188" cy="135" r="5" fill="#5b7fd0"/>
  <circle cx="286" cy="135" r="5" fill="#5b7fd0"/>

  <rect x="200" y="148" width="86" height="16" rx="2" fill="#b5546e"/>
  <circle cx="200" cy="156" r="5" fill="#5b7fd0"/>
  <circle cx="286" cy="156" r="5" fill="#5b7fd0"/>
</svg>
