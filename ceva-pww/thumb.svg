<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <!-- The key moment: three cevians of a triangle meet at K inside a small
       parallelogram grid, drawn in mid-tones for both light and dark cards. -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <polygon points="92,52 234,44 170,166" fill="#8f86ff" fill-opacity="0.14" stroke="#6f78a8" stroke-width="2.5"/>
    <g stroke="#6f78a8" stroke-width="1.1" opacity="0.7">
      <line x1="92" y1="52" x2="198" y2="96"/>
      <line x1="118" y1="50" x2="216" y2="88"/>
      <line x1="144" y1="48" x2="230" y2="80"/>
      <line x1="234" y1="44" x2="120" y2="118"/>
      <line x1="220" y1="72" x2="144" y2="134"/>
      <line x1="206" y1="100" x2="164" y2="150"/>
    </g>
    <g stroke="#8f86ff" stroke-width="2.4">
      <line x1="92" y1="52" x2="170" y2="166"/>
      <line x1="234" y1="44" x2="92" y2="52"/>
      <line x1="170" y1="166" x2="234" y2="44" opacity="0.75"/>
    </g>
    <g fill="#8f86ff">
      <circle cx="92" cy="52" r="5"/>
      <circle cx="234" cy="44" r="5"/>
      <circle cx="170" cy="166" r="5"/>
    </g>
    <circle cx="162" cy="96" r="6" fill="#4ade80" stroke="#16321f" stroke-width="1.5"/>
    <g fill="#6f78a8" font-family="sans-serif" font-size="15" font-weight="600">
      <text x="78" y="44">A</text>
      <text x="238" y="38">B</text>
      <text x="174" y="182">C</text>
      <text x="170" y="92">K</text>
    </g>
  </g>
</svg>
