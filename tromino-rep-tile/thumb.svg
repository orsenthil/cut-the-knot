<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="A large L-shaped tromino split into four smaller L-trominoes in four colours, with one quadrant left empty">
  <!-- Transparent background. A 4x4 board in cell units, 40 px a cell. -->
  <rect x="80" y="20" width="160" height="160" rx="5" fill="#3a4252"/>
  <g transform="translate(80 20) scale(40)" stroke="#5c6678" stroke-width="0.025" opacity="0.8">
    <line x1="0" y1="1" x2="4" y2="1"/>
    <line x1="0" y1="2" x2="4" y2="2"/>
    <line x1="0" y1="3" x2="4" y2="3"/>
    <line x1="1" y1="0" x2="1" y2="4"/>
    <line x1="2" y1="0" x2="2" y2="4"/>
    <line x1="3" y1="0" x2="3" y2="4"/>
  </g>

  <!-- The quadrant the big L leaves out: the hole it is built around. -->
  <rect x="80" y="20" width="80" height="80" fill="#11151d" opacity="0.65"/>
  <rect x="84" y="24" width="72" height="72" rx="6" fill="none" stroke="#9aa1ad" stroke-width="2" stroke-dasharray="6 6" opacity="0.8"/>

  <!-- The big L, cut into its four half-size copies. -->
  <g transform="translate(80 20) scale(40)" stroke="#22283a" stroke-width="0.06" stroke-linejoin="round">
    <polygon points="2,1 3,1 3,3 1,3 1,2 2,2" fill="#4e79a7"/>
    <polygon points="2,0 4,0 4,2 3,2 3,1 2,1" fill="#f28e2b"/>
    <polygon points="0,2 1,2 1,3 2,3 2,4 0,4" fill="#76b7b2"/>
    <polygon points="3,2 4,2 4,4 2,4 2,3 3,3" fill="#59a14f"/>
  </g>
</svg>
