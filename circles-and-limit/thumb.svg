<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The key moment: a shrinking circle inside the fixed one, with the line
       AB stretched out to E, which is approaching its limit at x = 12.
       Flat mid-tone colours so the card reads on white and on near-black. -->
  <!-- axes -->
  <g stroke="#9aa1ad" stroke-width="2" fill="none">
    <line x1="14" y1="120" x2="308" y2="120"/>
    <line x1="60" y1="26" x2="60" y2="180" stroke-dasharray="5 6"/>
  </g>

  <!-- fixed circle: centre (110,120), radius 50; small circle: radius 25 -->
  <g fill="none" stroke-width="3">
    <circle cx="110" cy="120" r="50" stroke="#7c74e8"/>
    <circle cx="60" cy="120" r="25" stroke="#34a37e"/>
  </g>

  <!-- the line A-B-E and the approach to the limit -->
  <line x1="60" y1="95" x2="257" y2="120" stroke="#d08a3e" stroke-width="3"/>
  <line x1="260" y1="103" x2="260" y2="137" stroke="#c9a24a" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- points -->
  <g stroke="#374151" stroke-width="2">
    <circle cx="60" cy="95" r="5" fill="#34a37e"/>
    <circle cx="66" cy="96" r="4" fill="#374151"/>
    <circle cx="257" cy="120" r="6" fill="#d08a3e"/>
    <circle cx="60" cy="120" r="4" fill="#374151"/>
    <circle cx="110" cy="120" r="4" fill="#374151"/>
  </g>
  <!-- the limit marker -->
  <path d="M260 109 L268 120 L260 131 L252 120 Z" fill="#e0b64a" stroke="#a8862f" stroke-width="2"/>

  <!-- labels, all at least 18px -->
  <g fill="#4b5563" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="600">
    <text x="46" y="86">A</text>
    <text x="74" y="88">B</text>
    <text x="262" y="108">E</text>
    <text x="247" y="160" font-size="18">limit 12</text>
  </g>
</svg>
