<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A small oblique cube pile: the same faces read as seven cubes or eight. -->
  <g stroke="#6f7bb5" stroke-width="2" stroke-linejoin="round">
    <polygon points="160,30 200,52 160,74 120,52" fill="#aab4dc"/>
    <polygon points="120,52 160,74 160,116 120,94" fill="#7f8ac0"/>
    <polygon points="200,52 160,74 160,116 200,94" fill="#99a5d2"/>

    <polygon points="100,74 140,96 100,118 60,96" fill="#aab4dc"/>
    <polygon points="60,96 100,118 100,160 60,138" fill="#7f8ac0"/>
    <polygon points="140,96 100,118 100,160 140,138" fill="#99a5d2"/>

    <polygon points="220,74 260,96 220,118 180,96" fill="#aab4dc"/>
    <polygon points="180,96 220,118 220,160 180,138" fill="#7f8ac0"/>
    <polygon points="260,96 220,118 220,160 260,138" fill="#99a5d2"/>
  </g>
</svg>
