<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The cradle: triangle ABC, the smaller triangle XYZ on its sides, and the
       crossings D, E, F made by the three lines through O. Flat mid-tones so
       the card reads on both a white and a near-black background. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 160 L70 150 L130 40 Z" stroke="#6c7bd6" stroke-width="3"/>
    <path d="M94 106 L190 100 L160 155 Z" stroke="#4aa3a2" stroke-width="2.5"/>
    <g stroke="#d98b4a" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.9">
      <path d="M250 160 L150 115 L70 150"/>
      <path d="M130 40 L150 115"/>
    </g>
    <g stroke="#6c7bd6" stroke-width="1.6" stroke-dasharray="6 5" opacity="0.85">
      <path d="M250 160 L94 106"/>
      <path d="M70 150 L190 100"/>
      <path d="M130 40 L160 155"/>
    </g>
  </g>
  <g fill="#6c7bd6">
    <circle cx="250" cy="160" r="5"/>
    <circle cx="70" cy="150" r="5"/>
    <circle cx="130" cy="40" r="5"/>
  </g>
  <g fill="#4aa3a2">
    <circle cx="94" cy="106" r="4.5"/>
    <circle cx="190" cy="100" r="4.5"/>
    <circle cx="160" cy="155" r="4.5"/>
  </g>
  <g fill="#d98b4a">
    <circle cx="150" cy="115" r="5.5"/>
    <circle cx="175.5" cy="126.5" r="3"/>
    <circle cx="122.4" cy="127.1" r="3"/>
    <circle cx="146.7" cy="102.7" r="3"/>
  </g>
</svg>
