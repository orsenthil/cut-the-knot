    <path d="M 50 140 A 110 110 0 0 1 270 140" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M 50 140 A 70 70 0 0 1 190 140" stroke="#94a3b8" stroke-width="3"/>
    <path d="M 190 140 A 40 40 0 0 1 270 140" stroke="#94a3b8" stroke-width="3"/>
    <path d="M 153 95 L 197 104 L 190 140 Z" stroke="#4ade80" stroke-width="2" stroke-dasharray="5 4"/>
    <circle cx="164.5" cy="56" r="25.5" fill="#8f86ff" fill-opacity="0.5" stroke="#8f86ff" stroke-width="2.5"/>
    <circle cx="215.5" cy="76" r="25.5" fill="#8f86ff" fill-opacity="0.5" stroke="#8f86ff" stroke-width="2.5"/>
    <circle cx="169" cy="74" r="33" stroke="#e2a03f" stroke-width="3"/>
    <circle cx="190" cy="115" r="25.5" fill="#4ade80" fill-opacity="0.3" stroke="#4ade80" stroke-width="3"/>
  </g>
  <g fill="#cbd5e1">
