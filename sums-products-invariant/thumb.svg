<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Three numbered tiles merging into one, with an equals sign and the invariant formula below">
  <g font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">
    <rect x="20" y="30" width="50" height="40" rx="8" fill="#6a5df0"/><text x="45" y="56" fill="#fff">2</text>
    <text x="80" y="56" fill="#c4bcff">+</text>
    <rect x="96" y="30" width="50" height="40" rx="8" fill="#6a5df0"/><text x="121" y="56" fill="#fff">3</text>
    <path d="M156 50 H190 M190 50 l-8 -6 M190 50 l-8 6" fill="none" stroke="#c4bcff" stroke-width="2.5"/>
    <rect x="198" y="30" width="90" height="40" rx="8" fill="#15803d"/><text x="243" y="56" fill="#fff">11</text>
  </g>
  <text x="160" y="120" fill="#f2f5fa" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">(A+1)(B+1) = AB+A+B+1</text>
  <text x="160" y="155" fill="#f2f5fa" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">∏(Aᵢ+1) − 1</text>
</svg>
