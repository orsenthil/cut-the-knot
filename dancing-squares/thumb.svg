<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Four rigid squares hinged at the corners of a rhombus. Mid-tone flat
       colours read on both white and near-black; the dashed lines are the
       hinge and the dots are the three points the player can drag. -->
  <g stroke="#8a92a3" stroke-width="2" stroke-linejoin="round">
    <polygon points="140,78 196,100 218,44 162,22" fill="#6d74cf" fill-opacity="0.85"/>
    <polygon points="196,100 140,122 162,178 218,156" fill="#3f9a8d" fill-opacity="0.85"/>
    <polygon points="140,122 84,100 62,156 118,178" fill="#c4874a" fill-opacity="0.85"/>
    <polygon points="84,100 140,78 118,22 62,44" fill="#b0618c" fill-opacity="0.85"/>
  </g>
  <polygon points="140,78 196,100 140,122 84,100" fill="none" stroke="#d6dae2" stroke-width="2" stroke-dasharray="6 5"/>
  <g fill="#e6e8ee" stroke="#596173" stroke-width="1.5">
    <circle cx="140" cy="78" r="4"/>
    <circle cx="196" cy="100" r="4"/>
    <circle cx="140" cy="122" r="4"/>
    <circle cx="84" cy="100" r="4"/>
  </g>
</svg>
