<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <title>A triangle cut into three pieces beside its mirror image</title>
  <!-- the mirror line -->
  <path d="M 160 16 L 160 184" fill="none" stroke="#8b95b5" stroke-width="2" stroke-dasharray="4 6"/>
  <!-- original triangle, cut from D to the midpoints E and F -->
  <polygon points="60,100 40,160 80,160" fill="#46b39c" fill-opacity="0.7" stroke="#46b39c" stroke-width="2"/>
  <polygon points="110,100 80,40 60,100 80,160" fill="#7987e8" fill-opacity="0.55" stroke="#7987e8" stroke-width="2"/>
  <polygon points="110,100 80,160 140,160" fill="#d27b6b" fill-opacity="0.65" stroke="#d27b6b" stroke-width="2"/>
  <path d="M 80 160 L 60 100 M 80 160 L 110 100" fill="none" stroke="#e6e9ff" stroke-width="2" stroke-dasharray="5 4"/>
  <!-- the mirror image, with the same three pieces turned into place -->
  <polygon points="260,100 280,160 240,160" fill="#46b39c" fill-opacity="0.18" stroke="#46b39c" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="210,100 240,40 260,100 240,160" fill="#7987e8" fill-opacity="0.16" stroke="#7987e8" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="210,100 240,160 180,160" fill="#d27b6b" fill-opacity="0.18" stroke="#d27b6b" stroke-width="2" stroke-dasharray="5 4"/>
  <!-- draggable corners -->
  <circle cx="80" cy="40" r="5" fill="#e6e9ff" stroke="#7987e8" stroke-width="2"/>
  <circle cx="40" cy="160" r="5" fill="#e6e9ff" stroke="#7987e8" stroke-width="2"/>
  <circle cx="140" cy="160" r="5" fill="#e6e9ff" stroke="#7987e8" stroke-width="2"/>
</svg>
