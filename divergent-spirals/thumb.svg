<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Concentric half-circles, each turned a step further: the illusion in one frame. -->
  <g fill="none" stroke-linecap="butt" stroke-width="7">
    <circle cx="160" cy="100" r="20" stroke="#6f66d4" stroke-dasharray="63 63" transform="rotate(0 160 100)"/>
    <circle cx="160" cy="100" r="36" stroke="#c2bcf6" stroke-dasharray="113 113" transform="rotate(45 160 100)"/>
    <circle cx="160" cy="100" r="52" stroke="#6f66d4" stroke-dasharray="163 163" transform="rotate(90 160 100)"/>
    <circle cx="160" cy="100" r="68" stroke="#c2bcf6" stroke-dasharray="214 214" transform="rotate(135 160 100)"/>
    <circle cx="160" cy="100" r="84" stroke="#6f66d4" stroke-dasharray="264 264" transform="rotate(180 160 100)"/>
  </g>
  <circle cx="160" cy="100" r="4" fill="#4b4794"/>
  <circle cx="244" cy="100" r="6" fill="#8f86ff"/>
</svg>
