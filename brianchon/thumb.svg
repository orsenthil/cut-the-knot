  <polygon points="210,134 143,160 111,118 107,39 185,54 210,79" fill="#8f86ff" fill-opacity="0.12" stroke="#8f86ff" stroke-width="2.5" stroke-linejoin="round"/>
  <g stroke="#4ade80" stroke-width="2.5" stroke-linecap="round">
    <line x1="210" y1="134" x2="107" y2="39"/>
    <line x1="143" y1="160" x2="185" y2="54"/>
    <line x1="111" y1="118" x2="210" y2="79"/>
  </g>
  <circle cx="168" cy="95" r="5" fill="#4ade80"/>
  <g fill="#8f86ff">
    <circle cx="210" cy="100" r="4.5"/>
    <circle cx="162" cy="147" r="4.5"/>
    <circle cx="112" cy="130" r="4.5"/>
    <circle cx="108" cy="52" r="4.5"/>
