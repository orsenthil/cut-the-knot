<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The key moment: perpendicular diagonals make eight dots share one circle.
       Transparent background, mid-tone colours that read on white and near-black. -->
  <g fill="none" stroke-linecap="round">
    <circle cx="125" cy="101.25" r="68" stroke="#d0a24a" stroke-width="3"/>
    <polygon points="100,25 35,105 100,170 265,105" stroke="#7b83c7" stroke-width="3.5"/>
    <line x1="100" y1="25" x2="100" y2="170" stroke="#8f86ff" stroke-width="2.5" stroke-dasharray="7 6"/>
    <line x1="35" y1="105" x2="265" y2="105" stroke="#8f86ff" stroke-width="2.5" stroke-dasharray="7 6"/>
  </g>
  <g fill="#8f86ff">
    <circle cx="67.5" cy="65" r="5"/>
    <circle cx="67.5" cy="137.5" r="5"/>
    <circle cx="182.5" cy="137.5" r="5"/>
    <circle cx="182.5" cy="65" r="5"/>
  </g>
  <g fill="#4f9d78">
    <circle cx="107.7" cy="167" r="5"/>
    <circle cx="117.8" cy="33.7" r="5"/>
    <circle cx="77.7" cy="52.4" r="5"/>
    <circle cx="88.8" cy="158.8" r="5"/>
  </g>
  <circle cx="125" cy="101.25" r="7" fill="#d0a24a" stroke="#ffffff" stroke-width="2"/>
</svg>
