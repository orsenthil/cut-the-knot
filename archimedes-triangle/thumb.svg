<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The key moment: two tangents make a triangle whose base is a chord, and
       the parabolic cap inside it is two thirds of the triangle's area. -->
  <path d="M 40 90 L 70 116 L 100 135 L 130 146 L 160 150 L 190 146 L 220 136 L 250 118 L 280 92"
        fill="none" stroke="#7d93b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 70 116 L 100 135 L 130 146 L 160 150 L 190 146 L 230 130 L 230 130 L 70 116 Z"
        fill="#4ade80" opacity="0.35"/>
  <path d="M 70 116 L 230 130" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 30 96 L 150 176 L 265 123" fill="none" stroke="#8f86ff" stroke-width="3"
        stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 150 123 L 150 176" fill="none" stroke="#e0a458" stroke-width="2.5" stroke-dasharray="5 4"/>
  <circle cx="70" cy="116" r="6" fill="#8f86ff"/>
  <circle cx="230" cy="130" r="6" fill="#8f86ff"/>
  <circle cx="150" cy="176" r="6" fill="#e0a458"/>
  <circle cx="150" cy="150" r="5" fill="#4ade80"/>
</svg>
