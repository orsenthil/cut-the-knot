    <polygon points="160,35 242,77 206,110" fill="#7d86df" fill-opacity="0.2" stroke="#8e96e8" stroke-width="2"/>
    <polygon points="160,35 114,110 78,77" fill="#7d86df" fill-opacity="0.2" stroke="#8e96e8" stroke-width="2"/>
    <polygon points="114,110 206,110 160,190" fill="#7d86df" fill-opacity="0.2" stroke="#8e96e8" stroke-width="2"/>
    <polygon points="167,75 142,121 193,121" fill="none" stroke="#45b689" stroke-width="3.5"/>
