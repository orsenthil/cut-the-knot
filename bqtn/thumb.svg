  <circle cx="160" cy="118" r="56.7" fill="none" stroke="#4ade80" stroke-width="3"/>
  <circle cx="131" cy="96" r="20" fill="none" stroke="#8f86ff" stroke-width="3"/>
  <circle cx="179" cy="126" r="9" fill="none" stroke="#9aa1ad" stroke-width="2.5"/>
  <g fill="#8f86ff">
    <circle cx="160" cy="25" r="5"/>
    <circle cx="45" cy="175" r="5"/>
    <circle cx="275" cy="175" r="5"/>
  </g>
  <circle cx="115" cy="84" r="4" fill="#4ade80"/>
  <circle cx="160" cy="118" r="4" fill="#4ade80"/>
</svg>
