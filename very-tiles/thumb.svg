<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Twelve answer tiles above twelve gap sums, with two matching star patterns. -->
  <rect x="8" y="8" width="304" height="184" rx="18" fill="#8f86ff" opacity="0.14"/>

  <g fill="#e9edf3" stroke="#8f86ff" stroke-width="2">
    <rect x="22" y="26" width="42" height="42" rx="8"/>
    <rect x="72" y="26" width="42" height="42" rx="8"/>
    <rect x="122" y="26" width="42" height="42" rx="8"/>
    <rect x="172" y="26" width="42" height="42" rx="8"/>
    <rect x="222" y="26" width="42" height="42" rx="8"/>
    <rect x="272" y="26" width="26" height="42" rx="8"/>
  </g>
  <g fill="#1f2430" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">
    <text x="43" y="54">1</text>
    <text x="93" y="54">2</text>
    <text x="143" y="54">3</text>
    <text x="193" y="54">4</text>
    <text x="243" y="54">5</text>
    <text x="285" y="54">6</text>
  </g>
  <rect x="72" y="26" width="42" height="42" rx="8" fill="#5b4ee8" fill-opacity="0.16" stroke="#5b4ee8" stroke-width="3"/>

  <g fill="none" stroke-width="2.5">
    <g transform="translate(77,94)">
      <polygon points="0,-12 10.4,6 -10.4,6" stroke="#5b4ee8"/>
      <polygon points="0,12 10.4,-6 -10.4,-6" stroke="#5b4ee8"/>
    </g>
    <g transform="translate(160,94)">
      <polygon points="0,-12 10.4,6 -10.4,6" stroke="#15803d"/>
      <polygon points="0,12 10.4,-6 -10.4,-6" stroke="#15803d"/>
    </g>
    <g transform="translate(243,94)">
      <polygon points="0,-12 10.4,6 -10.4,6" stroke="#c2362b"/>
      <polygon points="0,12 10.4,-6 -10.4,-6" stroke="#c2362b"/>
    </g>
  </g>

  <g fill="#e9edf3" stroke="#8f86ff" stroke-width="2">
    <rect x="22" y="124" width="42" height="42" rx="8"/>
    <rect x="72" y="124" width="42" height="42" rx="8"/>
    <rect x="122" y="124" width="42" height="42" rx="8"/>
    <rect x="172" y="124" width="42" height="42" rx="8"/>
    <rect x="222" y="124" width="42" height="42" rx="8"/>
    <rect x="272" y="124" width="26" height="42" rx="8"/>
  </g>
  <g fill="#1f2430" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    <text x="43" y="150">3+?</text>
    <text x="93" y="150">?+4</text>
    <text x="143" y="150">2+?</text>
    <text x="193" y="150">5+?</text>
    <text x="243" y="150">?+7</text>
    <text x="285" y="150">1+?</text>
  </g>
</svg>
