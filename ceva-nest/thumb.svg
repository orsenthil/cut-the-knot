<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The key moment: two nested cevian triangles and their three concurrent lines. -->
  <g fill="none" stroke-linejoin="round">
    <polygon points="205,42 48,164 274,158" stroke="#d8dde8" stroke-width="3"/>
    <polygon points="178,161 236,94 147,87" stroke="#7ba9d6" stroke-width="2.6"/>
    <polygon points="192,91 165,130 202,133" stroke="#79b98f" stroke-width="2.6"/>
    <g stroke="#7ba9d6" stroke-width="1.6" stroke-dasharray="5 4">
      <line x1="205" y1="42" x2="178" y2="161"/>
      <line x1="48" y1="164" x2="236" y2="94"/>
      <line x1="274" y1="158" x2="147" y2="87"/>
    </g>
    <g stroke="#d99a5b" stroke-width="1.4" stroke-dasharray="4 4">
      <line x1="178" y1="161" x2="192" y2="91"/>
      <line x1="236" y1="94" x2="165" y2="130"/>
      <line x1="147" y1="87" x2="202" y2="133"/>
    </g>
    <g stroke="#79b98f" stroke-width="2" stroke-dasharray="6 5">
      <line x1="205" y1="42" x2="192" y2="91"/>
      <line x1="48" y1="164" x2="165" y2="130"/>
      <line x1="274" y1="158" x2="202" y2="133"/>
    </g>
  </g>
  <g fill="#7ba9d6">
    <circle cx="205" cy="42" r="5"/><circle cx="48" cy="164" r="5"/><circle cx="274" cy="158" r="5"/>
    <circle cx="178" cy="161" r="4"/><circle cx="236" cy="94" r="4"/><circle cx="147" cy="87" r="4"/>
  </g>
  <g fill="#79b98f">
    <circle cx="192" cy="91" r="4"/><circle cx="165" cy="130" r="4"/><circle cx="202" cy="133" r="4"/>
  </g>
  <g fill="#d99a5b" stroke="#f4f1ea" stroke-width="2">
    <circle cx="189" cy="111" r="5.5"/><circle cx="186" cy="119" r="5.5"/>
  </g>
  <circle cx="182" cy="125" r="6.5" fill="#c2607a" stroke="#f4f1ea" stroke-width="2"/>
</svg>
