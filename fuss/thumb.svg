<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <!-- A bicentric quadrilateral: four corners on the outer circle, four sides
       touching the inner circle. Mid-tone colours read on light and dark. -->
  <circle cx="160" cy="100" r="60" fill="none" stroke="#8f86ff" stroke-width="2.5"/>
  <circle cx="184" cy="100" r="33.1" fill="#8f86ff" fill-opacity="0.16" stroke="#8f86ff" stroke-width="2"/>
  <polygon points="207.8,136.4 104.8,123.5 192.5,81.6 219.9,105.6"
           fill="#e0ad69" fill-opacity="0.16" stroke="#e0ad69" stroke-width="2.5"/>
  <circle cx="160" cy="100" r="3" fill="#8992a4"/>
  <circle cx="184" cy="100" r="3" fill="#8f86ff"/>
  <circle cx="207.8" cy="136.4" r="5" fill="#8f86ff" stroke="#e9edf3" stroke-width="1.5"/>
  <circle cx="201.4" cy="100" r="3.5" fill="#54b98a"/>
</svg>
