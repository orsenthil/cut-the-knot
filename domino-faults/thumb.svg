<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="A chessboard part-covered with dominoes, with one red line running clean across it">
  <g fill="#9aa3b1">
    <rect x="40" y="20" width="40" height="40"/><rect x="120" y="20" width="40" height="40"/>
    <rect x="200" y="20" width="40" height="40"/><rect x="80" y="60" width="40" height="40"/>
    <rect x="160" y="60" width="40" height="40"/><rect x="240" y="60" width="40" height="40"/>
    <rect x="40" y="100" width="40" height="40"/><rect x="120" y="100" width="40" height="40"/>
    <rect x="200" y="100" width="40" height="40"/><rect x="80" y="140" width="40" height="40"/>
    <rect x="160" y="140" width="40" height="40"/><rect x="240" y="140" width="40" height="40"/>
  </g>
  <g fill="#c3cad5">
    <rect x="80" y="20" width="40" height="40"/><rect x="160" y="20" width="40" height="40"/>
    <rect x="240" y="20" width="40" height="40"/><rect x="40" y="60" width="40" height="40"/>
    <rect x="120" y="60" width="40" height="40"/><rect x="200" y="60" width="40" height="40"/>
    <rect x="80" y="100" width="40" height="40"/><rect x="160" y="100" width="40" height="40"/>
    <rect x="240" y="100" width="40" height="40"/><rect x="40" y="140" width="40" height="40"/>
    <rect x="120" y="140" width="40" height="40"/><rect x="200" y="140" width="40" height="40"/>
  </g>
  <rect x="40" y="20" width="240" height="160" fill="none" stroke="#5c6472" stroke-width="2"/>
  <!-- dominoes, inset so each one reads as a single piece -->
  <g fill="#d8b26a" stroke="#4a3610" stroke-width="2">
    <rect x="44" y="24" width="72" height="32" rx="7"/>
    <rect x="44" y="64" width="72" height="32" rx="7"/>
    <rect x="44" y="104" width="32" height="72" rx="7"/>
    <rect x="124" y="24" width="32" height="72" rx="7"/>
    <rect x="84" y="104" width="72" height="32" rx="7"/>
    <rect x="164" y="24" width="72" height="32" rx="7"/>
    <rect x="164" y="64" width="72" height="32" rx="7"/>
    <rect x="244" y="24" width="32" height="72" rx="7"/>
    <rect x="164" y="104" width="72" height="32" rx="7"/>
  </g>
  <!-- the fault: a line no domino crosses -->
  <rect x="157" y="16" width="6" height="168" rx="3" fill="#c4453a"/>
</svg>
