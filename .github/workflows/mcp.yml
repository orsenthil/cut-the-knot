name: Deploy MCP tutor

# Every merged port should update the tutor, so this runs on pushes to web that
# touch the server, any game folder, the catalogue, the concept graph or the
# manifest. The content index is rebuilt from the repo inside the image build,
# which is what keeps the tutor from drifting away from the site.
on:
  push:
    branches: [web]
    paths:
      - "mcp/**"
      - "assets/games.js"
      - "assets/concepts.js"
      - "assets/recommend.js"
      - "porting/manifest.json"
      - "*/index.html"
      - "*/*.js"
      - ".dockerignore"
      - ".github/workflows/mcp.yml"
  workflow_dispatch:

concurrency:
  # One deploy at a time; a newer push supersedes one still running.
  group: mcp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    # Job level, not step level: a step's `if` cannot read that step's own env,
    # so the "is the secret set?" check has to live here.
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install
        working-directory: mcp
        run: npm ci

      - name: Build the content index
        working-directory: mcp
        run: npm run build-index

      # Typecheck, the saved answers, and the HTTP surface.
      - name: Test
        working-directory: mcp
        run: npm test

      # Catch an image that will not build before the deploy touches production.
      - name: Check the image builds
        run: docker build -f mcp/Dockerfile -t coolmaths-tutor .

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: ${{ env.FLY_API_TOKEN != '' }}

      - name: Deploy
        if: ${{ env.FLY_API_TOKEN != '' }}
        run: flyctl deploy --remote-only --config mcp/fly.toml --dockerfile mcp/Dockerfile

      - name: Report the deployed endpoint
        if: ${{ env.FLY_API_TOKEN != '' }}
        run: |
          echo "Deployed. The MCP endpoint is the app URL with /mcp on the end." >> "$GITHUB_STEP_SUMMARY"
          echo '`claude mcp add --transport http coolmaths https://coolmaths-tutor.fly.dev/mcp`' >> "$GITHUB_STEP_SUMMARY"

      - name: Say what to do when the secret is missing
        if: ${{ env.FLY_API_TOKEN == '' }}
        run: |
          echo "::warning title=MCP not deployed::FLY_API_TOKEN is not set, so the build was checked but not deployed."
          echo "Create the app once with 'fly apps create coolmaths-tutor', then add under" >> "$GITHUB_STEP_SUMMARY"
          echo "Settings -> Secrets and variables -> Actions:" >> "$GITHUB_STEP_SUMMARY"
          echo "  * FLY_API_TOKEN - from 'fly tokens create deploy -a coolmaths-tutor'" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The image was built and tested, so re-running this workflow after adding it will deploy." >> "$GITHUB_STEP_SUMMARY"
