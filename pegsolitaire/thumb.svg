<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="English peg solitaire board with one empty centre">
  <rect width="320" height="200" fill="none"/>
  <g transform="translate(85,25)">
    <!-- simplified English board -->
    <g fill="#d1d5db" stroke="#6b7280" stroke-width="1.5">
      <!-- top arm -->
      <circle cx="60" cy="20" r="10"/><circle cx="90" cy="20" r="10"/><circle cx="120" cy="20" r="10"/>
      <circle cx="60" cy="50" r="10"/><circle cx="90" cy="50" r="10"/><circle cx="120" cy="50" r="10"/>
      <!-- middle row full -->
      <circle cx="30" cy="80" r="10"/><circle cx="60" cy="80" r="10"/><circle cx="90" cy="80" r="10"/><circle cx="120" cy="80" r="10"/><circle cx="150" cy="80" r="10"/>
      <circle cx="30" cy="110" r="10"/><circle cx="60" cy="110" r="10"/><circle cx="120" cy="110" r="10"/><circle cx="150" cy="110" r="10"/>
      <circle cx="30" cy="140" r="10"/><circle cx="60" cy="140" r="10"/><circle cx="90" cy="140" r="10"/><circle cx="120" cy="140" r="10"/><circle cx="150" cy="140" r="10"/>
      <!-- bottom arm -->
      <circle cx="60" cy="170" r="10"/><circle cx="90" cy="170" r="10"/><circle cx="120" cy="170" r="10"/>
    </g>
    <!-- pegs -->
    <g fill="#dc2626" stroke="#7f1d1d" stroke-width="1">
      <circle cx="60" cy="20" r="7"/><circle cx="90" cy="20" r="7"/><circle cx="120" cy="20" r="7"/>
      <circle cx="60" cy="50" r="7"/><circle cx="90" cy="50" r="7"/><circle cx="120" cy="50" r="7"/>
      <circle cx="30" cy="80" r="7"/><circle cx="60" cy="80" r="7"/><circle cx="90" cy="80" r="7"/><circle cx="120" cy="80" r="7"/><circle cx="150" cy="80" r="7"/>
      <circle cx="30" cy="110" r="7"/><circle cx="60" cy="110" r="7"/><circle cx="120" cy="110" r="7"/><circle cx="150" cy="110" r="7"/>
      <circle cx="30" cy="140" r="7"/><circle cx="60" cy="140" r="7"/><circle cx="90" cy="140" r="7"/><circle cx="120" cy="140" r="7"/><circle cx="150" cy="140" r="7"/>
      <circle cx="60" cy="170" r="7"/><circle cx="90" cy="170" r="7"/><circle cx="120" cy="170" r="7"/>
    </g>
    <!-- empty centre -->
    <circle cx="90" cy="110" r="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  </g>
</svg>
