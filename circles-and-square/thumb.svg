<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The key moment: the circumcircles of AMK and CNK meet again at P on the
       diagonal AC of a square. Mid-tones read on both white and near-black. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- the square ABCD -->
    <polygon points="60,30 60,170 260,170 260,30" stroke="#7b83c7" stroke-width="3.5"/>
    <!-- the diagonal AC, with P on it -->
    <line x1="60" y1="30" x2="260" y2="170" stroke="#d97a7a" stroke-width="2.5"/>
    <!-- the two circumcircles through A, M, K and C, N, K -->
    <circle cx="80" cy="84.5" r="58" stroke="#8f86ff" stroke-width="2.5"/>
    <circle cx="216" cy="103" r="80" stroke="#4f9d78" stroke-width="2.5"/>
    <!-- M, N and K on the chord MN -->
    <line x1="100" y1="30" x2="172" y2="170" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="5 5"/>
  </g>
  <g fill="#e08a3c">
    <circle cx="60" cy="30" r="4.5"/><circle cx="60" cy="170" r="4.5"/>
    <circle cx="260" cy="170" r="4.5"/><circle cx="260" cy="30" r="4.5"/>
    <circle cx="100" cy="30" r="4"/><circle cx="172" cy="170" r="4"/>
  </g>
  <circle cx="136" cy="100" r="4.5" fill="#5b4ee8"/>
  <circle cx="138" cy="84.7" r="5.5" fill="#c2362b"/>
</svg>
