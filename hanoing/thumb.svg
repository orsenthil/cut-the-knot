<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="A row of red, blue and white squares above the same position drawn as three towers of discs">
  <!-- the puzzle: a row of coloured squares, one per disc -->
  <g stroke="#3a3a48" stroke-width="2.5">
    <rect x="26" y="22" width="40" height="40" rx="6" fill="#f2f2f5"/>
    <rect x="74" y="22" width="40" height="40" rx="6" fill="#d64545"/>
    <rect x="122" y="22" width="40" height="40" rx="6" fill="#3f6fd8"/>
    <rect x="170" y="22" width="40" height="40" rx="6" fill="#d64545"/>
    <rect x="218" y="22" width="40" height="40" rx="6" fill="#3f6fd8"/>
    <rect x="266" y="22" width="40" height="40" rx="6" fill="#f2f2f5"/>
  </g>

  <!-- the arrow saying "the same thing" -->
  <path d="M160 76 L160 96 M152 88 L160 96 L168 88" fill="none" stroke="#8b8ba0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the same position as three towers; disc width grows with the square's place -->
  <g stroke="#3a3a48" stroke-width="2">
    <!-- red peg: squares 2 and 4 -->
    <rect x="34" y="150" width="66" height="13" rx="4" fill="#d64545"/>
    <rect x="46" y="133" width="42" height="13" rx="4" fill="#d64545"/>
    <!-- blue peg: squares 3 and 5 -->
    <rect x="118" y="150" width="84" height="13" rx="4" fill="#3f6fd8"/>
    <rect x="133" y="133" width="54" height="13" rx="4" fill="#3f6fd8"/>
    <!-- white peg: squares 1 and 6 -->
    <rect x="212" y="150" width="96" height="13" rx="4" fill="#f2f2f5"/>
    <rect x="248" y="133" width="24" height="13" rx="4" fill="#f2f2f5"/>
  </g>
  <g stroke="#8b8ba0" stroke-width="3" stroke-linecap="round">
    <path d="M28 170 L106 170"/>
    <path d="M112 170 L208 170"/>
    <path d="M214 170 L312 170"/>
  </g>
</svg>
