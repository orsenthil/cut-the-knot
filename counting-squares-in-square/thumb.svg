<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A 4x4 grid: the nine places of a 2x2 square painted orange, the square itself in violet. -->
  <g stroke="#8b93a3" stroke-width="2">
    <rect x="60" y="20" width="160" height="160" fill="none" stroke-width="4"/>
    <g fill="#e08a2e"><rect x="62" y="22" width="36" height="36"/><rect x="102" y="22" width="36" height="36"/><rect x="142" y="22" width="36" height="36"/>
    <rect x="62" y="62" width="36" height="36"/><rect x="102" y="62" width="36" height="36"/><rect x="142" y="62" width="36" height="36"/>
    <rect x="62" y="102" width="36" height="36"/><rect x="102" y="102" width="36" height="36"/><rect x="142" y="102" width="36" height="36"/></g>
    <line x1="100" y1="20" x2="100" y2="180"/><line x1="140" y1="20" x2="140" y2="180"/><line x1="180" y1="20" x2="180" y2="180"/>
    <line x1="60" y1="60" x2="220" y2="60"/><line x1="60" y1="100" x2="220" y2="100"/><line x1="60" y1="140" x2="220" y2="140"/>
  </g>
  <rect x="140" y="100" width="80" height="80" fill="#7a6ff0" fill-opacity="0.3" stroke="#7a6ff0" stroke-width="5"/>
  <rect x="144" y="104" width="32" height="32" fill="#7a6ff0"/>
</svg>
