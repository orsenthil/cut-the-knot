<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Two squares, the point P, and the square built from their matching corners. -->
  <g fill="none" stroke-width="2.5" stroke-linejoin="round">
    <!-- coloured links between matching corners -->
    <path d="M246 95 L136 121 M210 131 L126 79 M174 95 L84 89 M210 59 L94 131"
          stroke="#b05a4f" stroke-width="1.6" opacity="0.65"/>
    <!-- links from P to the new corners -->
    <path d="M70 110 L180 84 M70 110 L154 162 M70 110 L160 116 M70 110 L186 38"
          stroke="#5b6f9c" stroke-width="1.6" opacity="0.55"/>
    <!-- the two given squares -->
    <polygon points="246,95 210,131 174,95 210,59" stroke="#7a6ad8"/>
    <polygon points="136,121 126,79 84,89 94,131" stroke="#27927c"/>
    <!-- the third square -->
    <polygon points="180,84 154,162 160,116 186,38" stroke="#8b62c9" stroke-width="3.2"/>
  </g>
  <g fill="#7a6ad8" stroke="#f4f4f6" stroke-width="2">
    <circle cx="246" cy="95" r="5"/><circle cx="174" cy="95" r="5"/>
  </g>
  <g fill="#27927c" stroke="#f4f4f6" stroke-width="2">
    <circle cx="136" cy="121" r="5"/><circle cx="84" cy="89" r="5"/>
  </g>
  <circle cx="70" cy="110" r="6" fill="#c9a227" stroke="#f4f4f6" stroke-width="2"/>
</svg>
