<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The key moment: two equal blue triangles cut from the ends of the
       parallelogram and pasted to make the green rectangle of the same area.
       Mid-tones read on both white and near-black. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- the rectangle AFGD made by the cut and paste -->
    <polygon points="80,40 80,160 220,160 220,40" stroke="#4f9d78" stroke-width="3" stroke-dasharray="8 6"/>
    <!-- the two congruent pieces -->
    <polygon points="80,40 50,160 80,160" fill="#8f86ff" fill-opacity="0.55"/>
    <polygon points="220,40 190,160 220,160" fill="#8f86ff" fill-opacity="0.55"/>
    <!-- the parallelogram and its base -->
    <polygon points="80,40 220,40 190,160 50,160" stroke="#7b83c7" stroke-width="4"/>
    <line x1="50" y1="160" x2="190" y2="160" stroke="#e08a3c" stroke-width="5"/>
    <line x1="80" y1="40" x2="80" y2="160" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="220" y1="40" x2="220" y2="160" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="5 5"/>
  </g>
  <g fill="#e08a3c">
    <circle cx="80" cy="40" r="5"/><circle cx="220" cy="40" r="5"/>
    <circle cx="50" cy="160" r="5"/><circle cx="190" cy="160" r="5"/>
  </g>
</svg>
