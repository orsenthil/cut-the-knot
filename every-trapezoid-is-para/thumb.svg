<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The trap: unequal bases, yet the diagonal's two end pieces are marked equal. -->
  <g fill="none" stroke="#5c6b96" stroke-width="2">
    <path d="M50 55 H160"/>
    <path d="M240 150 H290"/>
    <path d="M50 55 L290 150" stroke-dasharray="6 5" opacity="0.7"/>
    <path d="M130 150 L210 55" opacity="0.7"/>
  </g>
  <path d="M160 55 L130 150 L240 150 L210 55 Z" fill="#7e86e8" fill-opacity="0.24" stroke="#6a74d0" stroke-width="3" stroke-linejoin="round"/>
  <path d="M160 55 L240 150" stroke="#ffab52" stroke-width="3"/>
  <g fill="#6a74d0" stroke="#f4f4f8" stroke-width="1.5">
    <circle cx="160" cy="55" r="4.5"/>
    <circle cx="130" cy="150" r="4.5"/>
    <circle cx="240" cy="150" r="4.5"/>
    <circle cx="210" cy="55" r="4.5"/>
  </g>
  <g fill="#2ea879" stroke="#f4f4f8" stroke-width="1.5">
    <circle cx="185" cy="84.7" r="4"/>
    <circle cx="215" cy="120.3" r="4"/>
  </g>
  <g stroke="#ffab52" stroke-width="2.5" stroke-linecap="round">
    <path d="M181.4 82.9 L188.6 86.5"/>
    <path d="M211.4 118.5 L218.6 122.1"/>
  </g>
</svg>
