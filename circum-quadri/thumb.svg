<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The inscribed circle, the quadrilateral its tangents make, and the
       four lines crossing at one dot. Mid-tones read on white and near-black. -->
  <circle cx="160" cy="100" r="50" fill="#8f86ff" fill-opacity="0.08"
          stroke="#8f86ff" stroke-width="1.5" stroke-dasharray="4 4"/>
  <polygon points="210,38 210,134 125,167 99,62" fill="#8f86ff" fill-opacity="0.10"
           stroke="#8f86ff" stroke-width="2.5" stroke-linejoin="round"/>
  <g stroke="#4f9d78" stroke-width="2.5" stroke-linecap="round">
    <line x1="210" y1="134" x2="99" y2="62"/>
    <line x1="125" y1="167" x2="210" y2="38"/>
  </g>
  <g stroke="#d0a24a" stroke-width="2.5" stroke-linecap="round">
    <line x1="210" y1="100" x2="111.5" y2="112"/>
    <line x1="178" y1="147" x2="149.5" y2="51"/>
  </g>
  <g fill="#8f86ff">
    <circle cx="210" cy="100" r="4.5"/>
    <circle cx="178" cy="147" r="4.5"/>
    <circle cx="111.5" cy="112" r="4.5"/>
    <circle cx="149.5" cy="51" r="4.5"/>
  </g>
  <circle cx="166" cy="105" r="6" fill="#4ade80" stroke="#ffffff" stroke-width="2"/>
</svg>
