<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A triangle with its three inside bisectors meeting at one point. -->
  <polygon points="92,36 70,158 252,154" fill="none" stroke="#8d93a3" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#7b6ae0" stroke-width="3" stroke-linecap="round">
    <line x1="92" y1="36" x2="133" y2="123"/>
    <line x1="70" y1="158" x2="133" y2="123"/>
    <line x1="252" y1="154" x2="133" y2="123"/>
  </g>
  <g fill="#7b6ae0">
    <circle cx="92" cy="36" r="6"/>
    <circle cx="70" cy="158" r="6"/>
    <circle cx="252" cy="154" r="6"/>
  </g>
  <circle cx="133" cy="123" r="9" fill="#d4a017" stroke="#8d93a3" stroke-width="2"/>
</svg>
