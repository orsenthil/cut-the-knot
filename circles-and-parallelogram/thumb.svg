<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The key moment: the circumcircles of AMK and CNK meet again at P on the
       diagonal AC of a parallelogram. Mid-tones read on both white and near-black. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- the parallelogram ABCD -->
    <polygon points="50,150 200,150 250,50 100,50" stroke="#7b83c7" stroke-width="3.5"/>
    <!-- the diagonal AC, with P on it -->
    <line x1="50" y1="150" x2="250" y2="50" stroke="#d97a7a" stroke-width="2.5"/>
    <!-- the two circumcircles through A, M, K and C, N, K -->
    <circle cx="80" cy="80" r="76" stroke="#8f86ff" stroke-width="2.5"/>
    <circle cx="230" cy="130" r="82" stroke="#4f9d78" stroke-width="2.5"/>
    <!-- M, N and the chord KP -->
    <line x1="110" y1="150" x2="210" y2="50" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="150" y1="110" x2="154" y2="98" stroke="#d97a7a" stroke-width="2"/>
  </g>
  <g fill="#e08a3c">
    <circle cx="50" cy="150" r="4.5"/><circle cx="200" cy="150" r="4.5"/>
    <circle cx="250" cy="50" r="4.5"/><circle cx="100" cy="50" r="4.5"/>
  </g>
  <g fill="#5b4ee8">
    <circle cx="110" cy="150" r="4"/><circle cx="210" cy="50" r="4"/>
    <circle cx="150" cy="110" r="4"/>
  </g>
  <circle cx="154" cy="98" r="5.5" fill="#c2362b"/>
</svg>
