<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="The numbers 1, 4, 9, 16 followed by a question mark">
  <g fill="#6b7486">
    <rect x="22" y="72" width="50" height="50" rx="10"/>
    <rect x="80" y="72" width="50" height="50" rx="10"/>
    <rect x="138" y="72" width="50" height="50" rx="10"/>
    <rect x="196" y="72" width="50" height="50" rx="10"/>
  </g>
  <rect x="254" y="72" width="50" height="50" rx="10" fill="none" stroke="#5b4ee8" stroke-width="4"/>
  <g font-family="system-ui, sans-serif" font-weight="700" font-size="26" text-anchor="middle" fill="#ffffff">
    <text x="47" y="106">1</text>
    <text x="105" y="106">4</text>
    <text x="163" y="106">9</text>
    <text x="221" y="106">16</text>
  </g>
  <text x="279" y="107" font-family="system-ui, sans-serif" font-weight="700" font-size="30" text-anchor="middle" fill="#5b4ee8">?</text>
  <g font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" fill="#8a919e">
    <text x="76" y="148">+3</text>
    <text x="134" y="148">+5</text>
    <text x="192" y="148">+7</text>
    <text x="250" y="148" fill="#5b4ee8">+9</text>
  </g>
</svg>
