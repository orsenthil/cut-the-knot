<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Bad Limit: a big square, the diamond of side midpoints, and the
       staircase that follows it. Mid-tone so it reads on light and dark. -->
  <rect x="90" y="30" width="140" height="140" fill="none" stroke="#7b86a8" stroke-width="3"/>
  <polygon points="160,30 90,100 160,170 230,100" fill="none" stroke="#9a8fff" stroke-width="3"/>
  <polyline points="160,30 136.67,30 136.67,53.33 113.33,53.33 113.33,76.67 90,76.67 90,100"
            fill="none" stroke="#d98a4a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="90,100 113.33,100 113.33,123.33 136.67,123.33 136.67,146.67 160,146.67 160,170"
            fill="none" stroke="#d98a4a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#9a8fff">
    <circle cx="160" cy="30" r="4"/>
    <circle cx="90" cy="100" r="4"/>
    <circle cx="160" cy="170" r="4"/>
    <circle cx="230" cy="100" r="4"/>
  </g>
</svg>
