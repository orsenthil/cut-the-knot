<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Directed numbers with arrows showing the largest mobile number being swapped with its neighbour">
  <g font-family="ui-monospace, monospace" font-size="20" text-anchor="middle">
    <rect x="24" y="50" width="56" height="56" rx="10" fill="#2f3542" stroke="#aab4c4" stroke-width="2"/>
    <text x="52" y="85" fill="#e9eef6">&lt;1</text>
    <rect x="96" y="50" width="56" height="56" rx="10" fill="#2f3542" stroke="#aab4c4" stroke-width="2"/>
    <text x="124" y="85" fill="#e9eef6">&lt;2</text>
    <rect x="168" y="50" width="56" height="56" rx="10" fill="#6a5df0" stroke="#c4bcff" stroke-width="3"/>
    <text x="196" y="85" fill="#fff">&lt;3</text>
    <rect x="240" y="50" width="56" height="56" rx="10" fill="#2f3542" stroke="#aab4c4" stroke-width="2"/>
