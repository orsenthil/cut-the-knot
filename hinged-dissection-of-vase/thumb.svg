<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The vase and the square it becomes: three hinged quarter-disks. -->
  <g stroke="#4b5563" stroke-width="2.4" stroke-linejoin="round">
    <!-- vase: three coloured quarters of the bowl -->
    <path d="M88 140 L110.6 117.4 A32 32 0 0 1 110.6 162.6 Z" fill="#d8574f"/>
    <path d="M88 140 L110.6 162.6 A32 32 0 0 1 65.4 162.6 Z" fill="#4b8eea"/>
    <path d="M88 140 L65.4 162.6 A32 32 0 0 1 65.4 117.4 Z" fill="#3a9462"/>
    <!-- the neck: two inward arcs and the shallow top arc -->
    <path d="M110.65 119.15 A32 32 0 0 1 110.65 74.15" fill="none"/>
    <path d="M65.35 74.15 A32 32 0 0 1 65.35 119.15" fill="none"/>
    <path d="M65.4 74.1 A32 32 0 0 0 110.6 74.1" fill="none"/>
  </g>
  <path d="M225 140 L270.25 94.75 L225 49.5 L179.75 94.75 Z" fill="none" stroke="#8b93a7" stroke-width="2.4"/>
  <g stroke="#4b5563" stroke-width="2" stroke-linejoin="round">
    <path d="M270 95 L247.4 72.4 A32 32 0 0 0 247.4 117.6 Z" fill="#d8574f"/>
    <path d="M225 49.5 L202.4 72.1 A32 32 0 0 0 247.6 72.1 Z" fill="#4b8eea"/>
    <path d="M179.75 94.75 L202.1 117.4 A32 32 0 0 1 202.1 72.1 Z" fill="#3a9462"/>
  </g>
  <path d="M150 100 L168 100 M172 96 L168 100 L172 104" fill="none" stroke="#8b93a7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
