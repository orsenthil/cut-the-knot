<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Plus or minus expression">
  <rect width="320" height="200" fill="transparent"/>
  <g font-family="system-ui, sans-serif" font-size="36" font-weight="700" text-anchor="middle">
    <text x="40" y="110" fill="#3d4a5c">1</text>
    <rect x="58" y="78" width="40" height="40" rx="8" fill="#dfe7f2" stroke="#3d7ea6" stroke-width="2"/>
    <text x="78" y="108" fill="#3d7ea6">+</text>
    <text x="120" y="110" fill="#3d4a5c">2</text>
    <rect x="138" y="78" width="40" height="40" rx="8" fill="#e8edf4" stroke="#5a6578" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="158" y="108" fill="#8a93a3">·</text>
    <text x="200" y="110" fill="#3d4a5c">3</text>
    <rect x="218" y="78" width="40" height="40" rx="8" fill="#e8edf4" stroke="#5a6578" stroke-width="1.5"/>
    <text x="238" y="108" fill="#3d4a5c">−</text>
    <text x="280" y="110" fill="#3d4a5c">4</text>
  </g>
</svg>
