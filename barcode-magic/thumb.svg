<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="A UPC-A barcode with one digit replaced by a question mark">
  <g fill="none" stroke="#8b97a8" stroke-width="2">
    <rect x="14" y="14" width="292" height="172" rx="14"/>
  </g>
  <!-- the twelve digits, with one left blank -->
  <g font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle" fill="#a3adbc">
    <text x="38" y="52">0</text><text x="62" y="52">3</text><text x="86" y="52">6</text>
    <text x="110" y="52">0</text><text x="134" y="52">0</text><text x="158" y="52">0</text>
    <text x="182" y="52">2</text><text x="206" y="52">9</text>
    <text x="230" y="52" fill="#d8a24a">?</text>
    <text x="254" y="52">4</text><text x="278" y="52">5</text>
  </g>
  <!-- guard bars and digit bars: the blank is one solid amber block -->
  <g fill="#8b97a8">
    <rect x="30" y="78" width="4" height="82" rx="1"/>
    <rect x="36" y="78" width="3" height="82" rx="1"/>
    <rect x="43" y="78" width="4" height="82" rx="1"/>
    <rect x="54" y="90" width="3" height="58"/><rect x="60" y="90" width="5" height="58"/>
    <rect x="69" y="90" width="2" height="58"/><rect x="74" y="90" width="4" height="58"/>
    <rect x="82" y="90" width="5" height="58"/><rect x="90" y="90" width="2" height="58"/>
    <rect x="96" y="90" width="3" height="58"/><rect x="102" y="90" width="5" height="58"/>
    <rect x="111" y="90" width="2" height="58"/><rect x="116" y="90" width="4" height="58"/>
    <rect x="123" y="90" width="3" height="58"/><rect x="129" y="90" width="5" height="58"/>
    <rect x="138" y="78" width="3" height="82" rx="1"/><rect x="144" y="78" width="4" height="82" rx="1"/>
    <rect x="151" y="78" width="3" height="82" rx="1"/><rect x="157" y="78" width="3" height="82" rx="1"/>
    <rect x="164" y="78" width="4" height="82" rx="1"/>
    <rect x="176" y="90" width="3" height="58"/><rect x="182" y="90" width="5" height="58"/>
    <rect x="190" y="90" width="4" height="58"/><rect x="197" y="90" width="2" height="58"/>
    <rect x="202" y="90" width="3" height="58"/><rect x="208" y="90" width="5" height="58"/>
    <rect x="216" y="90" width="2" height="58"/><rect x="221" y="90" width="4" height="58"/>
    <rect x="228" y="90" width="3" height="58"/><rect x="234" y="90" width="5" height="58"/>
    <rect x="242" y="90" width="2" height="58"/><rect x="247" y="90" width="4" height="58"/>
    <rect x="255" y="90" width="3" height="58"/><rect x="261" y="90" width="5" height="58"/>
    <rect x="270" y="78" width="4" height="82" rx="1"/>
    <rect x="277" y="78" width="3" height="82" rx="1"/>
    <rect x="284" y="78" width="4" height="82" rx="1"/>
  </g>
  <!-- the missing digit: a tall solid block where the bars would be -->
  <rect x="224" y="74" width="20" height="90" rx="3" fill="#d8a24a"/>
  <text x="234" y="132" font-family="ui-sans-serif, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#3d4655">?</text>
</svg>
