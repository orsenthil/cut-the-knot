<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- cevians of the two triangles -->
    <g stroke="#8a93a3" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.85">
      <path d="M75 55 L95 105 M45 145 L95 105 M150 120 L95 105"/>
      <path d="M185 60 L225 112 M275 85 L225 112 M230 165 L225 112"/>
    </g>
