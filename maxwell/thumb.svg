    <path d="M185 60 L275 85 L230 165 Z" stroke="#35b56a" stroke-width="3.2"/>
  </g>
  <g fill="#6f63ef">
    <circle cx="75" cy="55" r="5"/><circle cx="45" cy="145" r="5"/><circle cx="150" cy="120" r="5"/>
  </g>
  <g fill="#35b56a">
    <circle cx="185" cy="60" r="5"/><circle cx="275" cy="85" r="5"/><circle cx="230" cy="165" r="5"/>
  </g>
  <circle cx="95" cy="105" r="7" fill="#6f63ef" stroke="#ffffff" stroke-width="1.6"/>
  <circle cx="225" cy="112" r="7" fill="#35b56a" stroke="#ffffff" stroke-width="1.6"/>
</svg>
