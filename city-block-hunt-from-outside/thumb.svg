<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A 4x4 treasure grid inside its ring of outside strips. One outside
       touch has given the clue 4; the lit diagonal still holds the treasure. -->
  <rect x="50" y="10" width="180" height="180" rx="10" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/>
  <g fill="none" stroke="#6b7280" stroke-width="2">
    <path d="M80 40 H200 M80 70 H200 M80 100 H200 M80 130 H200 M80 160 H200"/>
    <path d="M80 40 V160 M110 40 V160 M140 40 V160 M170 40 V160 M200 40 V160"/>
  </g>
  <g fill="#8f86ff" opacity="0.38">
    <rect x="81" y="41" width="28" height="28" rx="3"/>
    <rect x="111" y="71" width="28" height="28" rx="3"/>
    <rect x="141" y="101" width="28" height="28" rx="3"/>
    <rect x="171" y="131" width="28" height="28" rx="3"/>
  </g>
  <g>
    <rect x="176" y="137" width="18" height="14" rx="3" fill="#d9a441"/>
    <path d="M176 143 H194" stroke="#6b7280" stroke-width="2"/>
  </g>
  <text x="95" y="27" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#d9a441">4</text>
</svg>
