<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A factor tree: 36 splits into 4 and 9, then into 2, 2, 3 and 3.
       Mid-tone strokes and light fills read on both white and near-black. -->
  <g stroke="#6b7280" stroke-width="2.5" fill="none">
    <path d="M160 62 L100 102 M160 62 L220 102"/>
    <path d="M100 134 L60 168 M100 134 L140 168 M220 134 L180 168 M220 134 L260 168"/>
  </g>
  <g fill="#e9edf3" stroke="#6b7280" stroke-width="2">
    <rect x="134" y="24" width="52" height="38" rx="10"/>
    <rect x="76" y="102" width="48" height="34" rx="9"/>
    <rect x="196" y="102" width="48" height="34" rx="9"/>
    <rect x="40" y="168" width="40" height="30" rx="8"/>
    <rect x="120" y="168" width="40" height="30" rx="8"/>
    <rect x="160" y="168" width="40" height="30" rx="8"/>
    <rect x="240" y="168" width="40" height="30" rx="8"/>
  </g>
  <g fill="#2b3240" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <text x="160" y="50">36</text>
    <text x="100" y="125">4</text>
    <text x="220" y="125">9</text>
    <text x="60" y="189">2</text>
    <text x="140" y="189">2</text>
    <text x="180" y="189">3</text>
    <text x="260" y="189">3</text>
  </g>
</svg>
