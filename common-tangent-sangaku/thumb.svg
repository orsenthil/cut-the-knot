    <path d="M 40 100 L 278 33"/>
    <path d="M 40 100 L 278 167"/>
  </g>
  <line x1="145" y1="39" x2="145" y2="161" stroke="#38ac9b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="180" cy="100" r="70" fill="#7c72e6" fill-opacity="0.16" stroke="#7c72e6" stroke-width="4"/>
  <circle cx="110" cy="100" r="35" fill="#d98b3a" fill-opacity="0.22" stroke="#d98b3a" stroke-width="4"/>
  <g fill="#9db0d4">
    <circle cx="40" cy="100" r="5"/>
    <circle cx="180" cy="100" r="5"/>
  </g>
  <circle cx="110" cy="100" r="6" fill="#e0a55f"/>
  <g fill="#5fc6b5">
    <circle cx="145" cy="39" r="4"/>
    <circle cx="145" cy="161" r="4"/>
  </g>
</svg>
