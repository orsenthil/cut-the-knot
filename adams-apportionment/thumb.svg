<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="An apportionment table with three states and a divisor being adjusted so the rounded-up quota column totals the number of seats">
  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <rect x="24" y="22" width="272" height="156" rx="10" fill="#3b4353" stroke="#aab4c4" stroke-width="2"/>
    <g font-size="12" fill="#dbe3ef" font-weight="700">
      <text x="55" y="48">State</text><text x="100" y="48">Pop.</text><text x="155" y="48">Std Q</text><text x="205" y="48">Mod Q</text><text x="260" y="48">Up Q</text>
    </g>
    <path d="M36 58 H284" stroke="#aab4c4" stroke-width="1.5"/>
    <g font-size="13" fill="#e9eef6">
      <text x="55" y="82">A</text><text x="100" y="82">307</text><text x="155" y="82">7.14</text><text x="205" y="82">6.81</text><text x="260" y="82">7</text>
      <text x="55" y="108">B</text><text x="100" y="108">524</text><text x="155" y="108">12.19</text><text x="205" y="108">11.64</text><text x="260" y="108">12</text>
      <text x="55" y="134">C</text><text x="100" y="134">169</text><text x="155" y="134">3.93</text><text x="205" y="134">3.75</text><text x="260" y="134">4</text>
    </g>
    <path d="M36 146 H284" stroke="#aab4c4" stroke-width="1.5"/>
    <g font-size="13" font-weight="700" fill="#f2f5fa">
      <text x="55" y="166">Total</text><text x="100" y="166">1000</text><text x="260" y="166">23</text>
    </g>
    <rect x="238" y="66" width="44" height="86" rx="6" fill="none" stroke="#d9a441" stroke-width="2.5" stroke-dasharray="5 4"/>
  </g>
</svg>
