<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- A cyclic quadrilateral: the bisectors meet on the circle at X and Y,
       and the extra points U, G, V sit on one straight line. -->
  <circle cx="160" cy="100" r="82" fill="none" stroke="#7d86c9" stroke-width="2"/>
  <polygon points="160,18 270,100 160,182 50,100" fill="none" stroke="#8f86ff" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#5d9c8f" stroke-width="2" stroke-dasharray="6 5" fill="none">
    <line x1="160" y1="18" x2="102" y2="158"/>
    <line x1="270" y1="100" x2="102" y2="158"/>
    <line x1="160" y1="182" x2="218" y2="42"/>
    <line x1="50" y1="100" x2="218" y2="42"/>
  </g>
  <g stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <line x1="160" y1="18" x2="160" y2="182"/>
    <line x1="50" y1="100" x2="270" y2="100"/>
  </g>
  <line x1="100" y1="100" x2="220" y2="100" stroke="#c08a5a" stroke-width="3"/>
  <g fill="#c084fc" stroke="#20242c" stroke-width="2">
    <circle cx="160" cy="18" r="5"/>
    <circle cx="270" cy="100" r="5"/>
    <circle cx="160" cy="182" r="5"/>
    <circle cx="50" cy="100" r="5"/>
    <circle cx="102" cy="158" r="5"/>
    <circle cx="218" cy="42" r="5"/>
  </g>
  <g fill="#4bbfa0" stroke="#20242c" stroke-width="2">
    <circle cx="118" cy="100" r="4"/>
    <circle cx="160" cy="100" r="4"/>
    <circle cx="202" cy="100" r="4"/>
  </g>
</svg>
