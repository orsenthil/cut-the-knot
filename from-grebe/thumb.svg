    <polygon points="120,140 190,140 190,195 120,195"/>
    <polygon points="190,140 245,100 205,45 150,85"/>
    <polygon points="150,85 95,55 65,110 120,140"/>
  </g>
  <g fill="none" stroke="#c2362b" stroke-width="1.8" stroke-opacity="0.8" stroke-dasharray="5 5">
    <path d="M120 140 L19 195 M190 140 L314 195 M150 85 L145 -30"/>
  </g>
  <polygon points="120,140 190,140 150,85" fill="none" stroke="#3b3b45" stroke-width="3.2" stroke-linejoin="round"/>
  <polygon points="141,128 164,128 149,113" fill="#2fa76b" fill-opacity="0.35" stroke="#2fa76b" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="152" cy="121" r="4" fill="#6d5ce0"/>
  <g fill="#3b3b45">
    <circle cx="120" cy="140" r="5"/>
    <circle cx="190" cy="140" r="5"/>
    <circle cx="150" cy="85" r="5"/>
  </g>
</svg>
