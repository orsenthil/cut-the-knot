<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Triangle, its three angle bisectors, the incenter and the incircle. -->
  <polygon points="70,165 70,45 255,105" fill="#8f86ff" fill-opacity="0.14"/>
  <g fill="none" stroke="#8f86ff" stroke-width="2.5" stroke-dasharray="7 5">
    <line x1="70" y1="165" x2="162.5" y2="75"/>
    <line x1="70" y1="45" x2="162.5" y2="75"/>
    <line x1="255" y1="105" x2="70" y2="105"/>
  </g>
  <polygon points="70,165 70,45 255,105" fill="none" stroke="#8f86ff" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="114" cy="105" r="43" fill="#4ade80" fill-opacity="0.14" stroke="#4ade80" stroke-width="2.5"/>
  <circle cx="114" cy="105" r="5.5" fill="#4ade80"/>
  <g fill="#8f86ff">
    <circle cx="70" cy="165" r="5"/>
    <circle cx="70" cy="45" r="5"/>
    <circle cx="255" cy="105" r="5"/>
  </g>
</svg>
