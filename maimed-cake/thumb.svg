<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- The key moment: a rectangle has lost its top-right corner, and one
       straight cut from B to Q leaves two equal pieces. Mid-tones read on
       both white and near-black; the background stays transparent. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- the two equal pieces of the remaining cake -->
    <polygon points="50,30 50,165 200,60 200,30" fill="#8f86ff" fill-opacity="0.55"/>
    <polygon points="50,165 270,165 270,100 200,100 200,60" fill="#4f9d78" fill-opacity="0.5"/>
    <!-- the missing corner, and the outline of what is left -->
    <polygon points="200,30 270,30 270,100 200,100" fill="#e08a3c" fill-opacity="0.18"
             stroke="#e08a3c" stroke-width="2" stroke-dasharray="5 4"/>
    <polygon points="50,30 50,165 270,165 270,100 200,100 200,30" fill="none"
             stroke="#7b8397" stroke-width="4"/>
    <!-- the single cut -->
    <line x1="50" y1="165" x2="200" y2="60" stroke="#e08a3c" stroke-width="5"/>
  </g>
  <g fill="#e08a3c">
    <circle cx="50" cy="165" r="5"/><circle cx="200" cy="100" r="5"/>
  </g>
  <g fill="#7b8397">
    <circle cx="50" cy="30" r="4"/><circle cx="270" cy="165" r="4"/>
  </g>
</svg>
