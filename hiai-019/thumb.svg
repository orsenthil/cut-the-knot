    <circle cx="172" cy="64" r="39" stroke="#6b7f9e" stroke-width="2" stroke-dasharray="5 4"/>
    <polygon points="205,100 110,146 105,52" fill="#c08a5a" fill-opacity="0.16" stroke="#b0653c" stroke-width="2.5"/>
    <polygon points="205,100 110,146 181,138" fill="#4f9b80" fill-opacity="0.16" stroke="#4f9b80" stroke-width="1.6"/>
    <polygon points="110,146 105,52 154,87" fill="#8474ab" fill-opacity="0.14" stroke="#8474ab" stroke-width="1.6"/>
    <polygon points="105,52 205,100 150,42" fill="#5c86b5" fill-opacity="0.14" stroke="#5c86b5" stroke-width="1.6"/>
