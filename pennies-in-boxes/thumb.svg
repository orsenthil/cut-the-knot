<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Pennies in Boxes: the fuller box pays the other exactly what it holds,
       so the smaller pile doubles. Here 5 pays 3 and the 3 becomes 6. -->
  <rect x="27" y="46" width="74" height="96" rx="10" fill="none" stroke="#8a8f99" stroke-opacity="0.65" stroke-width="2.5"/>
    <circle cx="39" cy="126" r="6" fill="#c87d3f"/>
    <circle cx="52" cy="126" r="6" fill="#c87d3f"/>
    <circle cx="65" cy="126" r="6" fill="#c87d3f"/>
  <text x="64" y="38" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#8a8f99">3</text>
  <rect x="123" y="46" width="74" height="96" rx="10" fill="none" stroke="#8a8f99" stroke-opacity="0.65" stroke-width="2.5"/>
    <circle cx="135" cy="126" r="6" fill="#c87d3f"/>
    <circle cx="148" cy="126" r="6" fill="#c87d3f"/>
    <circle cx="161" cy="126" r="6" fill="#c87d3f"/>
    <circle cx="174" cy="126" r="6" fill="#c87d3f"/>
    <circle cx="187" cy="126" r="6" fill="#c87d3f"/>
  <text x="160" y="38" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#8a8f99">5</text>
  <rect x="219" y="46" width="74" height="96" rx="10" fill="none" stroke="#8a8f99" stroke-opacity="0.65" stroke-width="2.5"/>
    <circle cx="231" cy="126" r="6" fill="#c87d3f"/>
    <circle cx="244" cy="126" r="6" fill="#c87d3f"/>
    <circle cx="257" cy="126" r="6" fill="#c87d3f"/>
    <circle cx="270" cy="126" r="6" fill="#c87d3f"/>
    <circle cx="283" cy="126" r="6" fill="#c87d3f"/>
    <circle cx="231" cy="112" r="6" fill="#c87d3f"/>
    <circle cx="244" cy="112" r="6" fill="#c87d3f"/>
    <circle cx="257" cy="112" r="6" fill="#c87d3f"/>
  <text x="256" y="38" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#8a8f99">8</text>
  <path d="M 117 166 L 109 166" stroke="#6f66d6" stroke-width="4" fill="none" marker-end="url(#a)"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6f66d6"/></marker></defs>
  <text x="113" y="188" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#6f66d6">pays 3</text>
</svg>
