name = "coolmaths-tutor"
main = "src/index.ts"
compatibility_date = "2025-09-01"
# nodejs_compat gives the MCP SDK the few node: builtins it reaches for.
compatibility_flags = ["nodejs_compat"]

# Explicit, so the endpoint is always
# https://coolmaths-tutor.<account-subdomain>.workers.dev/mcp
# rather than depending on the default for a worker with no routes.
workers_dev = true

[observability]
enabled = true
