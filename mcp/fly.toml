# Fly.io config for the coolmaths tutor. Deploy from the repository root:
#
#   fly deploy --config mcp/fly.toml --dockerfile mcp/Dockerfile
#
# The app name is also the public hostname: https://<app>.fly.dev/mcp

app = "coolmaths-tutor"
primary_region = "sjc"

[http_service]
  internal_port = 8080
  force_https = true
  # Stop when idle and start on the next request: the server is stateless,
  # so a cold start costs a second or two and nothing is lost.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
