        d="M30 150 A130 130 0 0 1 290 150 Z
           M30 150 A40 40 0 0 1 110 150 Z
           M110 150 A90 90 0 0 1 290 150 Z"/>
  <g fill="none" stroke="#7d8bd4" stroke-width="2.5" stroke-linecap="round">
    <path d="M30 150 A130 130 0 0 1 290 150"/>
    <path d="M30 150 A40 40 0 0 1 110 150"/>
    <path d="M110 150 A90 90 0 0 1 290 150"/>
  </g>
  <path d="M30 150H290" fill="none" stroke="#9aa6e8" stroke-width="2"/>
  <circle cx="110" cy="90" r="60" fill="#c98b4b" fill-opacity="0.12"
          stroke="#c98b4b" stroke-width="2.5" stroke-dasharray="6 4"/>
  <path d="M110 150V30" fill="none" stroke="#c98b4b" stroke-width="3"/>
  <g fill="#c98b4b">
