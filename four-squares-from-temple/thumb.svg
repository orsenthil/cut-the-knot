<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <title>Four hinged squares with the two middle squares highlighted</title>
  <!-- The line-up: A, B and C are level, and the blue square is twice the gold one. -->
  <line x1="10" y1="170" x2="305" y2="170" stroke="#c46d78" stroke-width="2" stroke-dasharray="7 6"/>
  <g stroke="#7f8796" stroke-width="1.5" fill="none" stroke-linejoin="round">
    <polygon points="18,95 45,170 93,68 120,143"/>
    <polygon points="255,170 280,88 198,63 173,145"/>
  </g>
  <polygon points="145,170 120,143 148,118 173,145" fill="#c99a45" fill-opacity="0.35" stroke="#c99a45" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="148,118 198,63 143,13 93,68" fill="#708fd0" fill-opacity="0.3" stroke="#708fd0" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#596274">
    <circle cx="45" cy="170" r="4"/>
    <circle cx="145" cy="170" r="4"/>
    <circle cx="255" cy="170" r="4"/>
    <circle cx="148" cy="118" r="4"/>
  </g>
</svg>
